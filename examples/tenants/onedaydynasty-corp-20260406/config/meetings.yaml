  end_time: 2026-04-05T13:30:00Z
  id: meeting-003
  invitees:
  - arossi
  - jmensa
  location: Sales Team Office
  organizer: arossi
  start_time: 2026-04-05T13:00:00Z
  title: 'Investor Inquiry Follow-Up: Subscription Retention Metrics'
  transcript: "Alessandro Rossi: Alright, Joy, thanks for joining. Let's dive into the investor inquiry about subscription retention metrics. Can you hear me okay?\n\nJoy Mensa: Yep, loud and clear. I had a quick look at the inquiry earlier. Seems straightforward, but there are a couple of nuances we need to address.\n\nAlessandro Rossi: Agreed. So, the investor wants detailed retention data, specifically our churn rates, retention over time, and how our metrics compare within the industry. Do we have all that data compiled?\n\nJoy Mensa: We do have most of it. The churn rate is sitting at 8% annually, and our monthly retention rate is about 92%. But I think we need to include some qualitative analysis too. For instance, why do customers stick around? What's driving that retention?\n\nAlessandro Rossi: Absolutely. Also, let's highlight the SaaS industry average. I believe the average churn for similar companies is around 10-12%, so we're outperforming, but we need to frame that properly.\n\nJoy Mensa: Right, but there’s also the issue of how we categorize churn. You know, voluntary versus involuntary churn. Should we break that down for them?\n\nAlessandro Rossi: Good point. Voluntary churn—customers opting not to renew—was 5%, and involuntary churn—failed payments, etc.—was 3%. Hmm, speaking of failed payments, wasn’t there a customer complaint about payment processing yesterday?\n\nJoy Mensa: Yeah, there was. The tech team resolved it within a couple of hours. Should we mention that in the response, or is it irrelevant?\n\nAlessandro Rossi: Let’s keep it offline for now unless the investor explicitly asks about payment reliability. We don’t want to introduce concerns unnecessarily.\n\nJoy Mensa: Makes sense. Oh, speaking of framing data, do we have a visual representation of retention trends over the last 12 months? That could really help sell the story.\n\nAlessandro Rossi: Good idea. I’ll ask the analytics team to pull a retention graph showing month-by-month trends. Let’s layer in the customer success stories from the blog post for context—tie retention to real outcomes.\n\nJoy Mensa: Perfect. Another thought: should we address cohort analysis? Like, retention rates by customer segments—enterprise versus SMB?\n\nAlessandro Rossi: Hmm, let’s keep it simple for now. If they ask for more granularity, we can drill down later. We don’t want to overwhelm them with too much detail upfront.\n\nJoy Mensa: Gotcha. One last thing—do we mention our projected retention metrics for the pre-IPO phase?\n\nAlessandro Rossi: I’d say yes, but cautiously. Let’s present it as a forward-looking statement, not as a guarantee. The CEO touched on this in the draft presentation yesterday, so we can pull some language from there.\n\nJoy Mensa: Alright, sounds like a plan. Action items: I’ll draft the response and include qualitative analysis tied to the customer success stories. You’ll get the retention graph from analytics and tweak the framing based on the pre-IPO projections?\n\nAlessandro Rossi: Correct. Let’s aim to finalize this by end-of-day. Anything else?\n\nJoy Mensa: Nope, that covers it for me.\n\nAlessandro Rossi: Great. Thanks, Joy. Talk soon."

    I hope you’re all doing okay given everything that’s been going on. I wanted to reach out regarding something that a few of us have been discussing quietly in the aftermath of yesterday's... events. With the cryptic HR email and the budget shifting so heavily toward AI initiatives, it’s hard not to read between the lines. I know there’s been a lot of unease about what this might mean for developers like us.

    A few of us have decided to set up an informal support network to help each other navigate whatever changes might be coming. The idea is to share job leads, resources, tips, and maybe even collaborate on freelance projects if it comes to that. It's still early days, but we’re hoping this can be a way to stay connected and support one another, especially if layoffs do happen next year.

    Would you be interested in joining? We’re planning to create a Slack channel (or maybe Discord—still debating what’s easiest) to keep everything organized. If you’re in, let me know, and feel free to suggest anything you think would be helpful to include in the group. For example, I was thinking we could add a section for interview prep resources, but I’d love to hear your thoughts.

    Also, quick question: have any of you heard anything more concrete about the ‘organizational changes’ hinted at in the HR email? I’ve been trying to gauge if there’s any timeline or specifics floating around, but so far, it’s been a lot of speculation.

    Anyway, let me know if you’re on board, and I can send you an invite once we have the space set up. Hope to hear from you soon!

    Cheers,
    Yuki


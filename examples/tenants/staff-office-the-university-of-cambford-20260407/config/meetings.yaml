  title: Finance Team Budget Review
  transcript: "Neha Pande: Hi everyone, thanks for joining today's Finance Team Budget Review meeting. Let’s make this quick and efficient since I know everyone’s busy. Can you all hear me clearly?\nAna Ramirez: Yes, loud and clear, Neha. Thanks for organizing this.\nYolanda Silva: Same here. All good on my end.\n\nNeha Pande: Great. So, the main item on the agenda today is reviewing our department's budget allocations for Orientation Day. Specifically, we need to ensure we’re staying within budget for all planned expenses. As of yesterday, the logistics team confirmed delivery of refreshments and equipment. I want to make sure those costs align with what we projected. Ana, can you start us off with an overview of the current status?\n\nAna Ramirez: Sure thing. So, right now, we’ve allocated $7,500 for Orientation Day, which includes $3,000 for food and beverages, $2,000 for printed materials like pamphlets and schedules, $1,500 for equipment and setup, and $1,000 as a buffer for unexpected costs. The logistics team’s invoice for refreshments came in at $3,200, which is slightly over budget. I believe they added some last-minute items like vegan and gluten-free options.\n\nNeha Pande: Hmm. That’s not ideal, but it’s not a major overrun. Yolanda, were you aware of this addition?\n\nYolanda Silva: Yes, I was. The feedback from last year’s Orientation Day was that we didn’t offer enough dietary options, so we decided to address that this time. I thought it was worth the extra cost, but I probably should’ve flagged it earlier—sorry about that.\n\nNeha Pande: It’s okay, Yolanda. I understand the intent, and it’s a good call to be inclusive. But let’s make sure we document these decisions moving forward. Transparency will help us justify these adjustments if anyone questions the budget later. Ana, can we shift some funds to cover this?\n\nAna Ramirez: Definitely. We still have the $1,000 buffer, so we can allocate $200 from that. I’ll adjust the spreadsheet after this meeting. That leaves us with $800 in the buffer.\n\nYolanda Silva: Perfect. Thanks, Ana.\n\nNeha Pande: Okay, next up—printed materials. I saw the final pamphlets yesterday, and they look great. Ana, are we on track with costs here?\n\nAna Ramirez: Yes, thankfully the printing costs stayed within the $2,000 allocation. No surprises there.\n\nNeha Pande: Good to hear. And how about equipment and setup—any updates?\n\nYolanda Silva: The logistics team confirmed everything is ready to go. They managed to negotiate a slight discount with the AV supplier, so we’re actually coming in $200 under budget on that line item.\n\nNeha Pande: That’s excellent news. Let’s redirect that $200 into the buffer as well. That brings it back to $1,000, correct?\n\nAna Ramirez: Correct. I’ll make that adjustment too.\n\nNeha Pande: Perfect. Now, before we wrap up, is there anything else related to Orientation Day expenses that we need to address?\n\nAna Ramirez: Not on my end. Everything else seems to be in order.\n\nYolanda Silva: Same here. But, Neha, I do have a quick unrelated question about next week’s departmental expense report—can we take five minutes to discuss that now?\n\nNeha Pande: Hmm, I’d rather not derail the meeting. Let’s take that offline, Yolanda. Send me an email, and we’ll set up some time to chat.\n\nYolanda Silva: Sounds good. Thanks, Neha.\n\nNeha Pande: Alright, if there’s nothing else, let’s summarize our action items. Ana, you’ll adjust the budget spreadsheet to reflect the updated allocations—$200 from the equipment savings and $200 from the buffer to cover the refreshments overrun. Yolanda, please document the decision to add dietary options for future reference. And I’ll notify the dean’s office that we’re staying on track financially. Anything I missed?\n\nAna Ramirez: Nope, that covers it.\n\nYolanda Silva: All good here.\n\nNeha Pande: Great. Thanks, everyone. Let’s reconvene next week to review the final expense report. Have a good day!\n\nAna Ramirez: You too. Bye!\n\nYolanda Silva: Bye, everyone!"

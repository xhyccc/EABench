  title: Re-admissions FAQ Update Discussion
  transcript: "Maria Garcia: Hi everyone, thanks for joining today. Let's get started since we have a lot to cover. The main focus for this meeting is to review the student inquiries about re-admissions deadlines and finalize updates to the FAQ page. Can everyone hear me okay?\n\nKenji Tanaka: Loud and clear, Maria.\n\nLayla Haddad: Yes, all good here.\n\nSamuel Mensah: Same here, no issues.\n\nChi Nguyen: I can hear you as well. Let’s dive in.\n\nMaria Garcia: Great. So, as you all know, we’ve been getting a lot of questions from students about the re-admissions deadlines. The most common confusion seems to be around the difference between the standard deadline and the late re-admissions deadline. Kenji, can you summarize the issues you noticed?\n\nKenji Tanaka: Sure. The main issue is that the dates aren’t clearly distinguished on the website. Students see “final deadline” and think it’s the only deadline available. We also had some students who didn’t realize late submissions come with a penalty fee.\n\nLayla Haddad: Exactly. I also had a few students email me asking if “final deadline” meant they couldn’t apply after that date at all. We need to clarify that late submissions are still possible but come with conditions.\n\nChi Nguyen: I noticed that too. I think part of the problem is that the FAQ doesn’t address edge cases, like what happens if a student’s application is incomplete by the final deadline. Do they have to reapply entirely? Or is there a grace period?\n\nMaria Garcia: Good point, Chi. That’s something we should address today. Samuel, did you notice any other recurring questions?\n\nSamuel Mensah: Yeah, I did. A lot of students were asking whether they need to reapply if they’ve already deferred their admission. It’s covered in the FAQ, but it’s buried under a different section. We might want to bring that front and center.\n\nMaria Garcia: Makes sense. Okay, so it sounds like the key updates we need to make are: 1) Distinguish between standard and late deadlines clearly, 2) Add a note about the late submission fee, 3) Clarify incomplete applications and grace periods, and 4) Highlight information about deferrals. Did I miss anything?\n\nLayla Haddad: I think that covers most of it. Oh, wait—actually, one more thing. Should we include something about how technical issues, like the portal glitch we had earlier this week, might impact deadlines?\n\nKenji Tanaka: That’s a good idea. We could add a note saying students should report technical issues immediately and provide a backup email for submissions.\n\nMaria Garcia: Agreed. Let’s include that. Chi, do you think we need to mention anything else while we’re at it?\n\nChi Nguyen: Hmm, not off the top of my head. But let me double-check the email chain from earlier this week; there might’ve been another question I’m forgetting. Give me a minute—sorry, my folder’s a bit of a mess.\n\nMaria Garcia: No worries, Chi. Take your time. While you’re looking, Layla, you mentioned the penalty fee earlier—how do you think we should phrase that to avoid scaring students?\n\nLayla Haddad: Good question. Maybe something like, “Late submissions are accepted up to X date, but please note that a processing fee of Y applies to ensure timely review.”\n\nKenji Tanaka: Yeah, I like that. It’s clear but not overly harsh.\n\nChi Nguyen: Okay, I’m back. The only other recurring question I found was about whether students can appeal if they miss the late deadline entirely. Do we want to address that?\n\nSamuel Mensah: We probably should. Even if the answer is no, it’s better to be upfront about it.\n\nMaria Garcia: Agreed. Let’s add a note about appeals and make it clear that exceptions are rare. Alright, I think we’ve got a solid list of updates. Anything else before we wrap up?\n\nKenji Tanaka: Just a quick question—who’s actually making the changes to the FAQ page? Do we need to coordinate with the web team, or is that something we can handle directly?\n\nMaria Garcia: Good question. I’ll take this offline with the web team after the meeting to confirm. If it’s something we can do directly, I’ll assign someone to it. Speaking of which, Kenji, could you draft the updated language for the penalty fee and late submissions? Layla, could you handle the section on technical issues?\n\nKenji Tanaka: Sure, I’ll get that done by tomorrow.\n\nLayla Haddad: No problem, I’ll have it ready by EOD today.\n\nMaria Garcia: Perfect. Chi, can you work on the section about incomplete applications and grace periods? And Samuel, could you take the deferrals section?\n\nChi Nguyen: Got it.\n\nSamuel Mensah: On it. I’ll make sure it’s easy to find on the page.\n\nMaria Garcia: Thanks, everyone. I’ll pull all the drafts together and send them over to the web team by the end of the week. If anything comes up in the meantime, just shoot me a message. Alright, I think we’re good to wrap up. Any last thoughts?\n\nKenji Tanaka: None from me.\n\nLayla Haddad: All set.\n\nSamuel Mensah: I’m good.\n\nChi Nguyen: Same here.\n\nMaria Garcia: Great. Thanks again, everyone. Let’s regroup next week to confirm everything’s been updated. Talk to you all soon!\n\nAll: Bye!"

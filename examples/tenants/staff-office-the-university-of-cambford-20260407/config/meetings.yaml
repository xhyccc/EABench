  title: RA/TA Applications Follow-Up
  transcript: "Samuel Mensah: Good afternoon, everyone. Can everyone hear me?\nJoy Okafor: Loud and clear, Samuel.\nFrançois Dubois: Oui, I can hear you as well. All set.\nSamuel Mensah: Great. Let's dive into today's meeting. The agenda is to review the flagged RA and TA applications and coordinate follow-up emails. There are 15 applications flagged for missing documents. Joy, do we have the updated list?\nJoy Okafor: Yes, I have it here. I cross-checked this morning, and we still have 12 applications missing documents. Three students emailed back clarifications overnight.\nFrançois Dubois: Ah, excellent. Were their submissions complete?\nJoy Okafor: Almost. Two of them still forgot to upload their recommendation letters, so they’re still in the incomplete category.\nSamuel Mensah: Got it. Let's focus on the 12 applications first. François, you mentioned last week that some applicants faced technical issues uploading their documents. Is that still the case?\nFrançois Dubois: Yes, I followed up with IT yesterday. Apparently, the portal timeout issue is fixed now, but they recommend asking applicants to use Chrome for better compatibility.\nJoy Okafor: That’s good to know. Should we include that suggestion in the follow-up emails?\nSamuel Mensah: Definitely. Let's make it clear. François, do you have a template we can use for these emails?\nFrançois Dubois: Yes, I drafted one last week. I’ll share it after the meeting—though we may need to tweak it slightly for Chrome compatibility.\nSamuel Mensah: Sounds like a plan. Oh—hang on. Can you hear me? My screen just froze.\nJoy Okafor: We can hear you, Samuel. You just cut out for a second.\nSamuel Mensah: Okay, I’m back. Now, about the flagged applications—Joy, can you confirm if any of these students are international? They might need additional follow-up.\nJoy Okafor: Let me check… Yes, five of them are international students. I noticed one applicant didn’t provide their passport scan, which is usually required.\nFrançois Dubois: Should we send a separate email for international applicants? The requirements are slightly different.\nSamuel Mensah: Good point. Let’s create a separate template for them. François, can you handle that?\nFrançois Dubois: Oui, I’ll have it ready by tomorrow morning.\nJoy Okafor: Speaking of follow-ups, I think we should set a firm deadline for these students to submit their missing documents. Otherwise, it drags on.\nSamuel Mensah: Agreed. What’s a reasonable deadline? End of this week?\nFrançois Dubois: I think so. But maybe give international students an extra day or two, just in case there’s a time zone issue.\nJoy Okafor: Makes sense. Friday for domestic students, and Sunday for international students?\nSamuel Mensah: Perfect. Let’s include the deadlines in the follow-up emails. François, make sure the templates reflect that.\nFrançois Dubois: Understood.\nJoy Okafor: One quick question—what happens if someone doesn’t respond by the deadline? Should we mark their application as incomplete and move on?\nSamuel Mensah: Yes, but let’s send them one final reminder before marking them incomplete. It’s only fair.\nFrançois Dubois: Agreed. Also, should we CC the department heads on these follow-ups?\nSamuel Mensah: Hmm… Let’s take that offline for now. We don’t want to overwhelm them unnecessarily.\nJoy Okafor: Fair enough. Anything else we need to cover?\nSamuel Mensah: I think that’s everything for now. Action items—Joy will finalize the flagged list and send it to François. François will update the email templates and share them by tomorrow morning. Everyone will send follow-ups by Thursday. Any objections?\nFrançois Dubois: No objections here.\nJoy Okafor: All good on my end.\nSamuel Mensah: Great. Thanks, everyone. Talk to you later.\nFrançois Dubois: Merci. Have a good day.\nJoy Okafor: Bye!"
- agenda: Review draft of the welcome email for newly enrolled students.

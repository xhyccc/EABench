  title: Dean of Engineering Rehearsal Feedback
  transcript: "Hiroshi Matsuda: Good morning, Joseph. Can you hear me?\nJoseph Okonkwo: Morning, Hiroshi. Loud and clear. Can you hear me?\nHiroshi Matsuda: Yes, you're coming through fine. Let’s get started. So, we’re here to review the dean's rehearsal and finalize the audiovisual setup for the opening lecture. Did you get a chance to watch his rehearsal yesterday?\nJoseph Okonkwo: I did. Honestly, I think he made good progress since last week. The flow was much smoother, but there were still a few moments where he seemed to lose his train of thought.\nHiroshi Matsuda: Agreed. I think part of that comes down to the transitions between slides. He pauses a lot when moving from one topic to the next. Did you notice that?\nJoseph Okonkwo: Absolutely. I was going to suggest adding a few more transitional phrases to his script—something to tie the concepts together better.\nHiroshi Matsuda: Good idea. I’ll bring that up with him later today. I also noticed the slide animations were a bit... distracting. Some of them were overly flashy.\nJoseph Okonkwo: Oh, yes. That spinning text on slide five? Definitely needs to go.\nHiroshi Matsuda: Agreed. I think simpler is better, especially for an academic audience. Let’s flag that for the communications team.\nJoseph Okonkwo: By the way, did we confirm whether all the audiovisual equipment is set up? There was that last-minute request for extra extension cords on Tuesday.\nHiroshi Matsuda: Yes, the logistics team resolved that yesterday. Everything should be ready, but I’ll double-check after this meeting just to be safe.\nJoseph Okonkwo: Great. Oh, and one more thing: did anyone figure out why the dean wanted to rehearse again yesterday? I thought he was satisfied after Monday’s run-through.\nHiroshi Matsuda: He was, but apparently, he got some feedback from a professor in the humanities department. They suggested he slow down a bit during the technical sections. He wanted to test that out.\nJoseph Okonkwo: Makes sense. I did notice he was rushing through the slide on engineering ethics. Slowing down there might help.\nHiroshi Matsuda: Definitely. Speaking of feedback, we should talk about student engagement. The communications team received some input from a new student suggesting clearer instructions in the welcome email. Do we want to incorporate that into the lecture itself?\nJoseph Okonkwo: Hmm, that’s a good question. I think we should focus on keeping the lecture concise. Maybe we can add a QR code to the slides linking to a detailed FAQ page?\nHiroshi Matsuda: That’s a smart workaround. Let’s run that by the communications team. Switching gears for a second—how’s the pamphlet situation? I heard there was another reprint yesterday.\nJoseph Okonkwo: Yes, there was. A professor requested a last-minute addition, but the updated pages should be ready by this afternoon.\nHiroshi Matsuda: Good to hear. Okay, circling back to the audiovisual setup—did we finalize who’s managing the live stream?\nJoseph Okonkwo: Not yet. The IT department should be handling it, but I haven’t seen a confirmation email. Should we follow up?\nHiroshi Matsuda: Yes, let’s take that offline and check with them directly after this meeting.\nJoseph Okonkwo: Sounds good. Anything else we need to cover?\nHiroshi Matsuda: I think that’s everything on the agenda. To summarize, we need to:\n1. Flag the distracting slide animations for the communications team.\n2. Suggest adding transitional phrases to the dean's script.\n3. Confirm the audiovisual setup and live stream management.\n4. Coordinate with the communications team on adding a QR code to the lecture slides.\n5. Double-check the pamphlet reprint status.\nJoseph Okonkwo: Got it. Should we reconvene tomorrow to review progress?\nHiroshi Matsuda: Let’s touch base via email instead. I’ll send out updates by the end of the day.\nJoseph Okonkwo: Perfect. Thanks, Hiroshi.\nHiroshi Matsuda: Thank you, Joseph. Talk soon.\nJoseph Okonkwo: Bye.\nHiroshi Matsuda: Bye."

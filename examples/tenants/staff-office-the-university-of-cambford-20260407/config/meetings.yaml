  transcript: "Joy Okonkwo: Hi everyone, thanks for joining on such short notice. Can you hear me okay?\n\nMei Zhang: Yes, I can hear you! Loud and clear.\n\nFrançois Dubois: Oui, same here. All good on my end.\n\nJoy Okonkwo: Great. So, as you all saw from the agenda, we need to discuss adjusting the orientation day schedule to allow more time for the Q&A session during the dean’s opening lecture. He specifically requested this yesterday. Before we dive in, just a quick check—has everyone seen the latest version of the schedule?\n\nMei Zhang: I have. The one with the 10-minute buffer between the lecture and the breakout sessions, right?\n\nFrançois Dubois: Yes, I reviewed it this morning. Although, I noticed the timing for the lunch break seems pretty tight now.\n\nJoy Okonkwo: Exactly, François. That’s part of what we need to address. The dean wants at least 15 additional minutes for Q&A, which means we’ll have to shuffle things around. Mei, any initial thoughts on how we can accommodate that?\n\nMei Zhang: Hmm, well, we could cut five minutes from the opening remarks and maybe trim down the campus tour by 10 minutes. That should give us the extra time we need.\n\nFrançois Dubois: I like the idea of trimming the campus tour, but cutting the opening remarks might be tricky. The president is delivering those, and I doubt they’ll want their time reduced. Plus, there’s already a lot of content packed in there.\n\nJoy Okonkwo: Good point, François. Let’s not touch the president’s speech unless it’s absolutely necessary. Mei, would it be possible to shorten the department introductions instead? Those tend to run longer than planned anyway.\n\nMei Zhang: Hmm, that could work. Each department has 10 minutes currently, so we could ask them to keep it to 7 or 8 minutes max. That would free up some time.\n\nFrançois Dubois: Do we think the department heads will be okay with that? They might push back, especially if they’ve already prepped their slides.\n\nJoy Okonkwo: True, but it’s worth asking. Maybe we can frame it as a way to keep the schedule more efficient. Mei, can you draft an email to the department heads about this adjustment? Let’s see if they’re open to it.\n\nMei Zhang: Sure, I’ll do that after the meeting. Should I mention the reason why we’re making the change?\n\nJoy Okonkwo: Yes, definitely. Be transparent about the dean’s request for more Q&A time. That should help them understand the importance of the adjustment.\n\nFrançois Dubois: Speaking of transparency, do we need to loop in the logistics team about this? If we’re shifting the Q&A session, it might impact their setup timeline for the next event.\n\nJoy Okonkwo: Good catch, François. I’ll reach out to logistics after this and give them a heads-up. Anything else we might be overlooking?\n\nMei Zhang: Oh, one thing—do we need to inform the communications team about this? They’ll probably need to update the printed schedule in the pamphlets and the digital version on the website.\n\nJoy Okonkwo: Yes, absolutely. I’ll handle that as well. Anything else?\n\nFrançois Dubois: Just a quick thought—how are we handling the Q&A itself? Will the dean take live questions, or will students submit them ahead of time?\n\nJoy Okonkwo: Good question. Last I heard, the dean was okay with live questions, but I’ll confirm that too. If he changes his mind, we might need the IT team to set up a submission form or something.\n\nMei Zhang: Speaking of IT, didn’t they have some issues with the re-admissions portal recently? I remember seeing something about slowdowns. Are we confident their systems can handle any last-minute adjustments?\n\nJoy Okonkwo: That’s a good point, Mei, but let’s take that offline. I’ll follow up with IT separately to make sure everything’s running smoothly. Anything else before we wrap up?\n\nFrançois Dubois: Nothing from my side. Just let me know if you need help with anything.\n\nMei Zhang: Same here. I’ll draft that email to the department heads and send it by the end of the day.\n\nJoy Okonkwo: Perfect. To summarize the action items—Mei, you’ll email the department heads about shortening their introductions. I’ll notify logistics and the communications team about the schedule change and confirm with the dean about live versus pre-submitted questions. François, you’re good for now, but I’ll let you know if anything comes up. Thanks, everyone. Let’s aim to finalize this by tomorrow. Talk soon!\n\nMei Zhang: Thanks, Joy. Bye, everyone!\n\nFrançois Dubois: Merci, au revoir!\n\nJoy Okonkwo: Bye!"

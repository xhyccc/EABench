  transcript: "Samuel Mensah: Good afternoon, everyone. Let's get started. Thanks for making time today.\nYasmin Abdul: Afternoon, Samuel. Joy, can you hear us okay?\nJoy Okafor: Yes, I can hear you. Sorry, I just had to adjust my mic. Good afternoon!\nSamuel Mensah: Perfect. So, as you know, the agenda today is to begin reviewing the RA and TA applications that had missing documents but were recently updated. This is our opportunity to make progress on the hiring decisions. Does everyone have the applicant list I sent out yesterday?\nYasmin Abdul: Yes, got it right here.\nJoy Okafor: Same here. Though, I noticed some duplicates in the spreadsheet. Did anyone else see that?\nSamuel Mensah: Hmm, I didn’t catch that. Can you point out an example, Joy?\nJoy Okafor: Sure, let me check... Okay, under the RA applications, I see the name Daniel Osei listed twice. Both entries have the same email address, but different submission timestamps.\nYasmin Abdul: Oh, I see it now too. Maybe it’s a case of him resubmitting his application with updated documents?\nSamuel Mensah: That’s possible. Let me flag that to double-check with the admin team later. Thanks for catching that, Joy. Let’s move on for now. Did everyone get a chance to review the applications ahead of the meeting?\nYasmin Abdul: Yes, I went through most of them. Some of the updated applications are quite strong, especially for the TAs. I think we have a few solid candidates for the calculus and programming courses.\nJoy Okafor: Agreed. But before we dive into specifics, I wanted to ask—were we supposed to prioritize applicants who submitted their documents before the deadline extension, or are we treating everyone equally now?\nSamuel Mensah: Good question. Officially, we’re treating everyone equally since the extension was granted due to the portal issues. But let’s keep in mind the original deadlines when we discuss candidates, especially if we’re looking at two equally qualified individuals. Does that make sense?\nYasmin Abdul: Makes sense to me.\nJoy Okafor: Same here.\nSamuel Mensah: Great. Let’s start with the RA applications. Yasmin, you mentioned there were some strong contenders. Can you walk us through your top picks?\nYasmin Abdul: Sure. So, for the RA position in the materials science lab, I was really impressed with Amina Farouk. She has prior lab experience, submitted a strong personal statement, and her references were glowing. She’s also a current grad student in the department, which I think is a big plus for familiarity with the lab’s work.\nJoy Okafor: I agree on Amina. Her application stood out to me too. But did anyone notice she didn’t include her transcript in the original submission? It was only added after the follow-up email.\nSamuel Mensah: I did notice that. It’s something to consider, but I wouldn’t hold it against her too much, given how strong the rest of her application is. Yasmin, was there anyone else?\nYasmin Abdul: Yes, I also liked Michael Nartey. He’s new to the program but has a background in data analytics, which could be useful for the research group. However, his recommendation letters were a bit generic. I’m on the fence about him.\nJoy Okafor: Hmm, I wasn’t as impressed with Michael. He seems qualified, but I feel like he might struggle to balance the RA workload with his coursework since he’s just starting out.\nSamuel Mensah: That’s a fair point. Let’s keep him as a backup for now. Moving on to the TA applications—Joy, any standouts for you?\nJoy Okafor: Yes, I really liked Priya Shah for the programming TA role. Her teaching experience is solid, and she even included a detailed syllabus she created for a coding bootcamp she ran. It shows initiative and organizational skills.\nYasmin Abdul: Agreed. Priya seems like a great fit. But can we talk about Daniel Osei next? He applied for both an RA and a TA position, and I’m not sure where he’d be the best fit.\nSamuel Mensah: Good point. Looking at his application, I’d say he’s stronger as a TA, especially for calculus. His recommendation letters speak more to his teaching abilities than his research skills.\nJoy Okafor: I agree with that. He seems more passionate about teaching, based on his personal statement.\nSamuel Mensah: Alright, let’s tentatively slot him under the TA category. We’ll finalize that after confirming the duplicate issue on his application. Anything else we need to discuss?\nYasmin Abdul: Just a quick note—do we need to decide today, or should we wait until we’ve reviewed all the applications?\nSamuel Mensah: Good question. I think we should aim to finalize at least half of the decisions by the end of this week. That way, we have room for any follow-ups or second reviews.\nJoy Okafor: Sounds good to me.\nYasmin Abdul: Same here.\nSamuel Mensah: Great. Action items—Joy, can you follow up on the duplicate entry for Daniel Osei? Yasmin, can you draft a shortlist for the TA candidates based on today’s discussion? I’ll flag the admin team about Amina’s late transcript and double-check the deadlines for the remaining applications. Anything else?\nJoy Okafor: Nope, that covers it.\nYasmin Abdul: All set on my end.\nSamuel Mensah: Alright, thanks, team. Let’s reconvene later this week. Meeting adjourned."

  location: Dean’s Office, Room 101
  organizer: mzhang
  start_time: 2026-04-06T13:00:00Z
  title: Q&A Session Format Adjustment
  transcript: "Mei Zhang: Good afternoon, everyone. Thanks for joining today’s meeting on such short notice. I know everyone’s busy with final orientation prep. Let’s dive into the agenda: we’re here to discuss the addition of a moderator for the Dean of Engineering’s Q&A session. Any thoughts to kick us off?\n\nJoy Okonkwo: Hi Mei, can you hear me?\n\nMei Zhang: Yes, loud and clear, Joy. Go ahead.\n\nJoy Okonkwo: Perfect. I was just going to say, I think adding a moderator is a good idea. The dean’s Q&A sessions can sometimes go long or veer off-topic when there isn’t someone managing the flow. A moderator could help streamline things and make sure the questions stay relevant.\n\nMei Zhang: Absolutely. That was my thought as well. We’ve had feedback in the past that some audience members felt their questions didn’t get addressed, or that some participants monopolized the time. Joy Okafor, what’s your take?\n\nJoy Okafor: I agree with both of you. A moderator would definitely help. But we’ll need to be careful about how we select the person. It needs to be someone who can keep things professional but also approachable. And, uh—sorry, there’s some background noise here—can you still hear me?\n\nMei Zhang: Yes, we can hear you. No problem.\n\nJoy Okafor: Great, thanks. So, as I was saying, the moderator needs to have a clear understanding of the dean’s priorities and be able to handle any tricky or sensitive questions that might come up. Have we thought about who could take on this role?\n\nMei Zhang: That’s a good question. I was thinking it could be someone from the communications team since they’re already familiar with the dean’s messaging. But I’m open to suggestions.\n\nJoy Okonkwo: Hmm, someone from communications could work, but do they have enough experience managing a live audience? What about asking one of the senior faculty members? They’d have the authority to handle delicate questions and the respect of the audience.\n\nMei Zhang: That’s a valid point. My only concern with a faculty member is whether they’d be willing to take on this extra responsibility on such short notice. Orientation is just a few days away.\n\nJoy Okafor: We could ask Dr. Patel, maybe? She’s always been good at engaging with students during events. Actually, let me check her availability right now—one second. *[typing sounds]*\n\nMei Zhang: Sure, let us know what you find. In the meantime, let’s talk about the logistics of this adjustment. If we add a moderator, do we need to tweak the session timing? The dean already requested additional time for the Q&A—he wanted 15 minutes, but we might need more if a moderator is involved.\n\nJoy Okonkwo: I think 15 minutes should still be fine. The moderator’s role is to make things more efficient, not longer. They just need to set expectations at the beginning—like, “We’ll take five questions,” or something like that.\n\nMei Zhang: Good point. And I assume we’d need to brief the moderator ahead of time? Maybe give them a list of potential questions or topics to be prepared for?\n\nJoy Okonkwo: Definitely. A prep session is crucial. They don’t need to know every detail, but they should have talking points and know how to handle common or sensitive topics—like funding, research priorities, or student complaints.\n\nJoy Okafor: Agreed. Oh, I just checked—Dr. Patel is unavailable. She’s traveling for a conference this week.\n\nMei Zhang: Hmm, that’s unfortunate. Any other suggestions?\n\nJoy Okafor: What about someone from the student union? A senior member who’s already comfortable speaking at events?\n\nJoy Okonkwo: That could work, but we’d need to ensure they’re briefed thoroughly. Otherwise, they might not have the authority or confidence to step in if the discussion gets off-track.\n\nMei Zhang: True. Let’s add that as a backup option. I’ll reach out to the communications team first and see if they have someone who’s experienced and available. If not, we’ll explore the student union idea. Sound good?\n\nJoy Okafor: Works for me. One quick thing—are we planning to record the Q&A session? If so, the moderator should know that too. Sometimes knowing you’re being recorded makes you more cautious about what you say.\n\nMei Zhang: Good point. I’ll confirm with the AV team if the session is being recorded. Anything else we’re missing?\n\nJoy Okonkwo: Just one thing: if we’re adding a moderator, should we announce it to the audience beforehand, or just let it be a surprise?\n\nMei Zhang: Hmm, let’s take that offline. I’ll think about the messaging and run it by the communications team. Anything else?\n\nJoy Okafor: Nope, I think we’ve covered everything.\n\nMei Zhang: Great. So, action items: I’ll reach out to the communications team first thing and confirm if they have someone available to moderate. I’ll also check with AV about the recording. Joy O., can you draft a quick prep checklist for the moderator?\n\nJoy Okonkwo: Sure thing, I’ll send it by the end of the day.\n\nMei Zhang: Perfect. Joy O., can you follow up with the student union about potential moderators, just in case?\n\nJoy Okafor: Yep, I’ll handle that.\n\nMei Zhang: Awesome. Thanks, everyone, for your input. Let’s regroup in two days to finalize. Meeting adjourned!"

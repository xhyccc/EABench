  transcript: "Maria Garcia: Good morning, everyone. Can you all hear me?\nJoy Okonkwo: Loud and clear, Maria.\nAisha Kabir: Yes, I can hear you.\nFrançois Dubois: Oui, I hear you fine.\nMaria Garcia: Excellent. Let’s get started. The primary agenda for today is to discuss the adjustments needed for the orientation day schedule based on the updates we received from the registrar.\nJoy Okonkwo: Right, I saw the email last night. It looks like we need to shuffle the timing for the dean's opening lecture and some breakout sessions.\nAisha Kabir: Yes, and I noticed that the registrar also added a new session for international students. That wasn’t in the original draft we approved.\nMaria Garcia: Correct. Before we dive in, François, can you pull up the latest draft of the schedule?\nFrançois Dubois: Uh, give me a moment. *pause* Ah, here it is. Okay, I’m sharing my screen now. Can everyone see this?\nJoy Okonkwo: Not yet... oh, wait, there it is. Got it.\nAisha Kabir: Yep, I see it too.\nMaria Garcia: Great. So, the main changes we need to address are: first, moving the dean's lecture to a later time, and second, incorporating this new international student session without overlapping other critical activities.\nJoy Okonkwo: About the dean’s lecture—he specifically requested additional audiovisual equipment yesterday. Have we confirmed availability for that?\nMaria Garcia: I believe logistics was working on it. François, do you know if they managed to secure the equipment?\nFrançois Dubois: Hmm, I remember seeing an update this morning... let me check. *pause* Yes, they confirmed everything is ready. It shouldn’t affect the timing, but we’ll need to factor in setup and testing time.\nAisha Kabir: Speaking of timing, if we push the lecture later, we’ll need to notify students ASAP. The communications team just finalized the welcome email. Should we ask them to send a follow-up with the new schedule?\nMaria Garcia: That’s a good point. Let’s flag that as an action item. Joy, can you coordinate with the communications team on that?\nJoy Okonkwo: Sure, I’ll reach out to them right after this meeting.\nFrançois Dubois: On the new international student session, I see it’s scheduled for the same time as the campus tour. Won’t that create a conflict?\nMaria Garcia: Good catch. We can’t have students choosing between those two. Aisha, do you think we can move the tour to the afternoon?\nAisha Kabir: Possibly. But if we do that, we might run into issues with the RA-led dorm walkthroughs, which are also slotted for the afternoon.\nJoy Okonkwo: Hmm, maybe we can split the campus tour into two smaller sessions—one in the morning and one in the afternoon? That way, students can choose based on their availability.\nMaria Garcia: That’s an interesting idea. François, can you check if we have enough tour guides to make that feasible?\nFrançois Dubois: I’ll check with the logistics team after the meeting.\nAisha Kabir: One more thing—do we have an updated headcount for the international student session? The registrar’s email didn’t specify.\nMaria Garcia: I noticed that too. I’ll follow up with the registrar’s office to get that information.\nJoy Okonkwo: Also, not to go off-topic, but do we know if the reprinted pamphlets will be ready in time?\nMaria Garcia: Yes, the staff office confirmed this morning that they’ll be delivered by tomorrow afternoon.\nFrançois Dubois: Good, because I was starting to worry about that.\nMaria Garcia: Alright, let’s summarize our action items. Joy, you’ll coordinate with the communications team about sending a follow-up email with the updated schedule. François, you’ll check with logistics about splitting the campus tour into two sessions and ensure we have enough tour guides. I’ll follow up with the registrar to get the headcount for the international student session. Anything I missed?\nAisha Kabir: No, that covers everything I had.\nJoy Okonkwo: Same here.\nFrançois Dubois: Oui, all good on my end.\nMaria Garcia: Perfect. Thanks, everyone. Let’s aim to have these updates finalized by tomorrow so we can stay on track. Meeting adjourned.\nJoy Okonkwo: Thanks, Maria. Bye, everyone.\nAisha Kabir: Bye!\nFrançois Dubois: Au revoir!"

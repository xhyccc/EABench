  title: QR Code Issue - Pamphlet Update
  transcript: "Chi Nguyen: Hi everyone, can you hear me?\n\nKenji Tanaka: Yep, loud and clear.\n\nLayla Haddad: I can hear you. Hi, everyone.\n\nSamuel Mensah: Same here. Good to go.\n\nChi Nguyen: Great. Thanks for joining on short notice. As you know, we’ve had reports that the QR code for the campus map in the orientation pamphlets isn’t scanning correctly on some devices. This is becoming a bigger issue than we anticipated, and with orientation just around the corner, we need to resolve this quickly. Let’s dive in. Layla, can you provide an overview of what we know so far?\n\nLayla Haddad: Sure. So, the issue was flagged a couple of days ago by a student who reported that their phone couldn’t scan the QR code. Since then, we’ve done some quick testing, and it seems like the problem is mostly affecting older Android devices. The QR code works fine on most iPhones and newer Android models. We suspect it might be related to the resolution of the printed code or the default camera software on these older phones.\n\nKenji Tanaka: That makes sense. Some older devices have trouble focusing on high-density QR codes or codes with too much contrast. Did we test the QR code thoroughly before adding it to the pamphlets?\n\nChi Nguyen: That’s a good question, Kenji. Layla?\n\nLayla Haddad: We did test it, but it was mostly done on newer devices since those are more common among students. In hindsight, we should have included a broader range of devices in our testing.\n\nSamuel Mensah: Right, but hindsight doesn’t help us now. Do we know if this is a printing issue or a design issue? Because if it’s the print quality, we’d need to go back to the printer and redo the pamphlets. If it’s the design, we might just need to update the QR code and reprint that section.\n\nLayla Haddad: It seems to be a mix of both. The design of the QR code might have been too dense for smaller cameras to scan, and the print quality probably made it worse. I’ve already reached out to the printer to confirm the specs they used.\n\nChi Nguyen: Thanks, Layla. Samuel, I know you’ve worked on similar issues before. Do you have any suggestions on how we can address this quickly?\n\nSamuel Mensah: Yeah, a couple of things come to mind. First, we should generate a new QR code with a simpler design—maybe one that uses a shorter URL or a dynamic QR code generator. Second, we can add a short URL below the QR code in case someone’s device still can’t scan it. That way, they have a fallback.\n\nKenji Tanaka: I like the fallback idea. It’s simple and doesn’t rely on the QR code alone. But won’t reprinting take too long?\n\nLayla Haddad: Not necessarily. I’ve already talked to the printer, and they said they can prioritize a reprint if we get the updated design to them today. We’d only need to reprint the centerfold where the QR code is located, not the entire pamphlet.\n\nChi Nguyen: That’s good news. Let’s aim to finalize the updated QR code by the end of this meeting. Kenji, can you take the lead on generating a simpler QR code and running a quick round of testing?\n\nKenji Tanaka: Sure. I’ll use a dynamic QR code generator so we can update the destination link later if needed. I’ll also test it on a mix of devices to make sure it works well across the board.\n\nChi Nguyen: Great. Layla, once Kenji finishes testing, can you send the updated design to the printer?\n\nLayla Haddad: Absolutely. I’ll stay in touch with the printer and make sure they can meet the timeline.\n\nSamuel Mensah: One more thing—do we need to include instructions on how to use the QR code? Some people might not know how to scan it, especially if their default camera app doesn’t support QR codes.\n\nChi Nguyen: Good point. Let’s add a short line like “Scan using your phone’s camera or QR code app” below the code. Layla, can you make sure that’s included in the update?\n\nLayla Haddad: Will do.\n\nKenji Tanaka: Uh, sorry to interrupt—do we have a backup plan if the reprint doesn’t happen in time? Just thinking worst-case scenario here.\n\nChi Nguyen: Fair question. If the reprint gets delayed, we can print stickers with the updated QR code and short URL and manually apply them to the existing pamphlets. It’s not ideal, but it’s better than leaving the issue unresolved.\n\nLayla Haddad: That’s a good fallback. I’ll ask the printer if they can produce stickers as a backup while we finalize the reprint.\n\nChi Nguyen: Perfect. Okay, to recap—Kenji will create and test the updated QR code, Layla will coordinate with the printer for the reprint and stickers, and Samuel will draft a short line of instructions to add below the QR code. Let’s aim to have everything finalized by end of day. Any final questions or comments?\n\nSamuel Mensah: Nope, I think we’re good.\n\nKenji Tanaka: All clear on my end.\n\nLayla Haddad: Same here. Let’s get this done.\n\nChi Nguyen: Awesome. Thanks, everyone. Let’s regroup tomorrow to confirm everything is on track. Meeting adjourned."

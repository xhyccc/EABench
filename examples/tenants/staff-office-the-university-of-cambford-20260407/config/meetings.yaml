  transcript: "Maria Garcia: Hi everyone, can you hear me?\nLayla Haddad: Yes, loud and clear.\nChi Nguyen: I can hear you too, Maria.\nMaria Garcia: Great. Let’s get started. So, as you all know, we’re here to discuss the font feedback from Professor Michaels about the orientation pamphlets. He thinks we need a clearer font to improve readability. Thoughts?\nLayla Haddad: I agree. I think the current font, although stylish, is a bit hard to read, especially for longer paragraphs.\nChi Nguyen: Same here. When I first reviewed the pamphlets, I noticed some sections, especially the maps and schedules, could be a bit overwhelming in that font.\nMaria Garcia: That’s a good point. I think the maps are particularly dense, so improving the font readability would help a lot. Any suggestions for replacement fonts?\nLayla Haddad: What about Arial or Helvetica? They’re clean and professional.\nChi Nguyen: I like Helvetica, but it might feel a bit too plain for a university pamphlet. What about Calibri? It’s modern, but still simple enough to read.\nMaria Garcia: Calibri could work. Do we have any feedback from the design team on this?\nLayla Haddad: I spoke briefly with Darren from the design team. He mentioned that they prefer fonts with a bit more personality but are open to suggestions as long as it doesn’t compromise readability.\nChi Nguyen: What about a compromise? We could use Calibri for the body text and something slightly more stylish for the headings.\nMaria Garcia: Hmm, I like that. Maybe something like Garamond for the headings? It’s elegant but still legible.\nLayla Haddad: Garamond could work. But can I ask—has anyone tested how these fonts look when printed? Sometimes what looks good on screen doesn’t translate well to paper.\nChi Nguyen: Good point, Layla. I can run a quick test print with the suggested fonts and see how they look.\nMaria Garcia: Perfect, Chi. Let’s make that an action item. Could you test the fonts and share the results with us by tomorrow?\nChi Nguyen: Will do.\nLayla Haddad: While we’re on the topic, can I flag something else? I noticed that some of the pamphlet sections are a bit cramped. Should we consider adjusting the layout alongside the font change?\nMaria Garcia: That’s a valid point. But we’re really tight on time—orientation is just a few days away. Let’s focus on the font change for now and revisit the layout adjustments for next year’s pamphlets.\nLayla Haddad: Makes sense. I just wanted to bring it up.\nChi Nguyen: Oh, before I forget—has anyone double-checked the QR code functionality? We had an issue with one of the codes last week.\nMaria Garcia: Good catch, Chi. I believe IT resolved it, but let’s confirm. I’ll follow up with them after this meeting.\nLayla Haddad: Can we also ensure the final version of the pamphlet is proofread? We don’t want another typo situation like the welcome email.\nMaria Garcia: Absolutely. That’s non-negotiable. I’ll assign someone from the communications team to handle that. Anything else?\nChi Nguyen: One quick question—do we need to inform the dean about this change, or can we just implement it?\nMaria Garcia: Good question. I think we’re okay to proceed without looping him in, but I’ll send a quick email just to keep him in the loop.\nLayla Haddad: Sounds like we have a plan.\nMaria Garcia: Alright, let’s summarize the action items: Chi will test the suggested fonts and share the results by tomorrow. I’ll follow up with IT about the QR code functionality and assign a proofreader for the final pamphlet. Layla, could you check in with Darren one more time about the headings font?\nLayla Haddad: Sure, I’ll reach out to him today.\nMaria Garcia: Perfect. Thanks, everyone. I think we’re in a good place. Let’s reconvene tomorrow if needed.\nChi Nguyen: Thanks, Maria. Bye, everyone.\nLayla Haddad: Bye!\nMaria Garcia: Bye!"

  title: Opening Lecture Rehearsal
  transcript: "Joy Okonkwo: Hi everyone, thanks for joining this extra rehearsal session on such short notice. Can everyone hear me?\n\nHiroshi Matsuda: Yes, I can hear you, Joy. Loud and clear.\n\nMei Zhang: Same here. All good on my end.\n\nJoy Okonkwo: Great. So, the focus today is to run through the dean’s opening lecture one more time and address some of the timing issues with the presentation slides. As you all know, we noticed during the last rehearsal that one of the slides was staying on screen for too long, and it was throwing off the flow. I want to make sure we resolve that today. Any questions before we get started?\n\nMei Zhang: Just to confirm, are we sticking to the same slide deck as last time, or have there been any additional changes?\n\nJoy Okonkwo: Good question, Mei. The content of the slides is the same. The only adjustment we made was to the timing of the animations on slides 7 and 12. Hiroshi, can you confirm?\n\nHiroshi Matsuda: That’s correct. I adjusted the transition delay on those two slides based on the feedback we got. But we’ll need to see how it works during the run-through to make sure it’s synced with the dean’s script.\n\nMei Zhang: Got it. Thanks for clarifying.\n\nJoy Okonkwo: Alright, let’s get started then. I’ll play the presentation from the top. Mei, can you keep an eye on the timestamps and flag anything that feels off?\n\nMei Zhang: Will do.\n\n[Pauses as the presentation begins]\n\nJoy Okonkwo: Okay, this is slide 1. Everything looks fine here. Moving to slide 2.\n\nHiroshi Matsuda: Joy, sorry to interrupt. Can you pause for a second? I’m noticing a slight lag between when you click and when the slide actually transitions. It’s subtle but might throw things off.\n\nJoy Okonkwo: Huh, you’re right. Let me try again... Is it better now?\n\nHiroshi Matsuda: No, it’s still lagging slightly. Mei, are you seeing this on your end too?\n\nMei Zhang: Yeah, I noticed it. It’s a fraction of a second, but it might feel longer during the actual lecture.\n\nJoy Okonkwo: Okay, let’s note that and take it offline after the meeting. Hiroshi, can you investigate the cause? It might be a hardware issue on this laptop.\n\nHiroshi Matsuda: Sure, I’ll check it out after this.\n\nJoy Okonkwo: Alright, back to the presentation. Moving to slide 7... This was one of the slides we adjusted. How’s the timing looking?\n\nMei Zhang: Looks good to me. The bullet points are coming in at a much smoother pace now.\n\nHiroshi Matsuda: Agreed. It’s much better. Can we run through it one more time, though? Just to be sure?\n\nJoy Okonkwo: No problem. Rewinding to slide 7… Okay, here we go.\n\n[Pauses as slide 7 plays again]\n\nMei Zhang: Perfect. I think we’re good on this one.\n\nJoy Okonkwo: Awesome. Moving to slide 12 now... Oh, wait—hold on. I just noticed the dean’s notes for this slide are missing from the presenter view. Was this intentional?\n\nHiroshi Matsuda: No, that’s not intentional. Let me check... Yeah, it looks like the notes were accidentally deleted when I adjusted the slide timing. Sorry about that! I’ll restore them right after this meeting.\n\nMei Zhang: Good catch, Joy. Let’s make sure that’s fixed before the final rehearsal.\n\nJoy Okonkwo: Definitely. Alright, let’s finish the run-through. Moving to slide 13...\n\n[Pauses as the presentation continues]\n\nJoy Okonkwo: Okay, that’s the last slide. Overall, I think we’re in a much better place. Any final thoughts?\n\nMei Zhang: Just one. Can we add a quick cue in the script for the dean to pause slightly between slides 6 and 7? It feels like that transition could use a little breathing room.\n\nJoy Okonkwo: Good point. I’ll make a note to discuss that with him. Anything else?\n\nHiroshi Matsuda: Not from me. I’ll take care of the lag issue and restore the missing notes on slide 12.\n\nJoy Okonkwo: Perfect. Thanks, Hiroshi. Alright, action items before we wrap up: Hiroshi will investigate the lag and fix the notes on slide 12. Mei, make sure to send me a timestamp report from today’s session. I’ll follow up with the dean about the pause between slides 6 and 7. Anything I missed?\n\nMei Zhang: Nope, that covers it.\n\nHiroshi Matsuda: All good here.\n\nJoy Okonkwo: Great. Thanks, everyone. Let’s aim to have everything finalized before the final rehearsal tomorrow. Talk soon!\n\nMei Zhang: Thanks, Joy. Bye, everyone.\n\nHiroshi Matsuda: Bye!\n\nJoy Okonkwo: Bye!"

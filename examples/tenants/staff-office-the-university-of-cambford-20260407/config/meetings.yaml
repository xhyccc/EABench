  title: Orientation Pamphlet QR Code Update
  transcript: "Chi Nguyen: Hi Mei, can you hear me?\nMei Zhang: Yes, I can hear you. Can you hear me?\nChi Nguyen: Loud and clear. Thanks for hopping on such short notice.\nMei Zhang: No worries. I saw the request for the QR code update come through late yesterday. What’s the latest on your end?\nChi Nguyen: So, the dean’s office is pushing this as a priority. They think having a QR code that links directly to the campus maps will enhance accessibility for new students. Apparently, they’ve received some feedback from last year’s orientation that students had trouble navigating the campus.\nMei Zhang: Got it. Do we know where they want the QR code placed in the pamphlet? Front page? Back page?\nChi Nguyen: That’s the tricky part. Originally, they suggested the back page. But after looking at the layout, I think it might make more sense on the “Orientation Day Schedule” page. Thoughts?\nMei Zhang: Hmm. Let me think about that. The schedule page already has a lot going on, doesn’t it? Could we risk cluttering it?\nChi Nguyen: Yeah, that’s my concern too. But if we put it on the back page, I’m worried students might not notice it right away.\nMei Zhang: Good point. What about adding a small callout box on the front cover? Something like, “Need help finding your way? Scan here!”\nChi Nguyen: I like that. It’s front and center, and it grabs attention. But do we have enough time? The pamphlets are supposed to go to print tomorrow, right?\nMei Zhang: Correct. I think we can pull it off as long as we keep the design simple. I’ll check with the designer after this call to confirm they can squeeze it in.\nChi Nguyen: Okay, let’s do that. By the way, do we have the QR code link ready? Or is that something we still need to generate?\nMei Zhang: I believe the IT department already has a static link for the campus map. I’ll double-check, though. If they don’t, we might need to create one ourselves using a QR code generator.\nChi Nguyen: Perfect. Let’s just make sure it’s tested before we finalize the design. We don’t want a broken link on orientation day.\nMei Zhang: Agreed. Oh, one more thing—should we include a note about downloading the campus app? I know it also has navigation features.\nChi Nguyen: Hmm. That’s a good idea, but I think it might be too much to add last minute. Let’s save that for next year and focus on the QR code for now.\nMei Zhang: Makes sense. Okay, so just to summarize: I’ll check with the designer about adding the QR code to the front cover, confirm the link with IT, and ensure it’s tested. You’ll coordinate with printing to make sure they’re aware of the update. Anything else?\nChi Nguyen: That covers it. Oh, wait—do we need to loop in the dean’s office for approval?\nMei Zhang: Ugh, probably. I’ll send them a quick email with the updated design mockup once the designer has it ready. Let’s hope they’re fast with feedback.\nChi Nguyen: Fingers crossed. Okay, thanks so much, Mei. Let’s touch base again if anything comes up. Otherwise, I’ll follow up with you later today.\nMei Zhang: Sounds good. Talk soon. Bye!\nChi Nguyen: Bye!"

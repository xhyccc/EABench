  title: Catering Adjustments
  transcript: "Aisha Kabir: Hi everyone, let's get started. Can everyone hear me clearly?\n\nSamuel Mensah: Yep, loud and clear.\n\nYasmin Abdul: I can hear you, Aisha.\n\nAisha Kabir: Great. So, the main agenda today is to discuss the addition of vegetarian snack options for the orientation event. As you know, we received a last-minute request to accommodate more vegetarian preferences than we initially anticipated. I wanted us to brainstorm how we can adjust the menu without causing too much disruption to our existing plans. Thoughts?\n\nSamuel Mensah: Honestly, this is a bit of a curveball. I thought we had the menu locked down weeks ago. Did we get any specifics on the types of vegetarian options students are requesting?\n\nAisha Kabir: Good question. According to the preferences submitted, it seems like they're asking for a mix of light snacks and finger foods. Things like vegetable spring rolls, hummus wraps, maybe some fruit skewers. Yasmin, did I miss anything?\n\nYasmin Abdul: No, that's pretty much it. But I do want to point out that this isn't just about adding random items. We need to think about variety and making sure there’s enough for everyone. If we only add one or two vegetarian items, they'll probably run out quickly.\n\nSamuel Mensah: That’s true. But can we actually pull this off logistically? I mean, it’s already March 31st, and the event is in what—five days? Are the suppliers even going to be able to deliver on such short notice?\n\nYasmin Abdul: I spoke to one of our regular suppliers earlier today. They said they could get us pre-packaged vegetarian snacks like mini falafel wraps and veggie sushi rolls by April 3rd at the latest. But we'll need to confirm ASAP.\n\nAisha Kabir: That’s good to know. Samuel, what’s your take on the budget side of things? Can we afford to add these items?\n\nSamuel Mensah: Hmm. Let me think for a second. [Pause] Okay, so we do have a small contingency fund for last-minute changes. It’s not a lot, but it should cover the basics. If we avoid anything too fancy, we should be fine. But here's the thing—how are we going to handle the distribution? Are we setting up a separate vegetarian-only station, or are we mixing these snacks in with the rest of the food?\n\nYasmin Abdul: I’d recommend a separate station. It’ll make it easier for students with dietary preferences to find what they need. Plus, it helps us track how much of the vegetarian stuff is actually being consumed.\n\nAisha Kabir: That makes sense. Let’s go with a separate station, then. Samuel, can you double-check the budget and confirm by the end of the day if we can allocate funds for this?\n\nSamuel Mensah: Sure, I’ll get on that right after this meeting.\n\nYasmin Abdul: While we're on the topic, do we have a backup plan in case something goes wrong? Like, what if the supplier misses the delivery deadline?\n\nSamuel Mensah: Good point. Maybe we should have a list of local markets or stores where we can grab something last-minute if needed.\n\nAisha Kabir: Agreed. Yasmin, can you look into that? Just have a few backup options ready to go.\n\nYasmin Abdul: Will do. By the way, I just remembered—are we considering allergies? Some vegetarian snacks might contain nuts or other allergens. We need to label everything clearly to avoid any issues.\n\nSamuel Mensah: That’s a good catch. Let’s make sure the supplier provides detailed ingredient lists for everything.\n\nAisha Kabir: Perfect. I’ll follow up with the supplier about that. Anything else we’re missing?\n\nSamuel Mensah: Not on my end. Just let me know once you’ve confirmed the supplier order.\n\nYasmin Abdul: Same here. I’ll send you all the backup plan details by tomorrow.\n\nAisha Kabir: Great. So, to summarize—Samuel will confirm the budget by the end of the day, Yasmin will prepare a list of backup snack options and check on allergens, and I’ll finalize the order with the supplier. Let’s aim to have everything set by April 3rd. Does that work for everyone?\n\nSamuel Mensah: Works for me.\n\nYasmin Abdul: Yep, sounds good.\n\nAisha Kabir: Awesome. Thanks, everyone. I’ll send out a recap email shortly. Talk soon!\n\nSamuel Mensah: Thanks, Aisha. Bye, everyone.\n\nYasmin Abdul: Bye!"

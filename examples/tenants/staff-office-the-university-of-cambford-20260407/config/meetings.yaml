  transcript: "Layla Haddad: Good morning, everyone. Can you all hear me clearly?\nYasmin Abdul: Yes, I can hear you. Good morning!\nSamuel Mensah: Morning, Layla. You're coming through fine on my end.\nJoy Okafor: Same here, loud and clear.\nLayla Haddad: Great. Thanks for confirming. Let’s get started. The agenda for today is to review the flagged RA and TA applications and coordinate follow-ups for missing recommendation letters. I'm hoping we can resolve these discrepancies quickly so we stay on track.\nSamuel Mensah: Sounds good. I looked over the flagged applications last night, and it seems like we have about ten with missing or incomplete recommendation letters. Does that match what you all have?\nYasmin Abdul: Yes, I cross-checked this morning, and I also counted ten. Two of them seem straightforward—they just need a quick nudge to their recommenders. The others might require a bit more digging since the applicants didn’t specify much on their forms.\nLayla Haddad: Agreed. Joy, do you have access to the tracker with the applicants' contact information?\nJoy Okafor: Let me check… one second. [pause] Okay, yes, I have the tracker open now.\nLayla Haddad: Perfect. So, Yasmin, you mentioned two straightforward cases. Can you share the names of those applicants?\nYasmin Abdul: Sure. The first is Priya Sharma. Her recommender emailed this morning saying they were having trouble with the upload system. The second is Malik Johnson. His professor confirmed they sent the letter but used the wrong submission link.\nSamuel Mensah: Alright, Priya and Malik should be easy fixes. Joy, can you coordinate with IT to resolve Priya’s issue?\nJoy Okafor: Absolutely, I’ll reach out to them right after this meeting.\nLayla Haddad: Great. Now, for the other eight flagged applications—what’s the next step?\nSamuel Mensah: Some of these are trickier. For instance, we have an applicant, Diana Wu, who listed two recommenders but neither has submitted anything. I think we should directly email her to confirm whether her recommenders need a reminder.\nYasmin Abdul: I agree. And there’s another case—uh, let me pull up the name… right, Jacob Peterson. He uploaded a letter, but it’s from a peer and not a professor.\nJoy Okafor: Wait, is that allowed?\nSamuel Mensah: No, it’s not. The guidelines are clear that recommendation letters must come from faculty or professional supervisors.\nLayla Haddad: Okay, so we’ll need to inform Jacob and ask him to submit a proper letter.\nYasmin Abdul: Should we give him a deadline?\nLayla Haddad: Yes, let’s say… three business days. That should give him enough time to coordinate with someone.\nSamuel Mensah: Quick question—how are we handling cases where applicants didn’t list their recommender's contact information at all?\nJoy Okafor: Ugh, there are three like that, right? I feel like we’ll need to email them directly to gather that info.\nLayla Haddad: Agreed. For those cases, Joy, can you draft a generic email template? Keep it concise but clear about the urgency of the matter.\nJoy Okafor: Sure thing. I’ll get that to everyone by the end of the day.\nYasmin Abdul: Actually, Layla, quick side note—can we confirm if the IT issue with the upload system is fully resolved? I don’t want Priya’s recommender to run into the same problem again.\nLayla Haddad: Good point. Samuel, can you check with IT on that?\nSamuel Mensah: Will do. I’ll send them a message right now.\nJoy Okafor: Uh, sorry to interrupt, but can we take offline any broader IT concerns? I feel like we’re veering a bit off-topic.\nLayla Haddad: You’re right, Joy. Let’s focus back on the applications.\nSamuel Mensah: Sure thing. So, action items—Joy will draft the email template for missing contact info, Yasmin will follow up with Priya’s and Malik’s cases, and I’ll check with IT about the upload system. Did I miss anything?\nLayla Haddad: That covers most of it. Oh, and I’ll handle the follow-up with Jacob Peterson regarding his improper recommendation letter. Let’s aim to have all these resolved by Friday.\nYasmin Abdul: Sounds good to me.\nJoy Okafor: Same here.\nSamuel Mensah: Works for me.\nLayla Haddad: Perfect. Thanks, everyone. Let’s reconvene next week to confirm everything’s resolved. Have a great day!\nJoy Okafor: You too! Bye!\nSamuel Mensah: Bye.\nYasmin Abdul: Take care!"

  title: Catering Restock Discussion
  transcript: "Mei Zhang: Hi everyone, thanks for joining this emergency meeting. Can everyone hear me?\n\nJoy Okafor: Yes, loud and clear.\n\nFrançois Dubois: Yes, can hear you. Bonjour, everyone.\n\nMei Zhang: Great. So, the reason we're meeting is the gluten-free snack mishap—we’ve realized there was a miscommunication, and fewer options were prepared than needed. Orientation day is tomorrow, and we need to coordinate with the supplier urgently to restock.\n\nJoy Okafor: This is definitely a priority. Did we already reach out to the supplier, or are we still figuring out quantities?\n\nMei Zhang: I did send them a preliminary email, but we need to confirm exact quantities before they can process the order. François, could you remind us how many gluten-free snacks were initially planned?\n\nFrançois Dubois: Sure. Originally, we planned for 250 units, but only 100 were prepared due to the mix-up. By my count, we need at least 300 units total now, considering the updated dietary preference submissions.\n\nJoy Okafor: Oh, I thought it was 200. Are you sure we need 300?\n\nFrançois Dubois: Yes, I double-checked this morning. The dietary submissions increased last week, and I updated the numbers accordingly.\n\nMei Zhang: That aligns with what I saw. François, did the supplier confirm they can deliver on such short notice?\n\nFrançois Dubois: They said it’s possible, but they’ll need to expedite the order. There might be an additional fee.\n\nJoy Okafor: Hmm, expedited fees could push us over the catering budget. Do we have room to absorb that?\n\nMei Zhang: Good question. Let me check quickly—hold on.\n\n[Pause while Mei checks her notes.]\n\nMei Zhang: Okay, we have some flexibility due to savings from the vegetarian snack adjustment. But we’ll need to keep the fee under $150. François, can you confirm if that’s doable?\n\nFrançois Dubois: I’ll check with the supplier right after this meeting. I think it’s likely, but I’ll negotiate if needed.\n\nJoy Okafor: Perfect. While we’re on the topic, are we sure we have enough vegetarian options? I know the submission numbers increased for those too.\n\nMei Zhang: Good catch, Joy. Let me pull up the list… Okay, we’re covered there. We added a buffer when we adjusted on Tuesday.\n\nFrançois Dubois: Let’s hope there are no surprises tomorrow. [Chuckles.]\n\nMei Zhang: Absolutely. Now, back to the gluten-free snacks. François, once you confirm with the supplier, can you update us via email? We’ll need to track delivery timing closely.\n\nFrançois Dubois: Of course. I’ll include the supplier’s ETA and the fee details.\n\nJoy Okafor: Great. Anything else we need to discuss while we’re here?\n\nMei Zhang: I think we’re covered for gluten-free snacks. But one quick thing—did anyone hear back about the missing extension cords for the dean’s presentation setup?\n\nFrançois Dubois: I didn’t, but I saw an email from logistics mentioning they sourced extras from the student union.\n\nMei Zhang: Good, that’s one less thing to worry about. Joy, anything else from your end?\n\nJoy Okafor: Not really, just hoping everything runs smoothly tomorrow.\n\nMei Zhang: Alright, let’s wrap up then. Action items: François, you’ll confirm the order and update us. I’ll track delivery timing. Joy, you’re good on your end. Let’s stay in touch in case anything else pops up. Thanks, everyone!\n\n[Meeting ends.]"

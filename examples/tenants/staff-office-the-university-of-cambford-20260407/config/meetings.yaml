  transcript: "François Dubois: Good afternoon, everyone. Thanks for joining on such short notice. We’ve got a bit of an issue with the seating layout for Orientation Day, as some of you might have already heard.\nJoseph Okonkwo: Afternoon. Yeah, I saw the email earlier. So, what’s the latest? How bad is it?\nFrançois Dubois: Well, the logistics team flagged this yesterday. We’ve had an unexpected increase of about 150 students, and the current seating arrangement just doesn’t account for that. We need to adjust the layout and probably secure more chairs.\nLuis Gomez: Can you hear me? Sorry, I think my mic was muted earlier. Yeah, I was going to say, that’s a significant increase. Do we know why this happened? Did we miss something in the initial planning?\nFrançois Dubois: It’s a combination of things. There was an error in the projections we received from the admissions team, plus a last-minute surge in student confirmations. It’s not ideal, but we have to work with what we’ve got.\nJoseph Okonkwo: Okay, so what are the options here? Do we need to change the venue entirely, or can we make this work in the current space?\nLuis Gomez: I think we should stick to the original venue if we can. Moving everything at this stage would be a logistical nightmare. Can we reconfigure the seating to fit more rows? Maybe use some of the aisle space?\nFrançois Dubois: That’s what I was thinking too. We’ve got some flexibility with the aisles, but we’ll need to make sure it doesn’t block any emergency exits. Safety regulations are non-negotiable.\nJoseph Okonkwo: Right, and if we’re adding more rows, we’ll also need more chairs. Do we have extras on campus, or will we need to rent them?\nLuis Gomez: We have some extra chairs in storage, but probably not enough for 150 more people. I can reach out to a rental company and see if they can deliver by tomorrow.\nFrançois Dubois: Good idea, Luis. Can you also check if they can provide folding chairs? Those will be easier to set up and move around.\nLuis Gomez: Got it. I’ll send them an email right after this meeting.\nJoseph Okonkwo: Quick question—what about the audiovisual setup? If we’re adding more rows, will everyone still be able to see and hear the presentations?\nFrançois Dubois: Good point. I spoke to the AV team this morning. They’re confident they can adjust the projector and sound system to accommodate the new layout, but they’ll need to test everything once the chairs are set up.\nLuis Gomez: Should we schedule that test for tomorrow afternoon? That way, if there are any issues, we’ll still have time to fix them.\nFrançois Dubois: Yes, let’s do that. I’ll coordinate with the AV team and confirm a time.\nJoseph Okonkwo: One more thing—what about signage and the orientation pamphlets? Will the changes affect any of that?\nFrançois Dubois: The signage should be fine, but we might need to update the venue map in the pamphlets. Let me check with the communications team to see if we can do a quick reprint.\nLuis Gomez: I just thought of something—what if we use some of the overflow rooms as backup seating areas? We can stream the presentations to those rooms.\nJoseph Okonkwo: That could work, but I’d rather keep everyone in the main hall if possible. Orientation is about creating a sense of community, and splitting people up might detract from that.\nFrançois Dubois: Agreed. Let’s treat the overflow rooms as a last resort. For now, we’ll focus on reconfiguring the main hall.\nLuis Gomez: Sounds good. Oh, one second—my phone’s buzzing. [Pause] Sorry about that. Where were we?\nFrançois Dubois: We’re just about done, actually. Let’s summarize the action items. Luis, you’ll contact the rental company about the chairs and follow up with the AV team about the test.\nLuis Gomez: Got it.\nFrançois Dubois: Joseph, can you double-check the seating layout and make sure it complies with safety regulations?\nJoseph Okonkwo: Will do. I’ll send you an update by the end of the day.\nFrançois Dubois: Perfect. I’ll handle the communications team regarding the pamphlets and confirm the AV test schedule. Anything else?\nLuis Gomez: I think that covers it for now.\nJoseph Okonkwo: Same here. Let’s regroup tomorrow if anything urgent comes up.\nFrançois Dubois: Agreed. Thanks, everyone. Let’s make this work. Meeting adjourned."
- agenda: Investigate the account-specific issue preventing a final-year student from accessing the re-admissions portal and ensure portal functionality.
  attendees:

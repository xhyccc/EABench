  title: Catering Mix-Up - Post-Mortem
  transcript: "Layla Haddad: Alright, everyone, let’s get started. Can you all hear me clearly?\n\nSamuel Mensah: Yes, loud and clear.\n\nYasmin Abdul: Yep, all good here.\n\nFrançois Dubois: Same here. Let’s dive in.\n\nLayla Haddad: Great. Thanks for joining on such short notice. As you all know, yesterday we had a mix-up with the coffee delivery for the orientation event. What was supposed to go to the faculty lounge ended up at the orientation venue, and vice versa. Let’s break this down and figure out what went wrong and how we can avoid this in the future. Yasmin, can you kick us off with what you know so far?\n\nYasmin Abdul: Sure. From what I gathered, the catering team received two separate orders—the first for the faculty lounge, which included specialty coffee and pastries, and the second for the orientation venue, which was just basic coffee and tea. Somewhere along the line, the labels got swapped. When the delivery arrived, the orientation venue got the faculty lounge’s order, and vice versa. I didn’t realize the mistake until someone from the faculty lounge called me, asking where their pastries were.\n\nSamuel Mensah: Wait, so the labels were swapped on our end? Or was it the catering supplier?\n\nYasmin Abdul: That’s unclear at the moment. I spoke briefly with the supplier, and they claim they followed the labels we provided. But I think we need to double-check how we communicated the orders.\n\nFrançois Dubois: Hmm. Do we have a record of the instructions we sent to the supplier? Maybe an email or a work order?\n\nYasmin Abdul: I believe so. I’ll need to dig through those emails. Layla, should I share these with the group?\n\nLayla Haddad: Yes, please. If you can forward the original instructions to all of us after this meeting, that’d be helpful. François, did your team have any involvement in coordinating with the supplier?\n\nFrançois Dubois: Only indirectly. We were focused on the seating and signage, so the catering orders weren’t on our radar. But now that you mention it, I do remember seeing two catering delivery vehicles yesterday. One driver seemed confused—he asked me where to unload. I assumed he was talking about the snacks, so I pointed him to the auditorium.\n\nSamuel Mensah: Ah, that could’ve been it. If the delivery drivers weren’t sure where to go, that might’ve compounded the issue. Did anyone provide them with clear drop-off instructions?\n\nYasmin Abdul: I thought I did. I sent a map with the delivery addresses to the supplier, but maybe that didn’t get passed on to the drivers.\n\nLayla Haddad: Okay, so it sounds like there was a breakdown in communication somewhere between us, the supplier, and the drivers. Yasmin, can you follow up with the supplier and confirm whether the map and instructions made it to their team?\n\nYasmin Abdul: Will do.\n\nSamuel Mensah: Speaking of communication, can we talk about the labeling process? Are we relying solely on written instructions, or do we double-check the labels before the orders are dispatched?\n\nFrançois Dubois: That’s a good question. I don’t think there’s a formal double-check process in place. Maybe we need to assign someone to verify the labels before the orders leave the supplier’s facility.\n\nYasmin Abdul: I agree. We can’t just assume the supplier will catch these things.\n\nLayla Haddad: Absolutely. Let’s make that an action item. Going forward, we’ll implement a verification step for all catering orders. Yasmin, can you draft a checklist for this?\n\nYasmin Abdul: Sure thing.\n\nSamuel Mensah: Quick question—are we doing a post-event survey for the orientation attendees? If so, we might want to include a question about the refreshments, just to gauge if anyone noticed the mix-up or had feedback.\n\nLayla Haddad: Good idea. I’ll coordinate with the communications team to add that to the survey. Anything else we’re missing?\n\nFrançois Dubois: One thing—I know this is slightly off-topic, but while we’re talking about suppliers, can we revisit the issue of gluten-free options? We had a shortage last week, and I’m worried it might happen again.\n\nLayla Haddad: Let’s take that offline. François, can you and Yasmin connect after this to discuss that?\n\nFrançois Dubois: Sure, no problem.\n\nLayla Haddad: Perfect. To recap, here are the action items:\n1. Yasmin will follow up with the supplier to confirm if the delivery instructions, including the map, were communicated to the drivers.\n2. Yasmin will draft a checklist for verifying catering labels before dispatch.\n3. I’ll work with the communications team to include a refreshments-related question in the post-event survey.\n4. François and Yasmin will discuss gluten-free snack orders separately.\n\nLayla Haddad: Anything else before we wrap up?\n\nSamuel Mensah: Nope, that covers it for me.\n\nYasmin Abdul: Same here.\n\nFrançois Dubois: All good on my end.\n\nLayla Haddad: Alright, thanks, everyone. Let’s aim to have updates on these action items by Thursday. Meeting adjourned.\n\nSamuel Mensah: Thanks, Layla. Bye, everyone.\n\nYasmin Abdul: Bye!\n\nFrançois Dubois: See you all later."
- agenda: Discuss and finalize the addition of a moderator for the Dean of Engineering's Q&A session.
  attendees:

  title: Logistics Shortfall Coordination
  transcript: "Joy Okonkwo: Hi everyone, can you hear me okay?\nFrançois Dubois: Yes, loud and clear.\nAisha Kabir: Same here, Joy. Good morning, everyone.\nJoy Okonkwo: Great, thanks. Let’s jump right in—our agenda today is figuring out how to borrow and set up five additional tables for tomorrow's orientation setup. I know we only discovered this shortfall late yesterday, so thanks for hopping on this call quickly.\nFrançois Dubois: Absolutely. So, just to clarify, the tables we have right now are already accounted for and in place, right?\nJoy Okonkwo: Correct. We’re setting up for 200 attendees, and the seating plan we finalized last week requires five more tables than we initially planned for.\nAisha Kabir: Hmm. Okay. Did we already check with the student union building? They might have spares, but I think they have their own event tomorrow.\nJoy Okonkwo: I did call them this morning. They can lend us three tables, but we’ll need to pick them up ourselves, and they’re only available after 3 PM today.\nFrançois Dubois: That’s cutting it close. What about facilities management? Do they have anything lying around?\nAisha Kabir: Good question. I’ll reach out to them right after this meeting. They’re usually good about last-minute stuff, but I remember they were stretched thin during last year’s orientation.\nJoy Okonkwo: Yeah, we can’t bank on them, but it’s worth asking. Worst case scenario, we could rent some tables. There’s a rental company nearby that specializes in event furniture.\nFrançois Dubois: That might be our safest bet. If we don’t hear back from facilities by noon, we should go ahead and book the rental. Do we have budget left for that?\nJoy Okonkwo: There’s some wiggle room in the contingency fund, but let’s keep it minimal. Renting five tables shouldn’t break the bank.\nAisha Kabir: Just to confirm, how are we transporting all of this? If the student union and the rental company both need us to pick up, do we have enough vehicles?\nJoy Okonkwo: Good point. I’ll check with logistics. I know we have a van, but it might already be scheduled for other deliveries.\nFrançois Dubois: If the van isn’t available, I can help coordinate with the transportation team. Worst case, I can use my truck for the student union tables.\nAisha Kabir: Perfect. François, you’re a lifesaver. While we’re at it, do we need extra tablecloths or anything like that?\nJoy Okonkwo: Oh, good catch. I’ll double-check the inventory. I think we might be fine, but let me confirm.\nFrançois Dubois: One more thing—what’s the backup plan if we can only secure three tables from the student union and facilities doesn’t come through?\nJoy Okonkwo: If that happens, the rental company will be our fallback. We’ll need to make sure we lock in a booking early this afternoon so we don’t get stuck.\nAisha Kabir: Got it. And just to clarify the timeline: we’ll hear back from facilities by noon, pick up the student union tables after 3 PM, and finalize rental plans by 2 PM at the latest?\nJoy Okonkwo: That’s the plan. Everyone clear on next steps?\nFrançois Dubois: Clear. I’ll coordinate with transportation if needed.\nAisha Kabir: Same here. I’ll call facilities right after this.\nJoy Okonkwo: Awesome. I’ll follow up on tablecloths and check the rental pricing. Anything else before we wrap up?\nAisha Kabir: Oh, quick question—Joy, did we resolve that pamphlet misprint issue from yesterday?\nJoy Okonkwo: Oh boy, yes, but it was a headache. We had to reprint 200 copies overnight. I’ll fill you in offline if you want.\nFrançois Dubois: Yikes. Let’s hope everything else goes smoothly tomorrow. Thanks, everyone.\nJoy Okonkwo: Thanks, all. Let’s touch base later if anything comes up. Meeting adjourned."

  title: Dean's Lecture Rehearsal
  transcript: "Luis Gomez: Hi everyone, can you hear me?\n\nHiroshi Matsuda: Yeah, I can hear you. Joseph, are you there?\n\nJoseph Okonkwo: Yes, I'm here. Sorry, I had to adjust my mic. All right, let's get started. So, we're here to rehearse the dean's opening lecture again, right? Luis, where do you want to begin?\n\nLuis Gomez: Yeah, so the dean expressed concerns about the flow of his presentation. He felt it was a bit disjointed in parts, and he wants to make sure it lands well with the new students. Uh, Hiroshi, can you pull up the latest version of the presentation on the shared screen?\n\nHiroshi Matsuda: Sure. Give me a second. (pauses) Okay, can you all see this?\n\nJoseph Okonkwo: Yep, got it. So, where exactly is the dean feeling things aren't working? Was it the intro, the transitions, or something else?\n\nLuis Gomez: Good question. He mentioned the transitions specifically, but I think we should go through the whole thing to make sure nothing else feels off. Let's start with the introduction. Hiroshi, can you play the first slide?\n\nHiroshi Matsuda: Alright, here it is. (pauses) So, this is where he introduces himself, goes over his background, and sets the tone. Thoughts?\n\nJoseph Okonkwo: Hmm, I think it's solid, but it might be a bit too formal. This is an orientation, right? Maybe he could lighten up the tone a bit, make it more conversational?\n\nLuis Gomez: Yeah, I was thinking the same thing. He does have a great sense of humor, but it doesn't really come through here. Could we suggest he add a personal anecdote? Maybe something from his first day in college?\n\nHiroshi Matsuda: Oh, that’s a great idea. I remember he once mentioned getting lost on campus as a freshman. That could be a relatable and funny story.\n\nJoseph Okonkwo: Perfect. Let’s flag that for him. Also, I noticed the slide visuals are a bit plain. Do we have time to enhance them? Maybe add some campus photos or a short video clip?\n\nLuis Gomez: Hmm, that’s a good point. But we’re cutting it close on time. Let’s ask the communications team if they can whip something up quickly. If not, we’ll go with what we have.\n\nHiroshi Matsuda: Agreed. Moving on, let’s look at the transition to the next section. (clicks to the next slide) Here’s where he starts talking about the engineering program highlights.\n\nJoseph Okonkwo: Okay, so here’s where I feel he loses a bit of momentum. It’s a lot of information, and it’s kind of dense. Maybe we could suggest breaking it up with some student testimonials or success stories?\n\nLuis Gomez: That’s a great idea. We actually have a video from a recent alum talking about their experience. I’ll check with the AV team to see if we can insert it here.\n\nHiroshi Matsuda: Good call. And what about the flow from here into the research opportunities section? I feel like it’s a bit abrupt.\n\nJoseph Okonkwo: Yeah, it kind of is. Maybe he could use a bridging statement, something like, “And now that you’ve seen what our program offers, let’s talk about how you can contribute to groundbreaking research.”\n\nLuis Gomez: I like that. It’s smooth and keeps the audience engaged. Let’s note that down.\n\nHiroshi Matsuda: Got it. Okay, now for the closing. (clicks to the final slide) This is where he wraps up and gives his motivational speech.\n\nJoseph Okonkwo: I think the content is fine, but the energy needs to be higher. This is his big moment to inspire the students. Maybe he could end with a call to action, like encouraging them to take advantage of every opportunity here?\n\nLuis Gomez: Absolutely. And maybe he could tie it back to his opening anecdote, like, “I got lost on campus my first day, but I found my way—and so will you.” Something like that.\n\nHiroshi Matsuda: Love it. That would bring it full circle. Should we suggest he rehearse this part a few extra times to really nail the delivery?\n\nJoseph Okonkwo: Definitely. It’s the last thing they’ll hear, so it needs to leave an impression.\n\nLuis Gomez: Agreed. Alright, I think we’ve covered the main points. Any other thoughts before we wrap up?\n\nHiroshi Matsuda: Just one. Do we have confirmation on the additional AV equipment he requested?\n\nLuis Gomez: Yes, the logistics team sorted that out yesterday. Everything should be good to go.\n\nJoseph Okonkwo: Great. So, action items: Luis, you’ll follow up with the communications team about the visuals and the AV team about the alum video. Hiroshi, you’ll draft the notes for the dean with all our suggestions. And I’ll double-check the final schedule to make sure there’s enough time for him to rehearse again. Sound good?\n\nLuis Gomez: Sounds good. Let’s take this offline if anything else comes up. Thanks, everyone.\n\nHiroshi Matsuda: Thanks, see you later.\n\nJoseph Okonkwo: Bye, everyone."

ing the call, and we’ll need to walk a fine line between supporting the client and maintaining investor confidence. If you have any thoughts on how to frame this, I’d love to hear them.\n\nWe’re aiming to have a prep session tomorrow morning—ideally by noon—so I’d appreciate it if you could get back to me with any updates or questions before then. Let me know if there’s anything you need from my side to move things along.\n\nThanks so much for your help on this. I know it’s all moving quickly and the situation’s a bit of a mess, but I really appreciate you stepping up. Let’s aim to put our best foot forward for the investors.\n\nBest,\n\nYara\n\nSent from my iPhone"

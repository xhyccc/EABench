PR team seems keen, I’m worried about the legal liabilities this could introduce. Let me know if you think it’s worth revisiting this idea.\n\nLet’s aim to have a preliminary draft of our response to the EPO by EOD tomorrow. Wei, can you take the lead on this? Mosi, please double-check the timeline of events and cross-reference with any correspondence we’ve had with Gens Chemistry Ltd. to ensure we’re not missing anything. Feel free to loop in anyone else who might be helpful here.\n\nThanks, and let me know if you have any questions or need further clarification. I’ll be on email most of the evening if anything urgent comes up.\n\nBest,\nTakeshi\n\nSent from my iPhone"

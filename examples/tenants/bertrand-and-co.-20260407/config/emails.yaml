der review, but it might make sense to coordinate with them to ensure we’re prepared to address any questions that arise.\n\nLet me know if you need me to forward any of the relevant documents or pull up specific data points for your review. Time is of the essence here, especially with the emergency call with Gens Chemistry Ltd.’s board scheduled for later today.\n\nThanks, everyone. Please keep me posted on your findings.\n\nBest,\nJyoti Mukherjee\nSent from my iPhone"

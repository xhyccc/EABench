mp on a call to talk through next steps if needed. I’ve also attached a draft summary of the discrepancies I’ve found so far—please take a look when you have a chance and let me know if there’s anything I’ve missed or misinterpreted.\n\nThanks, and sorry for the long email, just wanted to make sure everything was covered.\n\nBest,\nAmina\n\nSent from my iPhone"

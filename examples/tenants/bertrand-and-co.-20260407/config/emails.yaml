th looping in the external counsel at this stage.\n\nAs for the subpoena we received today, Legal is already pulling together the requested documents. Wei, can you confirm that your team has flagged all relevant files related to Gens Chemistry Ltd.'s environmental fines? I know there’s been a lot of back-and-forth on this, so just want to make sure nothing slips through the cracks.\n\nLastly, on the phishing attempt that IT caught earlier—major kudos to them for acting so quickly. This is a good reminder of the need for regular cybersecurity training. I’m planning to discuss this further with the leadership team at Friday’s meeting. Let me know if there’s anything specific you’d like me to bring up.\n\nSorry for the slightly scattered email—typing this up quickly between calls. Please flag anything I’ve missed or if you have additional thoughts. Really appreciate your continued focus and flexibility as we navigate this.\n\nBest regards,\nMosi\n\nSent from my iPhone"

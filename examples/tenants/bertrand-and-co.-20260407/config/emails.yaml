you need me to resend any of the documents we’ve reviewed recently (e.g., the risk disclosure draft, the analyst’s revenue projection analysis, or the media coverage summaries).\n\nLooking forward to hearing from you.\n\nBest regards,\nTakeshi Kimura\nSenior Legal Counsel\n\nSent from my iPhone"

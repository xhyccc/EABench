eek has highlighted some vulnerabilities in how we’re handling sensitive communications. I know IT is already conducting a review, but I’d recommend we all take a moment to review best practices for email security—especially given the volume of sensitive info we’re handling right now. I’ll forward the consultant’s initial recommendations once I have them.\n\nLet me know if either of you needs additional context on any of the above, or if you’d like to set up a quick call to discuss next steps. I’ll also be in touch once we’ve finalized our initial subpoena response draft for your review.\n\nBest,\nMosi\n\nSent from my iPhone"

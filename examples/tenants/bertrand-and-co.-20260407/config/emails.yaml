low-up email from earlier today), and I’m concerned that we’re running out of time to mitigate the damage before media scrutiny escalates further. Thoughts?\n\nLet me know what you think. We’ll likely need to hash this out more thoroughly in tomorrow’s strategy meeting with the senior partner.\n\nBest,\nAmina\n\nSent from my iPhone"

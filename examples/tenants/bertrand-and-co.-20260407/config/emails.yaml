tion protocols implemented by IT are fully operational? We need to safeguard sensitive files, especially with the spotlight on this case.\n\nLet me know if you need additional resources or if anything is unclear—happy to jump on a call later today or tomorrow morning to discuss further. Thanks for your hard work on this—it’s not an easy situation, but I’m confident we’ll navigate it as a team.\n\nBest,\nMarkus\n\nSent from my iPhone"

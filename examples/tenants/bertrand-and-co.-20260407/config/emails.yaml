orical IPO data that might help benchmark Gens Chemistry Ltd.'s projections. Could you share that with the team when you get a chance?\n\nLet’s connect soon to discuss next steps. I’ll be out of the office later today but can jump on a call if needed. Please don’t hesitate to flag anything urgent.\n\nBest,\nWei\n\nSent from my iPhone"

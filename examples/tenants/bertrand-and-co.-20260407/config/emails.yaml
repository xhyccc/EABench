antly shift our risk assessment framework.\n\nI’ll sync with the PR team later today to ensure their communication strategy aligns with our legal and cybersecurity efforts, but I’d appreciate a quick update from you by the end of the day so I can factor it into the broader action plan.\n\nLet me know if you need me to clarify anything or if you’d prefer to hop on a quick call to discuss next steps.\n\nBest regards,\n\nMosi Kabongo\nHead of Corporate Law\nBertrand and Co.\n\nSent from my iPhone"

aks that could exacerbate the situation. Also, please make sure all sensitive documents are properly encrypted and access-restricted.\n\nLastly, I know the PR team has been struggling to finalize their response to the Environmental Protection Organization’s statement. If you have any spare bandwidth, can one of you sit in on their next meeting to ensure our legal positioning is accurately reflected in their messaging? I don’t want another slip-up like the accidental email to that journalist earlier this week—it’s been a nightmare trying to contain that.\n\nLet me know if you need more context or direction. I’m juggling a few other fires right now (including an irate call this morning from one of Gens Chemistry’s investors), but I’ll make myself available if needed.\n\nBest,\nMosi\n\nSent from my iPhone"

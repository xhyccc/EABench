ial review, but I want to make sure we’re not missing anything that might overlap with this incident.\n\nLet me know if either of you needs additional details from the IT team. I’ll be on a call with them later this afternoon to get a more comprehensive update, so I can flag any questions you have.\n\nThanks, and sorry for the slightly scattered email—there’s just a lot happening right now. Appreciate your input as always.\n\nBest,\nWei\n\nSent from my iPhone"

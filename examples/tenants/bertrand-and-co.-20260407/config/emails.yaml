  body: "Subject: Emergency Update: PR Messaging and IPO Timeline Risks\n\nHi Yara and Rafael,\n\nI’m writing to address the growing concerns surrounding Gens Chemistry Ltd.’s IPO preparations and the escalating scrutiny we’re facing. We’ve got multiple moving pieces here, and I want to ensure we’re aligned on both the PR messaging and the potential impact on our timeline.\n\nFirst, regarding the PR team’s draft messaging—Gens Chemistry’s leadership has expressed dissatisfaction with the tone and framing of the response to the Environmental Protection Organization’s public statement. While I understand the urgency to finalize this, we can’t afford to send out something that might exacerbate the situation. Rafael, could you revisit the tone of the draft and ensure it strikes the right balance between accountability and reassurance? Please loop in Yara once you’ve made updates so we can double-check before it goes out. Let’s aim to finalize this by EOD tomorrow. We’re cutting it close already.\n\nOn the IPO timeline, the situation is becoming increasingly precarious. The subpoena we received earlier this week, coupled with inconsistencies in Gens Chemistry’s financial and environmental records, is raising red flags with both investors and regulators. If these issues aren’t resolved swiftly, we might need to seriously consider delaying the IPO. I know this isn’t ideal, but we need to be prepared for all scenarios. Yara, could you pull together a quick assessment of what a delay would mean for our broader strategy? Let’s discuss this in more detail during tomorrow’s leadership call.\n\nThere’s also the matter of security. The recent phishing attempts, suspicious account activity, and that email leak to the journalist have put us in a vulnerable position. IT has already flagged several vulnerabilities, and while they’re working on fixes, we need to be extra cautious. Please remind your teams to double-check recipients before sending sensitive emails and to report anything unusual immediately. We can’t afford another misstep right now.\n\nLastly, I’ve been informed that a key investor is demanding a detailed update on how we’re handling the Environmental Protection Organization’s allegations. I’ll take the lead on that call, but I may need input from both of you—especially if they ask about messaging or legal risks. Be ready to jump in if needed.\n\nLet’s stay on top of this. I know tensions are high, but we’ve handled crises before, and we’ll get through this one too. Ping me if you have any questions or updates—I’ll be monitoring my inbox closely.\n\nBest,\nMarkus\n\nSent from my iPhone"

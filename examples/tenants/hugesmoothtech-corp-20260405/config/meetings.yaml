  title: Employee Sentiment Survey Results Review
  transcript: "Hana Wang: Hi everyone, thanks for joining today's meeting. Let's dive into the preliminary results of the employee sentiment survey and discuss next steps. Can everyone hear me okay?\n\nAmira Al-Zoubi: Loud and clear, Hana.\n\nJoseph Mensah: Yes, I can hear you. Let’s get started.\n\nBintu Kabongo: Same here. Ready to go.\n\nHana Wang: Great. So, as you all know, HR shared the survey results yesterday. The data reveals some concerning trends. Job security and morale are the two biggest areas of concern. Mariam, could you walk us through the highlights?\n\nMariam Abdullah: Sure. The survey received responses from 64% of employees. About 78% of respondents expressed anxiety over AI integration and its impact on their roles. Morale scores are also down by 15% compared to last quarter. One recurring theme in the comments was fear of job displacement due to AI. Another was frustration over communication gaps from leadership.\n\nHarsha Patel: That’s a big drop in morale. Did we get any feedback on what employees think would improve the situation?\n\nMariam Abdullah: Some employees suggested more transparency about AI-driven decisions. Others requested upskilling programs to adapt to AI tools, and there were multiple mentions of wanting leadership to address these concerns directly.\n\nMeera Sharma: Sorry to interrupt, but can I ask if this sentiment is equally distributed across departments, or are certain teams more affected?\n\nMariam Abdullah: Good question, Meera. The engineering team reported the highest levels of anxiety—unsurprising given recent layoffs of SDEs. Marketing and sales also showed concerns, but to a lesser extent. The AI team, interestingly, had higher morale scores, likely tied to their direct involvement in the changes.\n\nJoseph Mensah: That makes sense. People feel disconnected when decisions are made without their input. Should we consider a broader communication strategy?\n\nAmira Al-Zoubi: I agree, Joseph. The leaked document earlier this week certainly didn’t help. Employees are feeling blindsided. We need to proactively communicate our plans and address the ethical concerns head-on.\n\nHana Wang: Absolutely. Transparency is key, but we also need to balance it with a strong narrative about why these changes are necessary for the company’s future. Otherwise, we risk losing more talent.\n\nBintu Kabongo: Speaking of talent, I wanted to bring up a point. A mid-level product manager resigned yesterday, citing concerns about our direction. If we don’t act quickly, we might see more exits.\n\nMeera Sharma: That’s troubling. Do we know what specific concerns triggered their departure?\n\nBintu Kabongo: From what I’ve heard, it’s a mix of job security fears and dissatisfaction with how leadership is handling the transition. They felt demoralized.\n\nHarsha Patel: Can we address this proactively? Maybe a town hall or Q&A session with leadership to directly tackle these concerns?\n\nHana Wang: That’s a good idea, Harsha. We could plan a town hall next week. But let’s also think about longer-term solutions. What about creating a task force to work on morale improvement initiatives?\n\nJoseph Mensah: I like that idea. The task force could include representatives from different departments to ensure all voices are heard. We could also start rolling out upskilling workshops as Mariam mentioned earlier.\n\nAmira Al-Zoubi: I’m all for the task force. Can we set a deadline for forming it? Otherwise, this might lose momentum.\n\nHana Wang: Good point. Let’s aim to have it formed by the end of next week. We’ll need volunteers—maybe HR can coordinate that?\n\nMariam Abdullah: Yes, HR can take the lead on that. I’ll make sure it’s included in our communications.\n\nMeera Sharma: Before we move on, one quick note. I think we also need to address the external perception of the company. That journalist’s article questioning our AI strategy has gained traction. Clients are asking questions.\n\nAmira Al-Zoubi: Agreed. I think the sales team needs stronger messaging for clients. Maybe a joint effort with marketing to explain how AI integration benefits them?\n\nHana Wang: Good idea, Amira. Let’s take that offline and coordinate with the sales and marketing teams. Anything else before we wrap up?\n\nHarsha Patel: Just one thing. Should we also conduct follow-up surveys after implementing some of these changes? It’ll help us measure progress.\n\nMariam Abdullah: That’s a great suggestion, Harsha. We can plan for a follow-up survey in two months.\n\nHana Wang: Perfect. Let’s summarize the action items:\n1. HR will coordinate the formation of a morale task force by next week.\n2. Leadership will host a town hall next week to address employee concerns.\n3. Sales and marketing will collaborate on external messaging regarding AI benefits.\n4. HR will schedule upskilling workshops for employees.\n5. We’ll conduct a follow-up sentiment survey in two months.\n\nHana Wang: Thanks, everyone. Let’s keep the momentum going. Have a great day.\n\nAmira Al-Zoubi: Thanks, Hana. Bye, everyone.\n\nJoseph Mensah: Take care, all.\n\nBintu Kabongo: Thanks, everyone. Talk soon.\n\nMeera Sharma: Bye!\n\nHarsha Patel: Bye!"

  title: HR Survey Feedback Session
  transcript: "Hana Wang: Hi everyone, thank you for joining today’s session. I know it’s been a busy week, so I appreciate you making time. Let’s dive into the agenda — we’re here to review the findings from the internal survey on employee sentiment about AI integration and the recent layoffs. Amira, could you kick us off with a summary of the key results?\n\nAmira Al-Zoubi: Sure, Hana. So, the survey had a 78% response rate, which is pretty solid. The results were... mixed, to put it mildly. About 62% of employees expressed concerns about job security due to AI, and 48% said they felt the layoffs were not handled transparently enough. On the flip side, 39% noted that they see potential in AI to make their work more efficient, but there’s definitely skepticism about how it’s being implemented.\n\nJoseph Mensah: Can I jump in here? I was looking at the free-text comments, and one theme that stood out was a lack of communication. People don’t feel like they understand the rationale behind the layoffs or how AI decisions are being made. It’s creating a lot of anxiety.\n\nHana Wang: Thanks, Joseph. That aligns with some of the comments I read as well. Transparency seems to be a recurring issue. Bintu, do you want to share your thoughts on this?\n\nBintu Kabongo: Yeah, I was actually going to echo what Joseph said. There’s a clear trust gap right now. One comment really stuck with me — someone wrote, “We’re being told AI is here to help us, but all we see are our friends losing their jobs.” That perception is damaging morale.\n\nMariam Abdullah: Sorry to interrupt, but can we also talk about the positive feedback? I feel like we’re focusing a lot on the negatives. There were some responses that highlighted how AI is streamlining processes, especially in repetitive tasks. That’s worth noting too, right?\n\nMeera Sharma: Agreed, Mariam. But I think the challenge is that the positives are being overshadowed by the layoffs. It’s hard for people to appreciate efficiency gains when they’re worried about their livelihoods.\n\nHarsha Patel: Can I just say something? *pauses for a moment* Sorry, can you hear me? I think my mic is acting up.\n\nHana Wang: Yes, we can hear you, Harsha. Go ahead.\n\nHarsha Patel: Great, thanks. I wanted to suggest that we need a more proactive communication strategy. Instead of reacting to concerns, we should be upfront about what the AI integration means for different teams. Maybe even involve employees in shaping how AI is used?\n\nNisha Singh: That’s a great idea, Harsha. And if I may add, we should also provide more training. I know we announced a mandatory session recently, but we may need to offer ongoing support. People are still figuring out how to work with these tools.\n\nHana Wang: All excellent points. Let’s circle back to the layoffs for a moment. Amira, were there any insights about how we could improve in that area?\n\nAmira Al-Zoubi: Yes, there were some suggestions. People want more advance notice and a clearer explanation of why certain roles are being impacted. Also, a few comments mentioned the need for better outplacement support for those who are let go.\n\nJoseph Mensah: Can I add something here? I think there’s a perception issue we need to address. Employees see AI as a direct threat, but we’re not doing enough to show them how it can complement their roles rather than replace them.\n\nMariam Abdullah: I think that ties back to Harsha’s point about communication. Maybe we can organize town halls or Q&A sessions where employees can air their concerns and leadership can address them directly?\n\nBintu Kabongo: That’s a great idea. But let’s make sure those sessions are two-way. People need to feel heard, not just talked at.\n\nHana Wang: Absolutely. So, here’s what I’m hearing as next steps. One, we need a more transparent communication plan about AI integration and layoffs. Two, we should offer more robust training and support for employees working with AI. And three, we need to create spaces for open dialogue, like town halls or Q&A sessions. Did I miss anything?\n\nMeera Sharma: I think that covers it. Maybe we can also include a follow-up survey in a few months to see if our efforts are making a difference?\n\nHana Wang: Good idea, Meera. Let’s add that to the list. Okay, I think we’re just about out of time. Any final thoughts?\n\nNisha Singh: Just that we need to move quickly on this. The longer we wait, the harder it’ll be to rebuild trust.\n\nHana Wang: Agreed, Nisha. Thank you all for your input today. I’ll circulate the action items and a draft communication plan by the end of the week. Let’s reconvene in two weeks to check on progress. Meeting adjourned."

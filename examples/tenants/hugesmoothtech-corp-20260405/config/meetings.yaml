  title: Sales Performance Review
  transcript: "Camila Ramos: Hi everyone, let's get started. Can everyone hear me?\nDiego Silva: Yep, loud and clear.\nJamal Okonkwo: Same here.\nNia Kabongo: I can hear you.\nGabriela Rosales: All good on my end.\nCamila Ramos: Great. Thanks for joining today. As you know, the focus of this meeting is to review the recent dip in sales performance and figure out how we can address customer concerns about the AI-driven changes. Let’s start by looking at the numbers. Diego, could you share the latest metrics?\nDiego Silva: Sure thing. So, in the last quarter, we saw a 7% drop in conversions, which is significant considering we’ve been consistently growing at about 3-5% quarter-over-quarter for the last two years. Feedback surveys suggest that about 40% of respondents are hesitant to sign new contracts because of concerns about the AI reorganization.\nJamal Okonkwo: Wait, 40%? That’s huge. Did the survey specify exactly what their concerns were?\nDiego Silva: Yes, the top issues were reliability and the perception that we’re sidelining human expertise for AI. Some clients feel like they’re not getting the same personalized support.\nNia Kabongo: Can I jump in here? This aligns with what I’ve been hearing from the field. Some long-term clients are worried they’ll get less tailored solutions now that AI is playing a bigger role. They see it as a cost-cutting measure rather than an improvement.\nGabriela Rosales: That’s interesting, Nia. I’ve heard similar concerns. One client even directly asked if we’re planning to phase out account managers entirely.\nCamila Ramos: That’s troubling. Clearly, we need to address these fears head-on. But before we dive into solutions, let’s talk about the internal perception. The Slack thread last week got pretty heated. Do we think that’s trickling down to the clients?\nDiego Silva: Absolutely. When employees aren’t confident in the changes, it affects the way they talk to clients. If the sales team has doubts about the AI tools, how can they sell them convincingly?\nJamal Okonkwo: Can I just say something here? I think part of the problem is that we rolled out these changes too quickly. The AI team may have reduced build times, but we didn’t spend enough time educating staff or crafting messaging for clients. It feels like we skipped a step.\nNia Kabongo: Agreed. Also, the mandatory AI training session from HR didn’t feel helpful. It was more like a checkbox exercise than something that addressed real concerns.\nGabriela Rosales: I think we’re veering off-topic a bit. Can we circle back to client strategies? What are our options for rebuilding trust?\nCamila Ramos: Good point, Gabriela. Let’s focus. Does anyone have ideas for how we can reassure clients and highlight the benefits of AI without dismissing their concerns?\nJamal Okonkwo: We could create a series of case studies showing how AI has improved outcomes for existing clients. If we can demonstrate measurable success, it might win people over.\nDiego Silva: That’s a solid idea. Pair that with webinars or Q&A sessions where clients can directly ask questions about the AI changes. Transparency would go a long way.\nNia Kabongo: I’ll add to that—maybe we should offer a hybrid model where clients can opt for more human involvement if they’re not ready to fully embrace AI. It might help ease them into the transition.\nGabriela Rosales: I like that. And perhaps we could assign dedicated account managers to high-value clients who are particularly AI-averse. That would show we’re listening to their concerns.\nCamila Ramos: These are great suggestions. Let’s break it down into action items. First, Diego, can you work with the marketing team to start drafting those case studies?\nDiego Silva: Got it. I’ll reach out to them right after this.\nCamila Ramos: Nia, can you coordinate with the events team to set up a webinar series?\nNia Kabongo: Sure thing. I’ll get the ball rolling this week.\nCamila Ramos: Gabriela, could you oversee the hybrid model proposal and come back with a plan?\nGabriela Rosales: Absolutely. I’ll aim to have a draft ready by next Tuesday.\nCamila Ramos: Perfect. Anything else before we wrap up?\nJamal Okonkwo: Just one thing—I think we should also address internal employee concerns more thoroughly. If the team isn’t on board, it’ll be hard to execute these plans.\nCamila Ramos: Agreed. Let’s take that offline and schedule a separate meeting to discuss employee sentiment. Thanks for bringing that up, Jamal. Okay, I think we’re good to end here. Thanks, everyone.\nDiego Silva: Thanks, everyone.\nNia Kabongo: Bye!\nJamal Okonkwo: Talk soon.\nGabriela Rosales: Bye!"

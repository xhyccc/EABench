  title: Informal SDE Lunchtime Career Discussion
  transcript: "Obinna Mensah: Hi everyone, thanks for joining. I know this was kind of impromptu, but given everything going on, I thought it might be helpful to get together and talk about what’s next for us.\n\nAnjali Mehta: Definitely, Obinna. I think we’re all feeling the weight of these layoffs, even if nothing’s confirmed yet. It’s hard to focus on work when you’re constantly wondering if you’re next.\n\nMariam Koné: Agreed. And it feels like every new update about AI makes it harder to see how we fit into the company’s future. I mean, the coding agents are getting better, but they’re also causing more issues. It’s a mess.\n\nHalima Kasimova: Exactly, Mariam. Like yesterday, the pipeline disruption? It took hours to fix, and the AI team still hasn’t explained what went wrong. Meanwhile, clients are losing patience. Honestly, it’s starting to feel like the company’s gambling with all our careers.\n\nMariam Abdullah: Sorry to interrupt, Halima, but can you hear me okay? My connection's been spotty all morning.\n\nHalima Kasimova: Yeah, we can hear you, Mariam. You're good.\n\nLorenzo Rossi: You know, I’ve been thinking—maybe it’s time to step away from tech entirely. There’s so much pressure to keep up with AI, and it’s exhausting. I’ve been looking into consulting roles or even teaching. It feels like it might be more stable.\n\nObinna Mensah: That’s an interesting idea, Lorenzo. I’ve been considering project management or product management roles. Something where the focus isn’t solely on coding but on strategy. I feel like those skills could be transferable.\n\nAnjali Mehta: Same here. I’ve actually been taking some online courses on product management. It’s not easy to find time with everything going on, but it feels like a smart pivot. Plus, those jobs might be less vulnerable to automation.\n\nMariam Koné: That’s smart, Anjali. I’ve been looking at roles in tech advocacy or developer relations. It’s still tech-adjacent, but it’s more about communication and community-building. I think it could be a good fit for my skills.\n\nHalima Kasimova: Oh, I’ve heard good things about DevRel roles. You get to work closely with other developers, but it’s not about just churning out code all day. Seems like it would be really rewarding.\n\nMariam Abdullah: If we’re talking alternatives, has anyone thought about starting their own thing? Like freelancing or consulting independently? I mean, it’s risky, but at least you’re not waiting for someone else to decide your fate.\n\nLorenzo Rossi: I’ve thought about it, but honestly, the idea of running my own business is intimidating. Plus, with the economy where it is, I don’t know if now is the right time.\n\nObinna Mensah: True, Lorenzo. I think freelancing could work, but it depends on having a strong network and a niche skill set. Still, it’s worth exploring. Maybe we could pool together resources or contacts to help each other out?\n\nAnjali Mehta: Yeah, I like that idea. We could start a Slack or WhatsApp group to share leads, job postings, or even freelance opportunities. It might not be a solution, but it’s a step in the right direction.\n\nMariam Koné: Good point, Anjali. And speaking of steps—should we talk about updating our resumes and LinkedIn profiles? If layoffs are coming, we need to be ready to apply for jobs immediately.\n\nHalima Kasimova: Absolutely. I haven’t touched my resume in years, but I started updating it last night. It’s a painful process, but it’s necessary. Maybe we can help each other review them?\n\nMariam Abdullah: That’s a great idea, Halima. Also, has anyone thought about reaching out to recruiters or old colleagues? They might have insights into openings that aren’t publicly advertised yet.\n\nLorenzo Rossi: Good call, Mariam. I’ve been reconnecting with people on LinkedIn. It’s awkward sometimes, but most people understand the situation and are willing to help.\n\nObinna Mensah: Alright, so it sounds like we’ve got a few action items here. Let’s create a group chat for sharing opportunities and resources. We’ll also start updating resumes and LinkedIn profiles—and maybe do a peer review session to help each other polish them up. Does that work for everyone?\n\nAnjali Mehta: Works for me.\n\nMariam Koné: Same here.\n\nHalima Kasimova: Count me in.\n\nMariam Abdullah: Sounds good.\n\nLorenzo Rossi: Yeah, let’s do it.\n\nObinna Mensah: Perfect. I’ll set up the group chat later today and send out invites. Let’s try to stay optimistic, even though things are tough right now. We’ve got each other, and that’s something.\n\nAnjali Mehta: Thanks for organizing this, Obinna. It helps to talk things through.\n\nMariam Koné: Agreed. Let’s keep this momentum going.\n\nHalima Kasimova: Alright, back to the grind for now. Talk soon, everyone.\n\nMariam Abdullah: Bye, all!\n\nLorenzo Rossi: Take care, everyone."

  body: "Hi Ravi and Bintu,\n\nI wanted to follow up on some of the concerns we’ve been discussing around the sales team’s performance and the broader challenges we’re facing, especially in light of the recent resignation of one of our sales managers. First of all, I want to acknowledge how tough this has been for everyone. The combination of client trust issues, internal morale dips, and the uncertainty surrounding the company's AI strategy has created a lot of pressure on the team.\n\nThat said, we need to figure out how to stabilize things quickly. Losing a key client this week was a wake-up call, and it’s clear that we need to proactively address the doubts our clients are expressing about the reliability of our AI solutions. I know we’ve touched on this in previous meetings, but can we revisit the idea of creating a client-facing briefing or FAQ to transparently address their concerns? I think that could help rebuild some trust.\n\nOn the internal side, I’d like to hear your thoughts on what we can do to keep the team motivated—especially given the ongoing uncertainty around layoffs and the AI-first approach. Do we need to adjust our messaging in team meetings? Or maybe we need to work more closely with HR on their new 'AI Transition Support Program' (even though I know the initial feedback on that hasn’t been great)? Any ideas here would be really helpful—I’m all ears.\n\nAlso, circling back to the resignation, I think it’s worth reflecting on whether we’re doing enough to support our managers. If one of them felt they had no choice but to leave due to stress and dissatisfaction, it’s likely others might be feeling the same way. Let’s set up a time to brainstorm how we can offer more targeted support. Open to suggestions on how we approach this without adding to the existing workload.\n\nLastly, Ravi, I think you mentioned in our last check-in that you’d been tracking sentiment in some of our bigger accounts. Could you share any recent updates or notable client feedback that might help us refine our approach here? And Bintu, if you have any additional context from the field team on how they’re coping or what they’re hearing from clients, please let me know.\n\nLet’s aim to discuss this in more depth during Monday’s sync, but feel free to reply here if there’s anything urgent or if you have ideas we can kick off before then.\n\nThanks, and hang in there. I know this isn’t an easy time, but I really believe we can navigate this together.\n\nBest,\nCamila\n\nSent from my iPhone"

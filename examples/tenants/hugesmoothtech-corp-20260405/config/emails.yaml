m to sync up Monday morning to finalize the details. If anything critical comes up over the weekend, feel free to text me—I’ll keep my phone handy. 😊\n\nThanks, everyone. Appreciate your hard work on this.\n\nBest,\nCamila\n\nSent from my iPhone"

ther day but would prefer the morning if possible. In the meantime, if you have any immediate ideas or concerns, feel free to reply here or ping me directly.\n\nThanks, and I appreciate your continued focus and leadership during this challenging time.\n\nBest,\nHana\n\nSent from my iPhone"

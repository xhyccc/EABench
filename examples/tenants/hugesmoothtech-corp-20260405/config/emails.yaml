  body: "Hi Camila and Ravi,\n\nI hope this email finds you well. As I'm sure you're both aware, the protest by the laid-off SDEs outside our headquarters yesterday has gained some traction in the local media. While the coverage has been balanced so far, we need to act quickly to ensure we maintain control of the narrative and protect HugeSmoothTech's reputation.\n\nFirst, let's address the immediate PR strategy. Camila, I’d like you to coordinate with our communications team to draft an official statement. This should emphasize our commitment to innovation and the long-term benefits of AI integration, while also acknowledging the concerns raised by the protesters. Let's be empathetic but firm. We don't want to fuel the perception that we're dismissing human contributions—they were and continue to be a vital part of our journey. Maybe loop in HR too, since they’re already running that employee sentiment survey? Could be useful to cite some positive data points if they’ve got them ready.\n\nRavi, could you double-check with the product and sales teams to see if there are any updates we can highlight that show AI is driving tangible improvements? The patched critical bug and faster build times might be good examples, but I want to make sure they’re comfortable with us using those in external messaging. Honestly, I’m slightly concerned about the dip in sales performance they mentioned—does it tie back to customer hesitation over AI? If so, let’s brainstorm how we can address that proactively.\n\nAlso, not sure if you both saw the internal Slack discussions from yesterday—they got pretty heated. I wonder if any of that sentiment could spill over externally, especially if employees are engaging with the media or sharing stuff online. Should we remind the team about our social media guidelines? Just a thought.\n\nLet’s aim to have a draft of the statement and a solid PR action plan ready by EOD Monday—does that sound feasible? If you need anything from me, just ping me directly.\n\nThanks, and let’s tackle this head-on.\n\nBest,\nHana\n\nSent from my iPhone"

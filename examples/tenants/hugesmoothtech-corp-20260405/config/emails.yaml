  body: "Subject: Leaked Slack Conversation on Layoff Timeline\n\nHi Hana and Joseph,\n\nI hope you’re both holding up okay amidst everything going on. I wanted to reach out regarding the Slack conversation that was leaked yesterday about the potential acceleration of the layoff timeline. As I’m sure you’ve seen, the leak has caused a significant stir on the company forum and in informal discussions around the office. The silent protest in the cafeteria earlier today felt like a culmination of the unease that’s been building for weeks.\n\nThis situation is deeply concerning for several reasons. First, the obvious breach of confidentiality is troubling. While we should absolutely focus on addressing employee concerns, we also need to get to the bottom of how this kind of sensitive information is being shared so freely. Legal is already looking into this, but I think we need to be prepared for the possibility that trust in leadership is eroding more rapidly than we’ve anticipated—and this leak is a symptom of that.\n\nSecond, and more importantly, we need to address the morale fallout head-on. The speculation and anxiety are palpable, and I’m hearing through the grapevine that some teams are struggling to stay focused as a result. I know HR has already announced the 'AI Ethics Roundtable' event, but judging by the reaction online, it’s clear that’s not resonating with people the way we hoped. We need to think more creatively and quickly about how to reassure employees without making promises we can’t keep.\n\nA few thoughts I had:\n1. Should we consider a more direct and transparent all-hands meeting where leadership can address these concerns openly? Maybe framed as 'Ask Me Anything' so employees feel they can voice their frustrations freely?\n2. Would a joint statement from the leadership team (including the AI division) help in clarifying the rationale behind some of the recent decisions? We could emphasize our long-term vision while acknowledging the challenges we’re still working through.\n3. Can we revisit the 'AI Transition Support Program' messaging? Right now, it’s being dismissed as superficial, but could we expand it to include more tangible benefits—like job placement support, reskilling workshops, or even mental health resources?\n\nAlso, I’m wondering if we might need to get ahead of the narrative externally. With the journalist critique still circulating and a major client walking away, we don’t want this latest incident to fuel further doubts about our stability. Should we loop in Comms to explore proactive PR opportunities that highlight our AI successes and long-term strategy? Maybe a case study or some kind of public-facing Q&A about our progress?\n\nLet me know your thoughts on all this. I realize it’s a lot to unpack, but we can’t afford to let this fester any longer than it already has. Can we set up a time to connect tomorrow morning to align on next steps? I’m thinking 9:30 AM—does that work for you both?\n\nThanks,\nAmira\n\nSent from my iPhone"

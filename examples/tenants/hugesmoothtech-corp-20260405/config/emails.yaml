  body: "Hi Hana and Ravi,\n\nHope you’re both doing well. I wanted to follow up on some of the recent conversations around layoffs and the broader anxiety that’s been bubbling up across the company. As you know, the leaked Slack messages and the cafeteria protest last week have really amplified the sense of unease among employees, especially in the engineering teams. I think it’s safe to say that just sending out another generic HR update isn’t going to cut it this time.\n\nWe need a proactive, transparent communication strategy to address these concerns head-on—and fast. Employees are already speculating about the next round of layoffs, and the silence from leadership has only fueled rumors. I’ve been thinking about how we can take control of the narrative and create a sense of trust in this very uncertain period.\n\nHere’s what I’m proposing:\n\n1. **Team-wide Q&A sessions:** We could host small-group Q&A meetings where employees can ask questions directly to leadership. This would help dispel misinformation and give people a chance to feel heard. Maybe we could start with the SDE teams since they seem most impacted right now?\n\n2. **Weekly update emails:** These would include clear, honest updates about AI integration progress, layoffs (if we have concrete plans), and support initiatives like the AI Transition Support Program (though we might need to rethink how we frame that—feedback hasn’t been great so far).\n\n3. **Dedicated Slack channel for transparency:** A space for employees to ask questions and get official answers from leadership. This could help reduce speculation on the forums, but we’d need to moderate carefully to keep it constructive.\n\n4. **Address ethical concerns directly:** The upcoming AI Ethics Roundtable could be a starting point, but we need to make sure it’s not just performative. Maybe we could include external experts or even some of the more vocal employees to make it feel more authentic?\n\nA couple of things I’d love your input on:\n- Should we include specific timelines for layoffs in these communications, or will that create more panic than clarity?\n- How do we balance transparency with the risk of oversharing sensitive info (e.g., the Slack leaks)?\n\nAlso, given the client feedback Ravi mentioned last week, I wonder if we should loop in someone from the sales team to align our internal messaging with what we’re telling clients externally. Thoughts?\n\nLet me know what you think, and feel free to suggest tweaks or additional ideas. I think we need to move quickly on this—ideally, we’d have the first Q&A session or email ready by early next week.\n\nThanks,\nBintu\n\nSent from my iPhone"

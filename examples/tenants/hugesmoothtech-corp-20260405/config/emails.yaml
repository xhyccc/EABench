  body: "Hi Diego, Nia, and Gabriela,\n\nHope you're all doing well. I wanted to loop you in on an important initiative we need to prioritize: creating a clear and proactive client transparency strategy around how AI is impacting our deliverables and contracts.\n\nAs you've probably seen, there's been a lot of internal and external noise lately—everything from that leaked roadmap document to the client inquiries we've been fielding this week (e.g., the high-priority ticket from March 30). It's clear that many of our clients are feeling uneasy about how our AI-driven changes might affect their partnerships with us. We need to get ahead of this fast.\n\nHere’s what I’m thinking:\n\n1. **Framework Overview**: We need to outline a standard framework for how we communicate AI-related changes to clients. This should address:\n   - Specific impacts to deliverables (e.g., timelines, quality, etc.).\n   - Any changes to contract terms or SLAs.\n   - How we’ll ensure continuity and reliability despite the new processes.\n\n2. **Talking Points for Sales**: The sales team is already seeing a dip in performance, and a lot of it comes down to clients hesitating because of uncertainty. We need a clear, unified set of talking points for the team to use during calls and meetings. Let’s also consider a short FAQ doc—something we can share with clients directly if needed.\n\n3. **Client-Facing Materials**: Do we have any plans for public messaging on this yet? If not, we may need to work with marketing to draft a blog post or email campaign that reassures clients about the benefits of our AI-first approach (and addresses the elephant in the room re: layoffs, if that comes up). Transparency is key here.\n\n4. **Internal Alignment**: Lastly, we need to ensure our internal teams are 100% aligned on this messaging. The last thing we want is mixed signals reaching clients. Should we schedule a quick sync with the product and AI teams to confirm the details of what’s changing and when?\n\nI’d love to get your thoughts on this. Are there any points I’m missing, or areas where you think we need to dig deeper? Also, Gabriela, can you double-check if there’s already a client comms plan in the works from marketing? I don’t want to duplicate efforts if something’s already in motion.\n\nLet’s aim to have a rough draft of the framework by end of next week, so we can review it together and loop in any other stakeholders as needed.\n\nThanks, and let me know if you'd like to discuss this live. Happy to hop on a quick call if that’s easier.\n\nBest,\nCamila\n\nSent from my iPhone"

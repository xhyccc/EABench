  body: "Hi Hana, Bintu, and Valerie,\n\nI hope you’re all doing well. I wanted to follow up on the announcement of the AI Ethics Roundtable and share some of the feedback I’ve seen so far. To be honest, the initial reaction from employees has been mixed at best—although I’d say it’s leaning more toward skepticism and frustration. Here’s a quick summary of what’s come up:\n\n1. **Skepticism about the event’s purpose**: A lot of comments on the company forum suggest employees feel this is more of a PR move than a genuine effort to address concerns. Some sarcastically referred to it as \"the AI Apology Tour\" or \"Ethics Theater.\" This probably stems from the timing—it’s hard to ignore the context of recent layoffs, project delays, and leaked memos about more workforce reductions.\n\n2. **Lack of trust in leadership**: There’s a clear undercurrent of distrust in the conversations I’ve seen. Employees are questioning whether their voices will actually be heard or if decisions have already been made. One comment that stood out was: \"If ethics mattered to leadership, they wouldn’t have waited until we started protesting to host this.\"\n\n3. **Low engagement so far**: Despite the announcement, it seems like very few people have RSVP’d or expressed interest in attending. Some employees are suggesting boycotting it altogether, which could be a problem if we want this event to gain traction and foster meaningful discussion.\n\nGiven the above, I think we need to make some adjustments to improve engagement and address the skepticism. Here are a few ideas:\n\n- **Clarify the goals and format of the roundtable**: Maybe we can explicitly outline what leadership hopes to achieve with this event and how employee input will be incorporated into decision-making? Right now, it feels pretty vague, and I think that’s contributing to the lack of trust.\n\n- **Include more diverse voices**: I noticed that some employees are calling out the lack of representation in the panel. Could we widen the lineup to include SDEs, junior staff, or even someone from the sales team? It might help to show that this isn’t just top-down messaging.\n\n- **Follow through with actionable outcomes**: If we can commit to publishing a post-event summary with specific next steps, it might reassure folks that this isn’t just performative.\n\nWhat do you all think? I’d love to hear your thoughts, especially if you’ve caught wind of anything I might’ve missed. Also, should we loop in HR to discuss the event structure before it’s too late to make changes?\n\nLooking forward to hearing from you!\n\nBest,\nLeila\n\nSent from my iPhone (sorry for any typos!)"

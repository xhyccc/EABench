e know your thoughts—I value your perspectives and want to ensure we’re addressing concerns effectively.\n\nLastly, if any of you have heard specific rumors or misinformation circulating that you think we need to address, please flag them for me. It’s important that we’re all working with accurate information to minimize unnecessary stress and confusion.\n\nThanks for your understanding and support during this challenging time. Let’s keep the lines of communication open as we navigate these changes together.\n\nBest regards,\n\nMariam\n\nSent from my iPhone"

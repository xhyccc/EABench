  body: "Hi Bintu, Kenji, and Luis,\n\nHope this email finds you well. I just wanted to follow up on yesterday’s lunchtime discussion about alternative career paths and share some of the key takeaways, especially given everything going on at HugeSmoothTech right now.\n\nFirst off, it was really great to see such a strong turnout—honestly, it felt like half the engineering floor showed up, which says a lot about how seriously people are taking these layoffs rumors and the broader uncertainty. Kudos to everyone for creating such a candid and supportive space for sharing ideas (and frustrations).\n\nA few themes really stood out during our conversation:\n\n1. **Upskilling for non-SDE roles**: A lot of folks mentioned interest in pivoting to product management, technical writing, or even roles in sales engineering. There seems to be growing curiosity about how our existing skill sets as developers (problem-solving, systems thinking, etc.) could translate into areas less exposed to automation risks. Bintu, I think you mentioned a great point about reaching out to PMs internally to learn more about their day-to-day—would you be open to sharing any resources or contacts you might have?\n\n2. **Freelancing and consulting**: Several people brought up freelancing as a possible path forward, especially given the declining trust in corporate stability here. Kenji, you mentioned platforms like Toptal and Upwork—could you clarify how they vet talent? And are they worth pursuing for folks without much experience outside traditional employment?\n\n3. **Exploring AI-adjacent roles**: Ironically, it seems like some of us are considering moving into roles that focus on AI ethics, auditing, or governance, given the demand for transparency in the industry right now. Luis, I think you mentioned that your friend at another firm transitioned into AI compliance—any chance you could connect us with them for insights?\n\nLastly, there was a lot of concern about timing and planning for worst-case scenarios. Someone (sorry, I forgot who!) suggested pooling resources to prepare resumes, portfolios, and LinkedIn updates together as a group. If there’s interest, maybe we can organize a follow-up session next week for this? Let me know what you guys think.\n\nP.S. I realize this email is a bit all over the place, so feel free to flag anything I missed or got wrong—I was jotting notes quickly while eating (multitasking fail). Also, if anyone has ideas for other career paths we didn’t touch on, please share!\n\nTake care and talk soon,\n\nAnjali\n\nSent from my iPhone"

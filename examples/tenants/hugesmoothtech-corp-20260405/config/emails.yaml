stions. I’ll be in back-to-back meetings this afternoon, but I’ll check my email periodically. Feel free to Slack me if something urgent comes up.\n\nThanks for your understanding and quick action on this—this team’s resilience really shines in moments like these. Let’s keep the momentum going.\n\nBest,\nRavi\n\nSent from my iPhone"

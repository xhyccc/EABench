you pull together some initial ideas on how we frame this message?\n\nLet me know if you have other thoughts or questions—it’s going to take a team effort to turn things around here. Also, quick heads-up: I’m traveling tomorrow, so please email or text if it’s urgent.\n\nBest,\nMandla\n\nSent from my iPhone"

  body: "Hi Amélie, Liang, and Yara,\n\nHope you're all doing well. I wanted to touch base regarding the recent update to the severance FAQ and the growing concerns it has sparked among employees. It's clear the quiet rollout of this change has led to confusion and mistrust, which we really can't afford right now given the broader tensions across teams.\n\nI understand the intention behind the update was to consolidate information and make policies clearer, but without proactive communication, it's ended up having the opposite effect. I've already received emails from a few employees asking if this signals more layoffs or changes to severance terms. (Side note: Has anyone else gotten similar messages?)\n\nTo address this, I suggest we take the following steps immediately:\n\n1. **Transparent Communication:** Can we draft a company-wide email explaining why the FAQ was updated and explicitly state that it’s not indicative of imminent policy changes? We need to reassure employees and squash any rumors before they spiral further.\n\n2. **Q&A Session:** I recommend we host a live Q&A or an all-hands meeting next week to address employee concerns directly. HR could lead it, but having leadership present (myself included) would help demonstrate that we’re listening and taking this seriously.\n\n3. **Feedback Loop:** Moving forward, let’s create a more structured process for rolling out policy changes or updates to internal resources. Maybe we can loop in a small focus group of employees to preview updates before they go live to flag any potential red flags?\n\nAlso, we may want to revisit the messaging around the 'Adapting to Change in AI-Driven Workplaces' workshop. I've heard some feedback that it’s coming across as tone-deaf in the current climate, and it might be worth pausing or reframing it. Yara, do you have bandwidth to gather some feedback from managers on this topic?\n\nLastly, Liang, could you double-check with the product team to ensure they’re aligned with HR on the FAQ updates? I’d like to make sure we’re all on the same page before communicating anything further.\n\nLet’s aim to have a draft of the proposed email ready by Monday morning so we can review it together. If you need me to jump on a quick call to brainstorm, just let me know.\n\nAppreciate all your efforts on this—it’s been a tough week, but I know we can get through this if we tackle it head-on.\n\nBest,\nRavi\n\nSent from my phone. Please excuse any typos."

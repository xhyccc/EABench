ddress some concerns, I think we need to do more to restore trust and ensure alignment across teams.\n\nPlease let me know your thoughts on the above points by EOD tomorrow so that we can prepare for the leadership sync later this week. If there’s anything unclear or if I’ve missed something important, feel free to call it out.\n\nThanks for your time and continued dedication during what I know has been a challenging period for all of us.\n\nBest,\nMariana\n\nSent from my iPhone"

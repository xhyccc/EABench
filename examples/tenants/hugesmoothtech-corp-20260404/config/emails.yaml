  body: "Hi Amélie, Takeshi, Ravi,\n\nI hope this email finds you well, though I know the past few days have been particularly challenging for everyone. Between the backlash over the HR workshop and the leaked document about middle-management changes, it's clear we need to address employee morale head-on before things escalate further. I wanted to share a few thoughts and get your input on how we can take meaningful steps to rebuild trust and foster some positivity.\n\nFirst, regarding the feedback from the HR workshop—it’s obvious we missed the mark. Employees are understandably feeling uneasy with the layoffs looming, and the timing of the 'Adapting to Change in AI-Driven Workplaces' session was not ideal. We need to reframe how we approach these initiatives. Does it make sense to pause further mandatory workshops for now and instead focus on open Q&A sessions or town halls? Something less formal but more interactive might help clear the air. Thoughts?\n\nOn the morale front, I think we should explore initiatives that encourage cross-team collaboration and celebrate recent wins. For instance, the AI team’s debugging update was a huge step forward—it’s worth spotlighting successes like this to remind everyone of the meaningful impact they're still making. Could we organize a small event or create a 'win of the week' communication to circulate across teams? Maybe even a virtual coffee hour or something casual? I’m spitballing here, so feel free to suggest better ideas.\n\nLastly, the leaked document has understandably shaken people up. Transparency is going to be key moving forward. I’d like us to start collecting anonymous feedback on employee concerns—whether it’s through surveys, a dedicated email inbox, or even an external platform if that feels safer for folks. Could you help brainstorm how to structure this feedback loop so people feel heard without fear of repercussions? Amélie, I know you floated something similar last quarter—can you share that framework again if you still have it handy?\n\nLet’s aim to sync early next week to finalize a plan. If you have time before then, could you double-check with HR on the feasibility of some of these ideas? Also, Takeshi, could you check with the product team about their survey results—might be helpful to incorporate any early findings into our morale initiatives.\n\nThanks, everyone. Appreciate you sticking with this during a tough week.\n\nBest,\nLiang\n\nSent from my iPhone"

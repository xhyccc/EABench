ensions are running high across teams, especially with layoffs and employee morale issues compounding things—but we need everyone’s focus on delivering these fixes. If there’s any roadblock, internal or external, that’s slowing progress, let me know immediately so I can help remove it.\n\nPlease reply with a detailed status update by EOD today so we can align on next steps. Feel free to CC anyone else who might need to weigh in.\n\nThanks,\nMariana\n\nSent from my iPhone"

  body: "Hi Takeshi, Mariana, and Ravi,\n\nI hope this email finds you well. I'm reaching out regarding the unexpected resignation of a mid-level manager yesterday, who cited dissatisfaction with our increasing reliance on AI-driven management tools. This resignation has raised some serious concerns that I believe we need to address promptly.\n\nAs you know, there have been ongoing discussions—both formal and informal—about the balance between human oversight and AI automation in our operations. The recent updates to the AI coding agents and the push for more AI-driven features have sparked debates, and we’ve seen feedback from employees and clients alike that suggests we might need to recalibrate our approach.\n\nI understand the HR workshop on 'Adapting to Change in AI-Driven Workplaces' wasn’t well-received, and the leaked document about middle-management replacements has only added fuel to the fire. These issues, combined with the recent layoffs, have created an atmosphere of uncertainty that we must address head-on.\n\nHere’s what I need from each of you:\n1. Please review any feedback you’ve received from your teams regarding AI-driven tools or processes. Are there similar concerns about usability, job security, or the overall direction of the company?\n2. Based on what you observe, propose actionable changes that we can implement to improve the situation. This could involve adjustments to our AI strategy, communication methods, or even a reevaluation of how we’re integrating AI into the workplace.\n3. If possible, coordinate with HR to gather additional insights from employees—especially those who might not feel comfortable speaking up directly.\n\nI’d like to discuss this further in next week’s leadership meeting. Can each of you send me a brief summary of your findings by next Wednesday so I can consolidate everything beforehand? If you need more time or have questions about specifics, let me know.\n\nAlso, Ravi, could you double-check the timeline for the next phase of layoffs? I want to make sure we’re communicating that as clearly as possible to avoid further backlash.\n\nThanks, everyone. I know things have been tense recently, but I’m confident we can work through this together.\n\nBest,\nAmélie\n\nSent from my iPhone"

A session? I just want to confirm if the skepticism we’re hearing matches the data.\n\nLet’s aim to have a draft strategy ready for review by early next week. I know we’re all juggling a lot right now, but addressing these concerns feels urgent.\n\nThanks,\nRavi\n\nSent from my iPhone"

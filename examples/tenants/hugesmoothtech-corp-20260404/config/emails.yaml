es to rebuild trust.\n\nPlease let me know if anything here is unclear or if I’ve missed something critical. I’ll be in meetings most of the day, but I’ll try to check my email periodically. If it’s urgent, just Slack me or text me.\n\nThanks, everyone.\n\nBest,\nRavi\n\nSent from my iPhone"

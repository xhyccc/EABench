  body: "Hi Mona, Khoi, and Luca,\n\nHope you're all doing well. I wanted to share a summary of the feedback we’ve gathered from engineers regarding the usability of the AI coding agents, particularly as we prepare for the next update rollout. There’s been a lot of discussion, both formally and informally, and I think we need to address some key concerns before moving forward.\n\nFirstly, the debugging functionality introduced in the last update has been a mixed bag. While the AI team claims the recent hotfix resolved 95% of issues, engineers are still reporting sporadic failures. One of the senior engineers even submitted a detailed report highlighting persistent problems and suggesting that we revisit the broader replacement strategy. On top of that, a junior engineer proposed a workaround that’s gaining traction among the team, but it feels like there’s been little recognition from management—which isn’t helping morale.\n\nAnother point that came up repeatedly is the prioritization of AI-driven features over customer-requested updates. This has been a sore spot for both engineers and clients. As you might remember from the product meeting last week, there was a pretty heated debate over this. Now, with a key client threatening to terminate their contract unless critical SaaS bugs are fixed in 48 hours, it’s clear we need to rethink how we’re balancing internal innovation with external demands. I worry that if we don’t address this soon, we could lose more clients.\n\nOn top of usability concerns, there’s the human factor. Layoff rumors, the HR workshops, and the leaked discussions about expanding AI-driven roles have created a tense atmosphere across teams. Over 70% of employees reported feeling uncertain about their job security in the anonymous survey, and that’s showing up in the feedback too—engineers are openly questioning whether the coding agents are actually helping them or just being pushed for cost-cutting reasons. I know this isn’t directly related to usability, but it’s hard to separate these issues when they’re clearly impacting how people perceive and use the tools.\n\nGiven all this, I think we need to take a step back and consider:\n1. Can we extend the testing timeline for the next update? Engineers have already flagged concerns about insufficient testing, and rushing this could create more problems than it solves.\n2. Should we acknowledge the workaround proposed by the junior engineer and consider incorporating it into the update? It might show the team that their feedback is valued.\n3. Is there a way to better communicate how we prioritize AI-driven features versus client needs? Right now, the messaging feels unclear (and frankly, contradictory).\n\nLet me know your thoughts—especially if you have any ideas for addressing these concerns more effectively.\n\nThanks,\nRitika\n\nSent from my iPhone"

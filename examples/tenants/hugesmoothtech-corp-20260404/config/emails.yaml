  body: "Hi Takeshi, Ravi, Mariana, and Jamal,\n\nI hope you're all managing to stay grounded amidst everything that's happening. I wanted to follow up urgently regarding the leaked email about the second wave of SDE layoffs and how we plan to address the fallout—both internally and externally. This situation feels like it's escalating faster than anticipated, and we need to get ahead of it before morale takes another hit.\n\nFirst off, I want to acknowledge the concerns raised in Slack and during yesterday's impromptu discussions. Employees are clearly shaken, and the skepticism around the AI-first strategy is becoming more vocal. While I stand by the long-term benefits of the shift, we can’t ignore the emotional toll and the growing disconnect between leadership and the workforce. That said, our communication needs to be tighter and far more transparent moving forward.\n\nFor the immediate term:\n1. **Internal Messaging**: We need to craft a company-wide statement addressing the layoffs, the reasoning behind them, and what support systems are available for affected employees. Mariana, could you pull together a draft for review by EOD tomorrow? Make sure it doesn’t sound too corporate—people are craving authenticity right now.\n2. **Employee Engagement**: Ravi, you mentioned in last week’s meeting that we could leverage employee panels for feedback. Can we fast-track that idea? A town hall might also be worth considering to give employees a chance to air concerns and ask questions directly. Thoughts?\n3. **Client Relations**: Jamal, I know your team is already stretched thin, but could you loop in Legal to help draft responses for the major SaaS client threatening litigation? We need to reassure them we’re prioritizing their needs while balancing the AI rollout—it’s a tough sell, but it’s critical.\n\nSeparately, the mandatory ‘AI Adaptation Workshop’ announcement has been met with mixed reactions (to put it lightly). There’s a lot of skepticism about whether it’s truly helpful or just optics. Takeshi, can you check in with HR and maybe suggest a slight reframe? If we position it as a collaborative skill-building session rather than a top-down directive, it might land better.\n\nAs for the coding agent bug—this is a huge risk. The emergency patches yesterday were a temporary fix, but we need a more robust QA process (and fast). Let’s touch base tomorrow about allocating additional resources to stabilize the AI systems; otherwise, these cascading failures will keep eroding trust.\n\nFinally, I know tensions are high, and everyone’s under immense pressure. Let me know if you need more clarity or if I missed anything. I’m flying out to the Bay Area tomorrow afternoon but will be on email intermittently—feel free to text if something’s urgent.\n\nAppreciate all of you stepping up during such a challenging time.\n\nBest,\nAmélie\n\nSent from my iPhone"

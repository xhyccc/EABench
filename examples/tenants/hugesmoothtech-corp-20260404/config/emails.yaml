  body: "Hi Mariana, Jamal, and Mandla,\n\nI hope this email finds you well despite the whirlwind of challenges we've been navigating lately. I wanted to follow up on several critical issues that have been escalating over the past week, as they directly impact our product roadmap and overall client satisfaction.\n\nFirst, it’s impossible to ignore the increasingly vocal complaints from both our smaller and key clients about unresolved feature bugs and the lack of customer-requested updates. The situation with [Key Client X] is particularly alarming—legal action over the 48-hour deadline would be a worst-case scenario, and I trust the product and customer success teams are pulling all-nighters to resolve this. But this can’t just be a one-off firefight. We need to rethink how we balance our roadmap priorities.\n\nDuring our last product meeting on the 25th, the debate about prioritizing AI-driven features over customer feedback got... let’s just say, heated. This is clearly not just an internal debate anymore; it’s spilling over into client relationships, morale, and even our market reputation. The fact that the sales team lost a major client due to dissatisfaction with our AI-driven roadmap is a huge red flag. We can’t afford to alienate more customers—big or small—especially in this current climate.\n\nTo that end, I’d like us to double down on evaluating whether our current approach is sustainable. Some specific points I think we should discuss:\n\n1. **Client Escalations:** Can we compile a detailed breakdown of the most common feature requests from clients (both key and smaller) and cross-reference that with the escalations reported in the past two weeks? We need to figure out if there’s a pattern we’re missing—or worse, ignoring.\n\n2. **AI Priorities vs. Customer Needs:** While the AI team’s updates (e.g., the debugging improvement and recent hotfixes) are technically impressive, I’m concerned about their real-world usability. Engineers and clients alike are flagging issues, and it’s clear that rushing updates without adequate testing isn’t winning us any fans. Is there a middle ground here? Can we shift some resources to focus on stabilizing and refining customer-requested features without completely derailing the AI innovation timeline?\n\n3. **Internal Alignment:** The internal backlash—from employees to mid-level management—is another aspect we can’t ignore. The leaked documents and intranet debates are symptoms of a deeper issue. Are we doing enough to ensure that teams feel heard and supported? (HR’s handling of the ‘Adapting to AI’ workshops leaves a lot to be desired, frankly.)\n\n4. **Next Steps:** What’s our immediate plan for addressing the smaller client complaints? The customer support team is clearly overwhelmed, and I’m worried about their capacity to handle both day-to-day issues and these escalations. Can we allocate additional resources temporarily to ease the burden?\n\nI know this is a lot to digest, but I think we need to tackle these issues head-on before they spiral further. Let’s aim to meet early next week to put a concrete plan in place—Tuesday works for me, but let me know if another time is better. In the meantime, please share any thoughts or data you have that might help frame this discussion.\n\nThank you all for your hard work and resilience during what has undoubtedly been an intense few weeks. I know it hasn’t been easy, but I believe we can course-correct if we approach this strategically and collaboratively.\n\nBest,\nAmélie\n\nSent from my iPhone"

  body: "Hi Amélie, Nisha, and Ritika,\n\nHope you’re all doing well (or, as well as can be expected given the current climate 😅). I wanted to loop you in on the results of the recent anonymous employee survey—over 70% of respondents reported feeling uncertain about their job security. This is a pretty alarming statistic, and it aligns with the general sentiment we’ve been picking up from conversations around the office and on the intranet.\n\nHR is planning another 'Adapting to AI' workshop to address these concerns, but honestly, I feel like we’re missing the mark here. Based on the feedback from the last session, employees aren’t buying into these workshops—they’re seeing them as a bandaid solution rather than tackling the root causes of distrust. If anything, the layoffs and leaked internal plans about expanding AI-driven roles are only fueling the anxiety.\n\nGiven everything going on (bugs in the AI tools, client dissatisfaction, and the middle-management shakeups), I think we need a broader strategy to address the underlying issues. I’m wondering if it’s worth setting up a cross-departmental discussion to brainstorm actionable solutions? Maybe we could pull in someone from the product team (since they’ve been grappling with client fallout), the AI team (to speak to the tech roadmap), and HR (to get their perspective on morale and trust-building).\n\nAlso, is it worth revisiting the timeline for the AI rollout? There are real concerns about whether these tools are ready for prime time, and if engineers don’t trust them, it’s hard to sell the idea that they’ll ultimately improve workflows. I know the AI team announced another update for next week, but I’d love to hear your thoughts on whether we should push for an extended testing phase.\n\nLet me know if you think this makes sense, or if I’m missing something here. Happy to jump on a quick call to discuss if needed—just shoot me a time that works.\n\nBest,\nAmina\n\nSent from my iPhone"

  title: 'HR Workshop Planning: Adapting to AI'
  transcript: "Jacqueline Dubois: Hi everyone, thanks for joining on such short notice. Can everyone hear me?\n\nAmina Mustafa: Yes, I can hear you.\n\nMei-Lin Ou-Yang: Loud and clear.\n\nNeha Khatri: Same here.\n\nJacqueline Dubois: Great. So, today’s meeting is about planning the upcoming ‘Adapting to AI’ workshop. As you’ve probably seen, the survey results are in, and over 70% of employees feel uncertain about their job security. There’s a lot of skepticism about these workshops, but we need to address this head-on. Let’s start by brainstorming content ideas. Amina, any thoughts?\n\nAmina Mustafa: Sure. I think we need to be brutally honest in this one. The last workshop felt too generic, and employees didn’t feel like their specific concerns were addressed. Maybe we can start by acknowledging the elephant in the room—AI is here to stay, and it’s going to change roles. Then move into actionable advice on how to adapt.\n\nJacqueline Dubois: That’s a good point. Honesty is key. Mei-Lin, what do you think?\n\nMei-Lin Ou-Yang: I agree. And I think we should make it interactive. Maybe include breakout sessions where employees can discuss how AI might impact their specific roles. We could also bring in someone from the AI team to explain how decisions are made.\n\nNeha Khatri: Sorry to interrupt, but I’m not sure that’ll go over well. Employees are already frustrated with the AI team. Bringing someone in might just escalate tensions.\n\nAmina Mustafa: Neha has a point. Maybe instead of bringing in the AI team, we could use anonymized case studies or examples to show how other companies have handled these transitions.\n\nJacqueline Dubois: That’s a good compromise. Actionable examples could help make this feel less abstract. What about addressing the layoffs directly? Should we include a segment about that?\n\nNeha Khatri: Hmm. I’m torn. On one hand, avoiding it makes us look tone-deaf. But on the other hand, we don’t have all the answers, and addressing it might just open the floodgates for more questions we can’t answer.\n\nMei-Lin Ou-Yang: What if we frame it as a discussion about future-proofing your career? Focus on upskilling and transferable skills rather than just layoffs.\n\nJacqueline Dubois: I like that framing. Let’s pivot to logistics. Amina, do we have a date set?\n\nAmina Mustafa: Tentatively, April 15th. But we still need to finalize the platform. Are we thinking in-person or virtual?\n\nNeha Khatri: Virtual. Definitely virtual. Given how sparse the attendance was for the Q&A session, I think we need to make it as easy as possible for people to join.\n\nJacqueline Dubois: Agreed. Virtual it is. Let’s also record it for anyone who can’t attend live. Anything else?\n\nMei-Lin Ou-Yang: We should send out an agenda beforehand to manage expectations. People need to know this isn’t just another generic session.\n\nAmina Mustafa: And maybe a follow-up survey? Something short and sweet to see if this actually helped.\n\nNeha Khatri: Good idea. But let’s keep it anonymous. People are already feeling paranoid.\n\nJacqueline Dubois: Noted. Okay, let’s recap action items: Amina, finalize the date and platform. Mei-Lin, work with me on drafting the agenda and content. Neha, can you handle the follow-up survey?\n\nNeha Khatri: Sure, I’ll draft something by Monday.\n\nJacqueline Dubois: Perfect. Anything else?\n\nAmina Mustafa: One last thing—should we address the leaked documents about expanding AI-driven layoffs? People are definitely going to bring that up.\n\nJacqueline Dubois: Let’s take that offline. I’ll loop in legal and leadership before we decide on a strategy. For now, let’s focus on the workshop content.\n\nAmina Mustafa: Got it.\n\nJacqueline Dubois: Alright, thanks everyone. Let’s meet again next week to finalize everything. Meeting adjourned.\n\nMei-Lin Ou-Yang: Thanks, Jacqueline. Bye, everyone.\n\nNeha Khatri: Bye!\n\nAmina Mustafa: See you all next week."

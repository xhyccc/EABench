  start_time: 2026-03-28T17:00:00Z
  title: HR Q&A Post-Mortem
  transcript: "Ravi Patel: Hi everyone, thanks for joining today’s meeting. I know it’s been a busy and challenging few days. Let’s dive right into the agenda: the sparse attendance at the recent HR Q&A session and what we can do to improve engagement. Can everyone hear me okay?\n\nJamal Okonkwo: Yeah, loud and clear.\n\nJacqueline Dubois: Yes, I can hear you.\n\nMohammed Haddad: Same here.\n\nYara Morales: Yep, no issues.\n\nRavi Patel: Great. So, first off, the attendance numbers were pretty disappointing—only about 12 people joined out of over 300 employees. I think we need to be honest about why people didn’t show up. Yara, you’ve been closely involved in planning these sessions. What’s your take?\n\nYara Morales: Well, Ravi, I think the lack of trust is a big factor here. Employees are skeptical that these sessions will lead to any meaningful change. They feel like HR is just going through the motions, especially after the backlash from the 'Adapting to Change' workshop.\n\nJamal Okonkwo: Agreed. I’ve been hearing similar sentiments from my team. They’re saying HR is more focused on keeping the company’s image intact than actually addressing employees’ concerns. And honestly, the leaked document about AI-driven layoffs didn’t help build trust.\n\nMohammed Haddad: If I can jump in—sorry, my internet’s been spotty today, can you all hear me?\n\nRavi Patel: Yep, we can hear you, Mohammed. Go ahead.\n\nMohammed Haddad: Thanks. Yeah, I think Jamal’s right. People feel like their questions won’t get answered honestly, or worse, that asking tough questions might put them on some kind of radar. The optional nature of the session also made it easy to ignore. If it’s not mandatory, it’s like saying it’s not important.\n\nJacqueline Dubois: Can I add something here? I also think the timing was bad. A lot of teams were dealing with emergencies—the SaaS product rollout issues, the debugging hotfix confusion, and the client escalations. People didn’t have the bandwidth to join a virtual Q&A when it felt like everything else was falling apart.\n\nRavi Patel: That’s a fair point, Jacqueline. Timing is definitely something we need to reconsider. But beyond timing, it seems like trust—or the lack of it—is the biggest issue here. How do we rebuild that?\n\nYara Morales: It’s not going to be easy. Rebuilding trust takes time and consistent action. One idea could be to start with smaller, team-specific Q&A sessions where people might feel more comfortable being candid. We could also use anonymous surveys to gather concerns ahead of time and address them directly during the sessions.\n\nJamal Okonkwo: I like the idea of smaller sessions. People might feel less intimidated in a smaller group setting. But we also need to show follow-through. If HR promises to address a concern, there needs to be visible action afterward, even if it’s just a progress update.\n\nMohammed Haddad: I agree with Jamal. Transparency is key. Even if we don’t have all the answers, just acknowledging issues openly could go a long way. Also, could we consider bringing in an external facilitator for these sessions? Someone neutral might make employees feel safer speaking up.\n\nJacqueline Dubois: External facilitators could be helpful. Another thought—what if we added a feedback loop after each session? Like a quick survey to ask attendees how they felt about the session and what could be improved. That way, we’re showing we’re open to listening and adapting.\n\nRavi Patel: Good ideas, everyone. Let’s summarize and prioritize. First, smaller, team-specific sessions. Second, anonymous surveys to gather questions beforehand. Third, external facilitators to create a safer environment. Fourth, post-session feedback loops. Anything I missed?\n\nYara Morales: Maybe a clearer communication strategy? We need to explain why these sessions are happening and what employees can realistically expect from them.\n\nJamal Okonkwo: Yeah, and we need to address the elephant in the room—the layoffs and AI-driven changes. People are scared, and avoiding the topic isn’t helping.\n\nMohammed Haddad: Agreed. If we don’t address layoffs transparently, these sessions will feel disingenuous.\n\nRavi Patel: Got it. So, add clear communication about the purpose of these sessions and a commitment to addressing layoffs directly. I’ll work with Yara on drafting a plan. Jacqueline, can you take point on exploring external facilitators?\n\nJacqueline Dubois: Sure, I’ll start researching options.\n\nRavi Patel: Perfect. Any other thoughts before we wrap up?\n\nYara Morales: Just one—let’s set realistic expectations internally too. These changes won’t fix trust overnight. We need to be patient and consistent.\n\nRavi Patel: Absolutely. Thanks, everyone. I’ll send out a summary of today’s action items shortly. Let’s aim to meet again in a week to check progress. Have a great day.\n\nJamal Okonkwo: Thanks, Ravi. Bye, everyone.\n\nJacqueline Dubois: Bye!\n\nMohammed Haddad: Take care.\n\nYara Morales: See you."

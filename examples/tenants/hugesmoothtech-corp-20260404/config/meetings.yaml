  title: HR Workshop Orientation
  transcript: "Mandla Abebe: Good afternoon, everyone. Thank you for joining today's meeting. As you know, we're here to discuss the orientation for the mandatory HR workshop on adapting to AI-driven workplaces. Let's get started. Can everyone hear me?\n\nJacqueline Dubois: Yes, Mandla, loud and clear.\n\nAmina Mustafa: Same here. Thanks.\n\nNeha Khatri: I can hear you, but there’s a bit of an echo. Is anyone else hearing that?\n\nRitika Chowdhury: Yeah, there’s some echo on my end too. Mandla, I think it might be coming from your mic.\n\nMandla Abebe: Oh, okay. Give me a second to adjust my settings. [pause] Is this better now?\n\nAmina Mustafa: Much better, thanks.\n\nMandla Abebe: Great. So, as you all know, AI is becoming a core element of our operations, as highlighted by the recent update to the coding agents. While these advancements improve productivity, they also require us to rethink how we work and collaborate. The workshop is designed to help everyone adapt to these changes. Jacqueline, could you outline the goals of the workshop?\n\nJacqueline Dubois: Sure, Mandla. The workshop has three primary goals: first, to help our teams understand the capabilities and limitations of AI tools; second, to foster collaboration between human and AI systems; and third, to address concerns employees may have about job security or role changes due to automation. It's tailored to be interactive and solution-focused.\n\nRitika Chowdhury: Speaking of concerns, I’ve heard some chatter about the upcoming layoffs. Will the workshop address how AI is influencing those decisions?\n\nMandla Abebe: That's a good point, Ritika. While the workshop isn't focused on layoffs specifically, it will discuss how AI is reshaping roles and skill requirements. We want to ensure transparency and equip everyone with the tools they need to thrive. Jacqueline, do you want to add anything?\n\nJacqueline Dubois: Absolutely. While layoffs are a sensitive topic, the long-term goal is to upskill employees so they can transition into new opportunities within the company. The workshop will emphasize reskilling pathways and identify areas where AI creates new positions rather than eliminating them.\n\nNeha Khatri: Sorry to interrupt, but can I ask something? How are we supposed to balance this workshop with the additional workload stemming from the SaaS product rollout issues? My team’s already stretched thin.\n\nMandla Abebe: That’s a valid concern, Neha. The workshop is mandatory, but we’re working with department leads to ensure it doesn’t conflict with critical deadlines. If your team is facing immediate challenges, let me know, and we’ll figure out a schedule that works.\n\nAmina Mustafa: I think it’s important to acknowledge that not everyone is onboard with these changes. There’s a lot of skepticism about AI replacing people, and that tension has been palpable since the product meeting yesterday.\n\nJacqueline Dubois: You’re right, Amina. The workshop will include a segment for open dialogue to address these fears. We want to create a safe space for employees to express their concerns and get clear answers.\n\nRitika Chowdhury: Speaking of open dialogue, I hope the workshop doesn’t end up being overly scripted. People need genuine conversations, not just slides and rehearsed speeches.\n\nMandla Abebe: That’s a fair point, Ritika. We’ll keep that in mind when finalizing the format. The goal is engagement, not just information delivery.\n\nNeha Khatri: One last thing—how will success be measured? Are there follow-up activities or surveys planned?\n\nJacqueline Dubois: Good question. We’re planning to send out surveys after the workshop to gather feedback. There will also be a follow-up session two weeks later for teams to share how they’re applying what they learned.\n\nMandla Abebe: Perfect. Thank you, Jacqueline. Before we wrap up, does anyone have additional questions or concerns?\n\nAmina Mustafa: None from me, but I think it would be helpful to send an email with the key points discussed today. Not everyone might remember everything.\n\nMandla Abebe: Great suggestion, Amina. I’ll send out a summary by the end of the day. If anyone comes up with questions later, feel free to reach out. Thanks, everyone, for your input. Let’s adjourn here. Have a productive rest of your day.\n\nNeha Khatri: Thanks, Mandla. Bye, everyone.\n\nAmina Mustafa: Bye!\n\nRitika Chowdhury: Take care.\n\nJacqueline Dubois: Talk soon!"

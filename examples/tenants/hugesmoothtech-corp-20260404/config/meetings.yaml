  title: SDE Layoff Timeline Discussion
  transcript: "Amélie Dubois: Hi everyone, let’s go ahead and get started. Thanks for joining on such short notice. I know it’s been a tough week for everyone.\n\nTakeshi Sato: Yeah, definitely. Can you all hear me okay? I’ve been having some connection issues today.\n\nMariana Garcia: Loud and clear, Takeshi.\n\nJamal Hassan: Same here. All good.\n\nAmélie Dubois: Great. So, as you’ve all seen, the internal memo went out yesterday outlining the timeline for the next phase of SDE layoffs. I wanted us to come together to discuss concerns and make sure we’re aligned on how to approach this with the remaining team. Let’s also talk about how we’ll manage the workload moving forward. Lina, are you here?\n\nLina Johansson: Yep, I’m here. Sorry, was just on mute.\n\nAmélie Dubois: No problem. So, let’s dive in. First, I want to acknowledge that this is a really challenging time for everyone—both for those who are leaving and for those who are staying. Transparency is going to be key here. Thoughts on the timeline outlined in the memo? Do we think it’s realistic?\n\nMariana Garcia: Honestly, I feel like it’s a bit rushed. We’re looking at, what, two weeks before the next wave? That’s not a lot of time for knowledge transfer or transition planning. Teams are already stretched thin as it is.\n\nTakeshi Sato: Agreed. And with the new AI update that just rolled out, we’re still dealing with the fallout from client issues. If we lose more SDEs without a solid transition plan, it’s going to be chaos.\n\nJamal Hassan: Not to mention the morale hit. People are already on edge. I’ve had engineers reach out to me directly, asking if they’re next. It’s hard to keep them focused when they’re worried about their jobs.\n\nAmélie Dubois: Right. I’m hearing the same concerns. Lina, from an HR perspective, is there any flexibility in the timeline?\n\nLina Johansson: I’ve raised that question with leadership, but the response was pretty firm. They’re trying to align this phase with the broader restructuring goals for Q2. But I’ll push back again and see if we can buy more time.\n\nAmélie Dubois: Please do. Even an extra week could make a big difference. In the meantime, we need to focus on how we’re communicating this to the team. Mariana, any thoughts on messaging?\n\nMariana Garcia: I think we need to focus on two things: clarity and compassion. People need to know the “why” behind these decisions—what’s driving them and what the long-term vision is. At the same time, we need to acknowledge how tough this is and provide support. The mandatory workshop HR rolled out is a good start, but it’s not enough.\n\nJamal Hassan: Agreed. And we need to be proactive. Waiting for people to come to us with concerns isn’t going to cut it. Maybe we set up one-on-one check-ins with everyone on the impacted teams?\n\nTakeshi Sato: That’s a good idea, but can we realistically handle that with everything else going on? We’ve still got the SaaS rollout issues to deal with.\n\nAmélie Dubois: Good point, Takeshi. Let’s prioritize. Maybe we start with the most impacted teams and go from there. We can also enlist team leads to help with these check-ins.\n\nLina Johansson: I can draft some guidelines for those conversations—key points to hit, resources to share, that sort of thing.\n\nAmélie Dubois: Perfect. Okay, let’s shift gears for a moment. How are we handling the workload redistribution? The memo mentioned leveraging the new AI debugging tools. Takeshi, what’s your take?\n\nTakeshi Sato: The AI tools are definitely helping with debugging, but they’re not a silver bullet. There’s still a lot of manual work involved, especially with the client-reported issues. We need to be careful not to overestimate what the AI can handle.\n\nMariana Garcia: Plus, there’s a learning curve. Not everyone’s comfortable using the tools yet. We might need some additional training.\n\nAmélie Dubois: Good point. Let’s coordinate with the AI team to set up some training sessions. Jamal, can you take the lead on that?\n\nJamal Hassan: Sure, I’ll reach out to them today.\n\nAmélie Dubois: Thanks. Before we wrap up, any other concerns or ideas?\n\nLina Johansson: Just a quick one—how are we recognizing the contributions of the people who are leaving? It’s important to end things on a positive note for them and for the team.\n\nAmélie Dubois: Great point, Lina. Let’s plan for some kind of farewell event, even if it’s virtual. I’ll coordinate with you on that.\n\nMariana Garcia: One last thing—I think we should have a follow-up meeting next week to reassess where we are. Things are moving quickly, and we might need to adjust our plans.\n\nAmélie Dubois: Agreed. Let’s put that on the calendar. Okay, I think that covers everything for now. Thanks, everyone. Action items will be in the follow-up email. Hang in there, and let’s keep supporting each other.\n\nTakeshi Sato: Thanks, Amélie.\n\nMariana Garcia: Thanks, everyone.\n\nJamal Hassan: Talk soon.\n\nLina Johansson: Bye, everyone."

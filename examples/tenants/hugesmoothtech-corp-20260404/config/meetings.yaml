  title: HR Workshop Feedback Session
  transcript: "Amélie Dubois: Hi everyone, thanks for joining today’s HR Workshop Feedback Session. I know it’s been a tense few days, so I appreciate you making time for this. Can everyone hear me okay?\n\nMariana Garcia: Yes, I can hear you.\n\nRavi Patel: Same here.\n\nJamal Okonkwo: You’re coming through loud and clear.\n\nMona Sharif: Got you, Amélie.\n\nRitika Chowdhury: All good on my end.\n\nAmélie Dubois: Great. Let’s dive in. The main purpose of this meeting is to review the feedback we’ve received on the ‘Adapting to Change in AI-Driven Workplaces’ workshop and discuss adjustments moving forward. As you know, the backlash has been significant, especially given the timing with the ongoing layoff fears. Mariana, could you start by summarizing the feedback we’ve collected?\n\nMariana Garcia: Sure. So, we received over 120 responses to the post-workshop survey. The main themes were frustration about the workshop’s tone, which many employees felt was dismissive, and a lack of acknowledgment of the emotional toll layoffs are taking. A few comments directly called out the messaging as “tone-deaf” and “inappropriate.” Additionally, there were concerns that the workshop focused too heavily on adapting rather than offering real support.\n\nRavi Patel: If I can jump in here—sorry to interrupt, Mariana—this mirrors what I’ve been hearing in one-on-ones. People feel like we’re asking them to just ‘accept AI changes’ while ignoring their job security fears. It’s creating resentment.\n\nAmélie Dubois: Thanks, Ravi. That’s an important point. Jamal, you’ve been in touch with some of the engineering teams. Have you heard similar concerns?\n\nJamal Okonkwo: Absolutely. I’d say it’s even more intense there. The engineers are still reeling from the layoffs and the issues with the AI debugging tool rollout. They feel overworked and undervalued. I had one senior engineer tell me, and I quote, “Why should I adapt to AI when it’s clearly adapting us out of a job?”\n\nMona Sharif: Can I just add something? Sorry, Jamal, I know I cut you off there.\n\nJamal Okonkwo: No, go ahead, Mona.\n\nMona Sharif: Thanks. I think we also need to consider the leaked document about middle-management replacements. Even if it wasn’t supposed to be public, the damage is done. Employees are reading between the lines, and the workshop felt like a way to pacify them rather than address their real concerns.\n\nRitika Chowdhury: I agree. And honestly, the workshop content didn’t help. It felt overly optimistic, like a “rah-rah for AI” session, without acknowledging the human side of these transitions. We need to strike a better balance.\n\nAmélie Dubois: Good points, all of you. So, let’s talk solutions. What adjustments can we make to regain employee trust and ensure future workshops are more sensitive?\n\nMariana Garcia: One thing we could do is involve employees in the planning process. Maybe a focus group to co-create the content?\n\nRitika Chowdhury: I like that. And we can also include a section on emotional resilience during layoffs. Not just adapting to AI, but how to cope with uncertainty overall.\n\nJamal Okonkwo: Agreed. Also, we need leadership to be more transparent in these workshops. If layoffs are coming, people need clarity—not vague reassurances.\n\nRavi Patel: Can I play devil’s advocate for a second? If we’re too transparent, we risk causing more panic. How do we strike that balance?\n\nMona Sharif: That’s a fair point, Ravi. Maybe we can have a leadership Q&A segment where employees can ask questions anonymously. It might give them some agency without escalating fears.\n\nAmélie Dubois: I like that idea. Let’s explore how we can implement it. Before we move on, does anyone have other thoughts or suggestions?\n\n[Pause]\n\nAmélie Dubois: Okay, seems like we’re aligned on the main takeaways. Let’s summarize the action items:\n\n1. Mariana and I will coordinate a focus group with employees to co-create future workshop content.\n2. Ritika will draft a section on emotional resilience and coping strategies for uncertain times.\n3. Jamal will work with leadership to establish a Q&A segment for workshops, ensuring transparency while managing concerns.\n4. Mona and Ravi, can you both collaborate on a messaging guide to help strike the right tone in communications?\n\nRavi Patel: Sure, happy to.\n\nMona Sharif: Count me in.\n\nAmélie Dubois: Great. Anything else before we wrap up?\n\nJamal Okonkwo: Just one thing—can we set a timeline for these action items? I think employees need to see changes sooner rather than later.\n\nAmélie Dubois: Good call, Jamal. Let’s aim to implement these changes within the next two weeks. I’ll send out a detailed follow-up email with deadlines. Thanks again, everyone, for your input. Let’s stay connected on this.\n\nMariana Garcia: Thanks, Amélie. Talk soon.\n\nRavi Patel: Bye, everyone.\n\nJamal Okonkwo: See you all.\n\nMona Sharif: Bye!\n\nRitika Chowdhury: Thanks, everyone. Take care.\n\n[Meeting ends.]"

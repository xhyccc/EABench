  title: HR Strategy Session
  transcript: "Mona Sharif: Hi everyone, thanks for joining on such short notice. Let’s get started. We have two main agenda items today: the removal of the 'Adapting to AI' workshops and the internal leadership disagreements that seem to be sparking some confusion.\n\nRitika Chowdhury: Thanks, Mona. Can we start with the workshops? It’s been a bit chaotic since they disappeared from the calendar. Employees are asking questions, and I don’t have clear answers for them.\n\nKhoi Nguyen: Yeah, same here. My team keeps coming to me for clarity, and frankly, I have none to offer. Why was it pulled so suddenly?\n\nMona Sharif: Good question. First, let me clarify that the decision wasn’t taken lightly. There was a lot of feedback about the workshops being 'tone-deaf,' especially given the layoffs and the current climate. The leadership team decided it was better to pause and reassess.\n\nAmina Mustafa: (interrupting) Sorry, Mona, but 'pause and reassess' wasn’t communicated. It just disappeared. That’s what’s fueling all these rumors. People think leadership is divided or doesn’t know what it’s doing.\n\nAdanna Okonkwo: Absolutely. I’ve heard everything from 'HR is caving under pressure' to 'the CEO personally ordered this.' The lack of transparency is hurting us more than the workshop itself.\n\nMona Sharif: Fair point, Adanna. I’ll own that the communication around this could’ve been handled better. We’re here to fix that today. To be transparent, the decision was made after leadership reviewed the backlash and felt the workshops weren’t meeting their intended purpose.\n\nKhoi Nguyen: Can I just ask—was it the workshops themselves, or was it the fact that they were mandatory? Because I think the content had potential, but the timing and delivery were off.\n\nMona Sharif: It’s a mix of both. The content didn’t resonate, and the mandatory nature amplified existing tensions. But let’s table the discussion on content for now and focus on the bigger picture.\n\nRitika Chowdhury: Sorry to jump in, but I think we need to address the elephant in the room. Is this really about the workshops, or is it about leadership not being on the same page? Employees are sensing division, and it’s unsettling.\n\nAmina Mustafa: Can we be candid for a second? Because it feels like there’s a deeper issue here. The workshops are just a symptom. The real problem is that leadership seems disconnected from what employees are experiencing. The layoffs, the AI rollout, the client escalations—it’s a lot.\n\nAdanna Okonkwo: I agree. And when there’s no unified message from leadership, people fill in the gaps with their own narratives. That’s why we’re seeing memes on the intranet and rumors flying around.\n\nKhoi Nguyen: Exactly. And it’s not just the employees. Even mid-level managers are feeling out of the loop. One of my colleagues resigned last week, and she directly cited frustration with the lack of alignment at the top.\n\nMona Sharif: (sighs) I hear all of you, and I won’t deny that there have been challenges in leadership alignment. It’s something we’re actively working on. But let’s focus on actionable steps. How do we address employee concerns in the short term while we sort out the bigger issues?\n\nRitika Chowdhury: Maybe we can host a town hall or an open forum? Give employees a chance to voice their concerns directly and get real-time answers.\n\nAmina Mustafa: I like the idea of a town hall, but it can’t just be a PR exercise. We need to come prepared with honest answers, even if they’re not what people want to hear.\n\nAdanna Okonkwo: Agreed. And we need to commit to follow-ups. If we say we’ll do something, we have to actually do it. Otherwise, we’ll lose what little trust we have left.\n\nKhoi Nguyen: Also, can we revisit the idea of optional workshops? Maybe reframe them as skill-building sessions rather than 'adapting to AI.' The current title feels like it’s blaming employees for not keeping up.\n\nMona Sharif: Good idea, Khoi. Let’s take that offline and brainstorm how to reposition the workshops.\n\nAmina Mustafa: One last thing—can we please get a unified message from leadership about all this? Something that addresses the workshops, the layoffs, and the AI rollout in one go? Piecemeal updates are just adding to the confusion.\n\nMona Sharif: Absolutely. I’ll work on drafting a message with input from the leadership team. Let’s aim to get it out by the end of the week.\n\nRitika Chowdhury: Great. So just to summarize: we’ll plan a town hall, revisit the workshops as optional skill-building sessions, and draft a unified message from leadership. Anything else?\n\nKhoi Nguyen: Just one quick thing—can we align on who’s taking point on the town hall logistics?\n\nMona Sharif: Good call. Amina, can you handle that?\n\nAmina Mustafa: Sure, I’ll coordinate with the comms team and get back to everyone with a plan.\n\nMona Sharif: Perfect. Thanks, everyone. I know tensions are high, but I appreciate your input and commitment to finding solutions. Let’s regroup next week to check progress. Meeting adjourned."

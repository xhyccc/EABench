  subject: Student Wellness Support During Crisis
  body: "Dear Chloe and Afolabi,\n\nI hope this email finds you both well\u2014or\
    \ as well as can be expected given the incredibly challenging week we\u2019ve\
    \ all had. Thank you again for your continued dedication to supporting our students\
    \ during this turbulent time. I wanted to follow up on a few items we discussed\

    \ on:\n- Priority areas for upgrades (e.g., servers, networking equipment, storage\
    \ infrastructure).\n- Estimated costs for the most urgent replacements.\n- Any\
    \ recent data or metrics that illustrate the impact of these outages (e.g., complaints\
    \ logged, downtime hours, etc.)?\n\nAlso, Omar, could you double-check the hardware\
    \ inventory we reviewed last month? I just want to confirm we\u2019re working\
    \ with the most up-to-date list.\n\nLet me know your availability for a meeting\
    \ next week\u2014preferably Monday or Tuesday afternoon. If there\u2019s anything\
    \ you think we should address ahead of time, feel free to reply here or shoot\
    \ me a message.\n\nThanks for your help with this. I know it\u2019s been a tough\
    \ few weeks for everyone, but I\u2019m confident we can come up with a solid plan.\n\
    \nBest,\nWei\n\nSent from my iPhone (apologies for any typos!)"

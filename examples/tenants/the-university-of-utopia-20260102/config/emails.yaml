  subject: Emergency Town Hall Meeting Announcement
  body: "Dear Students, Faculty, and Staff,\n\nI hope this message finds you well\
    \ despite the ongoing challenges we are all facing as a community. I am writing\
    \ to formally announce an **emergency town hall meeting** scheduled for later\
    \ this week. This meeting will serve as an opportunity to address the growing\
    \ concerns and questions that many of you have shared with us over the past few\
    \ weeks.\n\nThe details of the meeting are as follows:\n- **Date:** Friday, December\
    \ 19, 2025\n- **Time:** 4:00 PM\n- **Location:** Main Auditorium (overflow seating\
    \ will be available in Lecture Halls A & B, with a live stream for those unable\
    \ to attend in person)\n\nAs many of you are aware, the university is navigating\
    \ an extraordinarily difficult period. Over the past few weeks, we have seen escalating\
    \ tensions due to the proposed tuition hike, potential faculty layoffs, department\
    \ mergers, and various infrastructure challenges. These issues have understandably\
    \ caused significant frustration and uncertainty within our community, and it\
    \ is critical that we come together to address them transparently and collaboratively.\n\
    \nDuring this meeting, the newly appointed chancellor will provide updates on\
    \ the financial restructuring plan currently under review and will outline the\
    \ steps we are taking to ensure the university\u2019s long-term viability. Additionally,\
    \ we will allocate time for an open Q&A session so that your voices can be heard\
    \ directly. I strongly encourage everyone to participate, either by attending\
    \ in person or submitting questions in advance via the online portal (please note:\
    \ the IT team is working on stabilizing the portal, but it should be operational\
    \ by tomorrow morning).\n\nWe recognize that communication from the administration\
    \ has fallen short in recent months, and for that, I deeply apologize. The leaked\
    \ memos, rumors, and media reports have created an environment of distrust, and\
    \ I want to assure you that restoring transparency and rebuilding trust are among\
    \ our top priorities. This town hall is a step in that direction.\n\nI understand\
    \ that many of you might still have questions or feel skeptical about the administration's\
    \ plans. I encourage you to share your thoughts openly during the meeting. If\
    \ you cannot attend, please feel free to email your concerns to the chancellor\u2019\
    s office directly at chancellor@universityname.edu.\n\nFinally, I am aware of\
    \ the ongoing disruptions caused by the IT system failures, including today's\
    \ Wi-Fi outage and the issues with the email server earlier this week. The IT\
    \ department is working around the clock to resolve these problems and will provide\
    \ a full update during the town hall as well.\n\nThank you for your patience,\
    \ resilience, and commitment to this university. I know these are difficult times,\
    \ but I believe that together, we can find a path forward. \n\nPlease mark your\
    \ calendars and encourage your peers to attend. Your participation is critical\
    \ to shaping the future of our institution.\n\nWarm regards,\n\nSarah Nguyen \
    \ \nPresident & CEO  \n[Sent from my iPhone \u2013 apologies for any typos!]\n"

    \ and we need to assess both the financial and reputational implications carefully\
    \ before taking any positions.\n\nFrom a financial standpoint, outsourcing could\
    \ potentially help us address some short-term budget gaps, especially since maintenance\
    \ costs have been flagged as one of the areas where we\u2019re significantly over\
    \ budget. However, I\u2019m concerned about whether this could end up being a\
    \ false economy\u2014are we actually going to save enough to justify the transition\
    \ costs and potential disruption? If either of you has access to more detailed\
    \ figures from Facilities or Operations, could you share those? I want to make\
    \ sure our cost analysis is solid before we bring anything forward.\n\nReputation-wise,\
    \ this could be a real powder keg. With everything else going on\u2014the protests,\
    \ the sit-in, the leaked budget report\u2014adding more fuel to the fire might\
    \ not be advisable. We\u2019ve seen how staff and students have reacted to previous\
    \ outsourcing rumors, and there\u2019s a risk this could be perceived as another\
    \ example of leadership ignoring campus voices. Do you think we need to consult\
    \ with HR or Communications to gauge the potential fallout, or should we wait\
    \ until there\u2019s an official proposal?\n\nAlso, can we double-check whether\
    \ this leak is accurate? I\u2019m not sure if it\u2019s a finalized plan or just\
    \ one of many ideas being floated. If it\u2019s the latter, we may need to clarify\
    \ that internally before rumors spiral further.\n\nLet\u2019s try to coordinate\
    \ a time to discuss this in more detail. I know everyone\u2019s schedules are\
    \ chaotic right now, but maybe we can squeeze in a quick call tomorrow or Friday\
    \ morning? Katherine, I think you mentioned being tied up with IT on the grading\

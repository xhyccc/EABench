    \ challenges we\u2019ve been facing and further disrupt operations across campus.\n\
    \nTo give you a quick overview, the vulnerability stems from outdated software\
    \ across several critical systems, including server management and library access.\
    \ The IT team is warning that without immediate funding allocation for upgrades\
    \ and patches, we\u2019re at risk of losing functionality altogether. As you all\
    \ know, this would mean halting research, online coursework, grading, and many\
    \ other essential services\u2014something we absolutely cannot afford right now.\n\
    \nWe\u2019ve already seen partial outages this week that delayed final grade submissions\
    \ and disrupted library systems. If this escalates to a full crash, the repercussions\
    \ could be catastrophic, especially considering the ongoing protests and financial\
    \ unrest. Honestly, I\u2019m surprised this hasn\u2019t been flagged sooner, but\
    \ we\u2019re here now, and we need to act fast.\n\nI wanted to loop you three\
    \ in specifically because of your roles in coordinating departmental needs and\
    \ budget discussions. Alejandro, I know you\u2019ve been working on alternative\
    \ funding options with the alumni coalition\u2014can we explore whether any of\
    \ those pledged donations might be redirected toward IT infrastructure in light\
    \ of this emergency? Priya, you mentioned in our last meeting that the finance\
    \ department was reviewing discretionary funds\u2014can you check if there\u2019\
    s anything available that we can allocate here? And Sarah, I know this wasn\u2019\
    t on the agenda for the emergency press briefing tonight, but do you think we\
    \ should address this vulnerability publicly to avoid backlash later?\n\nPlease\
    \ let me know if you need more details from IT or have any questions\u2014I\u2019\
    ve attached their original memo for reference. Time is of the essence here, so\
    \ I\u2019d appreciate it if we could meet briefly this afternoon to finalize a\
    \ plan. Let me know when you\u2019re free.\n\nThanks for your help on this. Sorry\
    \ for the rushed email\u2014just trying to keep things moving.\n\nBest,\nOmar\n\
    \nSent from my iPhone"

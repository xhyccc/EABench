  subject: Faculty Concerns Regarding Department Mergers
  body: "Subject: Faculty Concerns Regarding Department Mergers\n\nHi Devika, Meera,\
    \ and Lila,\n\nI hope this email finds you well, though I know the past week has\
    \ been quite intense for all of us. I wanted to follow up on the faculty concerns\
    \ surrounding the proposed department mergers, which we\u2019ve seen escalate\
    \ significantly over the last few days. Between the open letters, the union's\
    \ involvement, and the general unrest, it\u2019s clear we need to address this\
    \ head-on\u2014and quickly.\n\nFirst, thank you all for your input during our\
    \ last meeting. It\u2019s clear that while budget constraints are pushing us to\
    \ consider difficult options, we need to ensure we\u2019re taking a collaborative\
    \ and transparent approach with faculty. The leaked draft budget and subsequent\
    \ backlash have only made this more urgent. I\u2019m particularly concerned about\
    \ the growing perception that decisions are being made behind closed doors.\n\n\
    To that end, I\u2019d like us to draft a formal response to the faculty\u2019\
    s concerns. Could we pull together a bullet-point summary of their main arguments\
    \ from the open letter and other feedback we\u2019ve received? I\u2019m sure you\u2019\
    ve all seen the letter circulating, but if not, I can forward it to you. Let\u2019\
    s aim to address their points directly and acknowledge their frustrations while\
    \ reiterating the financial realities we\u2019re facing. \n\nAdditionally, I think\
    \ it might be worth exploring alternative solutions to the mergers. I know the\
    \ faculty proposed increasing grant applications in their alternative budget plan\u2014\
    can we dig into that a bit more? Do we have data on our current grant success\
    \ rates or capacity to scale up? Also, could we revisit whether external partnerships\
    \ or alumni funding (beyond the recent $50k donation) could help offset costs?\
    \ It might be worth re-engaging with the alumni association\u2014they\u2019ve\
    \ been vocal lately, and aligning with them could help rebuild trust.\n\nLastly,\
    \ I\u2019m wondering if it\u2019s time to organize a joint town hall with both\
    \ faculty and students. It\u2019s ambitious, but it could go a long way in showing\
    \ that we\u2019re genuinely listening. Thoughts on this? \n\nLet me know your\
    \ availability for a quick sync tomorrow to finalize next steps. We\u2019ll need\
    \ to get something out to the faculty no later than end of the week.\n\nThanks\
    \ as always, and please flag anything I might\u2019ve missed here. (Also, Devika,\
    \ can you double-check if the finance team is ready to share updated projections\
    \ post-review?)\n\nBest,\nEmily\n\nSent from my iPhone"

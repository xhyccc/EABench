    \ don\u2019t act quickly, I fear the situation could spiral further\u2014especially\
    \ with the petition calling for the interim chancellor\u2019s resignation gaining\
    \ so much traction. We may need to consider involving the trustees sooner rather\
    \ than later, depending on how things progress.\n\nLet me know your thoughts on\
    \ this ASAP. Please flag anything I may have missed here or if there\u2019s something\
    \ we should elevate to the chancellor directly. \n\nThanks, everyone, and apologies\
    \ if this feels rushed\u2014I\u2019m sending this from my phone while juggling\
    \ other tasks, so please excuse any typos.\n\nBest regards,\nAlejandro Rodriguez\n\

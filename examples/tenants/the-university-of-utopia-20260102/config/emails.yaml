    \ IT outages, and faculty-student tensions running so high. I\u2019ve been hearing\
    \ from colleagues and students all day, and the general mood is one of frustration\
    \ and, frankly, disbelief.\n\nThe most alarming part, as you\u2019ve probably\
    \ seen, is the proposed elimination of the three academic programs. I can\u2019\
    t imagine how we\u2019re going to address this without a clearer public statement\
    \ from the administration. The silence so far is only fueling speculation and\
    \ distrust, and I think we need to figure out how to respond as a faculty.\n\n\
    Do either of you have a sense of whether the interim chancellor plans to address\
    \ this directly? If not, should we consider drafting a joint faculty statement?\
    \ I know we\u2019ve talked about the importance of staying unified in these situations,\
    \ but emotions are running so high that I\u2019m worried about the potential fallout\
    \ if we don\u2019t say *something* soon. \n\nAlso, do we know if there\u2019s\
    \ an official timeline for when the administration plans to release the actual\
    \ finalized budget? This leaked draft is already being treated as fact, and I\u2019\
    ve had to field questions from students about whether their scholarships or programs\
    \ are safe\u2014questions I don\u2019t have answers to. It\u2019s incredibly demoralizing\
    \ for everyone involved.\n\nOn a related note, I was encouraged to see the alumni\
    \ coalition\u2019s fundraising progress. $200K raised already is no small feat,\
    \ and I wonder if there\u2019s a way to amplify their efforts to show that there\
    \ are people out there who still believe in this institution despite everything.\
    \ Maybe we can brainstorm ideas for that in our next department meeting? I feel\
    \ like we need all the goodwill we can get right now.\n\nLet me know your thoughts\u2014\
    especially if you\u2019ve heard anything I haven\u2019t. I\u2019ll try to keep\
    \ an eye on my inbox, but honestly, it\u2019s been hard to keep up with all the\
    \ messages flying around today.\n\nTake care,\nDevika\n\nSent from my iPhone"

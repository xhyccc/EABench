    \ those systems once repairs are underway. Please share these details by tomorrow\
    \ afternoon if possible\u2014I\u2019m aiming to consolidate everything into a\
    \ report for leadership by EOD tomorrow. \n\nSeparately, I know tensions are running\
    \ high across campus right now with everything else going on (budget protests,\
    \ leadership transitions, etc.), so I\u2019m doing my best to keep communication\
    \ lines open and transparent. If you hear concerns from your teams or need clarification\

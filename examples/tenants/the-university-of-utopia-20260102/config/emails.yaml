  subject: Leaked Budget Report and Implications for Academic Programs
  body: "Hi Emily and Meera,\n\nI hope you\u2019re both doing okay\u2014what a chaotic\
    \ week this has been. I wanted to touch base regarding the leaked draft budget\
    \ report that\u2019s been making the rounds on social media since yesterday. The\

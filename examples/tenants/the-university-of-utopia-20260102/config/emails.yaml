  subject: Drafting an Open Letter on Department Merger Concerns
  body: "Hi Devika and Meera,\n\nHope you\u2019re both doing well (or at least surviving\
    \ this whirlwind of a week). I wanted to touch base about the draft for the open\
    \ letter addressing the concerns around the proposed department mergers and the\
    \ charter clause discovery. There\u2019s a lot to unpack here, and I think we\
    \ need to tread carefully given the current climate.\n\nFirst, I think the tone\
    \ needs to be empathetic but also firm in acknowledging the complexities of the\
    \ situation. We need to show that we\u2019re listening to faculty and students\
    \ without making promises we can\u2019t realistically deliver on. The discovery\
    \ of the charter clause complicates things even further\u2014we\u2019ll need to\
    \ address it directly, but I\u2019m not entirely sure how much detail we should\
    \ include at this stage. Thoughts?\n\nSecond, I wanted to get your input on whether\
    \ we should reference the ongoing protests and petitions (e.g., the 10,000-signature\
    \ petition calling for the interim chancellor\u2019s resignation). My gut says\
    \ we acknowledge the unrest without outright validating the calls for leadership\
    \ changes\u2014that\u2019s a minefield we don\u2019t want to step into unless\
    \ absolutely necessary. But I\u2019m open to hearing your perspectives on this.\n\
    \nAlso, do we have the most recent data from the finance department on the budget\
    \ implications of the mergers? If we\u2019re going to justify them, we should\
    \ have concrete numbers ready to share\u2014or at least a ballpark figure. I know\
    \ there was some back-and-forth about discrepancies in the last report, so let\u2019\
    s double-check that before we finalize anything.\n\nFinally, I think we need to\
    \ emphasize that any decisions we make will prioritize academic integrity and\
    \ the long-term health of the university. That\u2019s been a recurring theme in\
    \ the faculty committee\u2019s feedback, and it might help us regain a bit of\
    \ trust if we frame the mergers as part of a larger plan for stability.\n\nLet\
    \ me know if you\u2019d like to set up a quick call to brainstorm further. I think\
    \ we\u2019re going to need all hands on deck to get this letter right\u2014especially\
    \ with the alumni coalition and media breathing down our necks.\n\nThanks, and\
    \ apologies for sending this on short notice. Appreciate your thoughts when you\
    \ have a chance.\n\nBest, \nEmily\n\nSent from my iPhone"

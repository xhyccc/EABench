  subject: Response to Chancellor's Statement on Transformative Solutions
  body: "Hi Priya, Emily, Omar,\n\nI hope you're all doing well despite the constant\
    \ whirlwind we've been navigating lately. As you\u2019ve probably seen, the chancellor\u2019\
    s recent statement on 'transformative solutions' has sparked more skepticism than\

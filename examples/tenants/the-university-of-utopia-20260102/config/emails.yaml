  subject: Power Outage Update and IT Support
  body: "Hi Alejandro, Samuel, and Mariam,\n\nI hope this message finds you well,\
    \ despite the challenges we\u2019re currently navigating. I wanted to share an\
    \ update regarding the power outage that has impacted several campus buildings,\
    \ including the administration office, as well as outline the IT department\u2019\
    s response plan.\n\nFirst and foremost, the outage is affecting both physical\
    \ systems and some of our critical IT infrastructure. As you know, this comes\
    \ on the heels of the recent server outage that has already caused disruptions\
    \ to online grading systems. The timing couldn\u2019t be worse, but we\u2019re\
    \ working around the clock to resolve these issues as quickly as possible. Our\
    \ team has assessed the situation and determined that the power outage is tied\
    \ to aging electrical equipment in Building C\u2014a problem flagged during previous\
    \ maintenance reviews but deferred due to budget constraints. Unfortunately, this\
    \ means the resolution timeline is somewhat dependent on external contractors.\
    \ We\u2019re estimating at least 72 hours for full restoration, but I\u2019ll\
    \ keep you updated as we learn more.\n\nIn the meantime, we\u2019re focusing on\
    \ minimizing operational disruptions. IT staff have deployed backup servers to\
    \ ensure that essential grading and administrative tasks can continue, though\
    \ there may be sporadic delays. I\u2019ll need all departments to double-check\
    \ whether their systems are functioning properly and report any lingering issues\
    \ ASAP. Alejandro, can you confirm if the shared drives for the admin office are\
    \ accessible? Samuel, can you check with the faculty in your building to see if\
    \ they\u2019re able to access grading portals? Mariam, I believe your team was\
    \ scheduled for an update meeting about campus Wi-Fi upgrades\u2014can you let\
    \ me know if that\u2019s been affected too?\n\nLastly, I realize this situation\
    \ is exacerbating frustrations, especially amidst the broader budget crisis and\
    \ ongoing protests. I\u2019ve already heard concerns from faculty about how this\
    \ outage might impact grade submissions and the upcoming holiday break. Please\
    \ feel free to share any feedback or suggestions from your teams, and I\u2019\
    ll do my best to address them in our next IT briefing.\n\nThank you all for your\
    \ patience and support as we navigate this. Let\u2019s touch base during tomorrow\u2019\
    s call to discuss next steps and any updates.\n\nBest,\nOmar\n\nSent from my iPhone"

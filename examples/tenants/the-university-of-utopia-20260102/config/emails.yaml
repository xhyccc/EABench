    \ events\u2014including the sit-ins, protests, and increased social media activity\u2014\
    that many students are feeling understandably anxious about the proposed tuition\
    \ hikes and potential impacts on their education. To that end, I\u2019d like your\
    \ input on how we can better communicate the counseling and wellness resources\
    \ available to them. I know we\u2019ve briefly touched on this in past conversations,\
    \ but I think we need to make these resources more visible and accessible. Would\
    \ it make sense to coordinate with the Wellness Center to organize a drop-in session\
    \ or perhaps host a virtual Q&A? Let me know your thoughts.\n\nIn addition, I\

  subject: Leaked Emails and IT Infrastructure Risk
  body: "Subject: Leaked Emails and IT Infrastructure Risk\n\nHi Dev, Javier, and\
    \ Yash,\n\nI wanted to touch base with you urgently regarding the recent leak\
    \ of internal emails and the spotlight it\u2019s placed on our IT infrastructure\
    \ challenges. As you\u2019ve probably seen, the leaked communications paint a\
    \ troubling picture of our longstanding issues and the risks we\u2019ve been flagging\
    \ for years. This situation is quickly becoming a major reputational concern,\
    \ especially given the media's growing interest.\n\nFirst, we need to get a handle\
    \ on the scope of this leak. Can we confirm exactly what was accessed and if there\
    \ are any other vulnerabilities we need to address immediately? Yash, could you\
    \ double-check the audit logs from the last 72 hours to see if there\u2019s any\
    \ unusual activity we might have missed?\n\nSecond, we need to align on the internal\
    \ investigation. I know we\u2019ve discussed this briefly, but let\u2019s formalize\
    \ a plan. Javier, could you draft a timeline for the investigation and identify\
    \ any additional resources we might need? It\u2019s critical that we\u2019re thorough\
    \ but also quick to act, especially with the ongoing unrest on campus.\n\nThird\u2014\
    and this is the bigger, more systemic issue\u2014we need to address the IT infrastructure\
    \ problems that have been a ticking time bomb for years. Dev, I know you\u2019\
    ve been vocal about the outdated hardware and stretched resources in our previous\

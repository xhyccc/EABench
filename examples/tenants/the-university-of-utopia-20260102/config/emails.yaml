  subject: Faculty Concerns Over Leadership and Budget Management
  body: "Dear Emily, Alejandro, and Meera,\n\nI hope this email finds you well, though\
    \ I know it\u2019s been an incredibly turbulent time for all of us at the university.\
    \ I wanted to follow up on some of the faculty concerns we discussed earlier this\
    \ week. I\u2019m sure you\u2019ve also seen the anonymously leaked letter from\
    \ the board of trustees that\u2019s been circulating\u2014if not, let me know,\
    \ and I can forward it to you. It\u2019s certainly added fuel to the fire.\n\n\
    The lack of clarity and transparency from leadership, particularly around the\
    \ budget crisis and now the proposed department mergers, is deeply frustrating.\
    \ Many of us feel like we\u2019re being kept in the dark while decisions that\
    \ will profoundly impact our teaching, research, and even job security are being\
    \ made behind closed doors. The interim chancellor\u2019s delay in releasing the\
    \ financial recovery plan is just the latest example of this ongoing lack of communication,\
    \ and I\u2019m hearing more and more faculty voicing their doubts about whether\
    \ we can trust the current administration to lead us through this crisis.\n\n\
    I know we\u2019ve talked before about the need for better faculty engagement in\
    \ these decisions, but I\u2019m wondering if there\u2019s a way to escalate this\
    \ conversation. Could we propose some kind of joint faculty-administration task\
    \ force to address the budget and leadership concerns? I realize that\u2019s a\
    \ big ask, but the current situation is unsustainable, and I think we need to\
    \ push for something more formal and binding than the chancellor\u2019s vague\
    \ promises of town halls and listening sessions.\n\nAlso, Meera, in our last meeting,\
    \ you mentioned you were looking into the legal implications of the department\
    \ merger proposals. Have you had a chance to dig into that clause in the university\
    \ charter that\u2019s been circulating online? If it\u2019s accurate, it could\
    \ seriously complicate those plans, and I think it\u2019s worth flagging sooner\
    \ rather than later.\n\nEmily, I know you\u2019ve been in touch with some of the\
    \ alumni coalition members\u2014do you think they\u2019d be willing to make a\
    \ public statement supporting faculty concerns, or is their focus strictly on\
    \ scholarships and fundraising? Their leverage with the administration seems to\
    \ be growing, and it might help to have their voices backing us up.\n\nLastly,\
    \ on a more immediate note, I\u2019m hearing from colleagues in my department\
    \ that the ongoing IT issues are causing chaos with final grade submissions and\
    \ research deadlines. If either of you has more insight into what\u2019s going\
    \ on there\u2014or how we can help advocate for the IT department to get the resources\
    \ they clearly need\u2014please let me know.\n\nSorry for the long email (and\
    \ the slightly scattered thoughts\u2014I\u2019m still sorting through all of this\
    \ myself), but I really value your perspectives and wanted to get your thoughts\
    \ on how we can move forward. Let\u2019s touch base soon\u2014maybe we can set\
    \ up another meeting early next week?\n\nWarm regards,\n\nDevika\n\nSent from\
    \ my iPhone"

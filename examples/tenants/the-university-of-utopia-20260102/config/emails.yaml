  subject: Review of University Bookstore Pricing Practices
  body: "Subject: Review of University Bookstore Pricing Practices  \n\nHi Lina, Elena,\
    \ and Amara,  \n\nI hope you're all doing well and managing to navigate the chaos\
    \ this week\u2014what a time to be here, huh? I\u2019m writing to flag an issue\
    \ that\u2019s been bubbling up over the last few days (as if we needed more on\
    \ our plates). We\u2019ve been receiving an increasing number of student complaints\
    \ about the bookstore selling outdated textbooks at full price. This popped up\
    \ again in yesterday\u2019s sit-in, and it\u2019s gaining traction on social media\u2014\
    definitely not the kind of attention we need right now.   \n\nCan we prioritize\
    \ a review of the bookstore's pricing policies ASAP? I know this might seem minor\
    \ compared to the broader financial challenges we\u2019re juggling, but it could\
    \ help show students that we\u2019re listening and taking action where we can.\
    \ I\u2019d like us to focus on understanding why this is happening and what options\
    \ we have to address it quickly. Are there outdated processes in place, or is\
    \ this something tied to the vendor contracts? Do we have any levers we can pull\
    \ without incurring additional costs?   \n\nElena, I\u2019m pretty sure you\u2019\
    ve worked on bookstore-related issues in the past\u2014can you loop me in on any\
    \ relevant insights or data we have? And Amara, could you double-check the vendor\
    \ agreements when you have a moment? I know this might mean digging into older\
    \ files, but it\u2019d be helpful to know if there\u2019s anything in the contracts\
    \ that we need to flag.   \n\nAlso, Lina, you mentioned at last week\u2019s meeting\
    \ that a few departments had been raising concerns about their textbook lists\
    \ not being updated in time. Could this be related? If it is, maybe we can work\
    \ with those departments to figure out a better process for keeping materials\
    \ current.   \n\nLet\u2019s aim to regroup on this with some initial findings\
    \ by the end of next week\u2014though sooner would be great if possible. And if\
    \ there\u2019s anything you need from my end to move this along, let me know.\
    \   \n\nThanks for helping to tackle this (and everything else) during what feels\
    \ like an endless storm. Appreciate you all.  \n\nBest,  \nMariam  \n\nSent from\
    \ my iPhone"

  subject: Follow-up on Chancellor's Financial Recovery Plan
  body: "Hi Priya, Emily, Omar, and Alejandro,\n\nHappy New Year\u2014I hope you all\
    \ had a chance to recharge over the break, though I know the past few weeks have\
    \ been anything but restful for most of us. I wanted to follow up on our earlier\
    \ discussions regarding the new chancellor's financial recovery plan, especially\
    \ given the press conference on January 1st and the growing anticipation for their\
    \ detailed proposal.\n\nFirst, it\u2019s clear that there are still a lot of unanswered\
    \ questions about how this plan will impact tuition hikes, department mergers,\
    \ and broader budget allocations. While the chancellor has promised more specifics\
    \ in the next two weeks, I think we need to prepare for a range of scenarios,\
    \ particularly given the tensions across campus. The 'Wall of Demands' and the\
    \ teach-in event yesterday underscore the urgency of addressing these concerns\
    \ transparently and collaboratively. Do we have updated estimates on the potential\
    \ financial impact of delaying department mergers, as proposed in the faculty\
    \ petition? If not, can we prioritize getting those figures together this week?\n\
    \nAlso, Omar, can you confirm whether IT has stabilized the server issues after\
    \ the emergency patch? It\u2019s critical that we\u2019re not blindsided by another\
    \ infrastructure failure while all eyes are on us. Emily, let\u2019s also revisit\
    \ the communications strategy for the next two weeks. The alumni coalition and\
    \ crowdfunding campaigns are gaining momentum, but their conditional pledges for\
    \ transparency measures could pose a risk if we don\u2019t deliver on this front.\
    \ Do you think we should preemptively share a roadmap for implementing those measures,\
    \ or is it better to wait until the chancellor releases their plan?\n\nAlejandro,\
    \ I know you\u2019ve been following the graduate students\u2019 efforts closely\u2014\
    can you help us coordinate with them to ensure their crowdfunding campaign aligns\
    \ with our broader fundraising goals? Their messaging is resonating, and it might\
    \ be an opportunity to bring them into the fold rather than risking conflicting\
    \ narratives.\n\nFinally, let\u2019s schedule a quick sync-up later this week\
    \ to regroup once we have more clarity on all these fronts. How does Thursday\
    \ afternoon work for everyone? Let me know if another time is better.\n\nThanks,\
    \ and I appreciate all of you navigating this challenging time with such dedication.\
    \ Please don\u2019t hesitate to flag anything else that needs our immediate attention.\n\
    \nBest,\nSarah\n\nSent from my iPhone"

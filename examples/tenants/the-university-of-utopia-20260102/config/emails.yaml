    \ not good for us\u2014it's clear we need to act immediately before things escalate\
    \ further.\n\nThe demands listed on the wall include tuition freezes, transparency\
    \ in the budget, halting department mergers, and addressing IT infrastructure\
    \ failures (among other issues). While some of these are already being discussed\
    \ internally, others will require a more cohesive response, especially given the\
    \ mounting pressure from faculty, alumni, and media outlets. \n\nWe need to prioritize\
    \ next steps. Can we get clarity on the following points?\n\n1. **Budget Transparency\
    \ Plan**: Alejandro, I know we\u2019ve been revising this\u2014how close are we\

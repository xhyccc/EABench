    \ and prevention systems (IDPS), which we\u2019ve discussed in prior budget meetings\
    \ but deferred due to resource constraints.\n- Accelerating the planned server\
    \ upgrades to mitigate these vulnerabilities.\n- Engaging an external cybersecurity\
    \ firm to assist with a forensic investigation and to ensure no sensitive data\

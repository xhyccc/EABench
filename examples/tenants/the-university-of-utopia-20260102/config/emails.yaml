  subject: 'Urgent: Library Database Network Outage'
  body: "Dear Alejandro, Sarah, and Maria,\n\nI hope this email finds you well, though\
    \ I realize it\u2019s likely been a stressful week for everyone. I wanted to provide\
    \ you with an urgent update regarding the ongoing network outage that has impacted\
    \ the library database systems. As you\u2019re aware, this issue surfaced earlier\
    \ today (12/14), and unfortunately, it\u2019s proving to be more complex than\
    \ we initially anticipated.\n\nHere\u2019s what we know so far:\n\n1. **Root Cause**:\
    \ The outage appears to be linked to the same underlying hardware issues we\u2019\
    ve flagged in previous IT reports. Specifically, the outdated servers in the data\
    \ center are becoming increasingly unstable under heavier loads (likely exacerbated\
    \ by students accessing resources for finals). We\u2019re also investigating a\
    \ possible configuration error that may have compounded the issue.\n\n2. **Current\
    \ Status**: As of now, the library database systems remain offline. Our team has\
    \ been working non-stop to identify a workaround while we prepare for a permanent\

  subject: Post-Mortem Report on Email System Blackout
  body: "Hi Omar, Dev, and Yash,\n\nAs discussed earlier, I\u2019d like to compile\
    \ a detailed post-mortem report on the email system blackout that occurred on\
    \ December 15th. This incident had a significant impact on campus communications,\
    \ especially during a period where tensions are already running high due to the\
    \ financial crisis. It\u2019s critical that we analyze the root causes and outline\
    \ actionable steps to prevent this from happening again.\n\nFrom what we know\
    \ so far, the blackout appears to have stemmed from vulnerabilities in our outdated\
    \ email system. This aligns with the issues we flagged during our infrastructure\
    \ risk assessment earlier this semester. However, I\u2019d like to confirm a few\
    \ details:\n\n1. **Timeline of Events**: Can we get a precise breakdown of when\
    \ the email system began failing? I believe the initial reports started trickling\
    \ in around 10 AM, but let\u2019s double-check if that\u2019s accurate.\n\n2.\
    \ **Impact Scope**: Aside from campus-wide email disruptions, were any other systems\
    \ affected? I know the library database had issues earlier that week, so we should\
    \ be clear on whether there was any overlap here.\n\n3. **Root Cause**: The vulnerability\
    \ we discovered on December 13th\u2014do we have a full diagnosis on how that\
    \ escalated to a full system blackout two days later? Was there any delay in patching\
    \ or mitigating that vulnerability?\n\n4. **Temporary Fixes**: What measures did\
    \ we put in place to restore functionality? I\u2019d like to make sure we document\
    \ the repair timeline and any risks associated with the temporary fixes.\n\nIn\
    \ terms of recommendations to include in the report, I\u2019m thinking we should\
    \ prioritize:\n- Accelerating the procurement process for the server upgrades\
    \ we\u2019ve been pushing for. The cost-benefit analysis we presented last quarter\
    \ already highlighted the risks of sticking with the current setup.\n- Implementing\
    \ more rigorous system monitoring and alert protocols to catch issues earlier.\n\
    - Increasing IT staff availability during high-stress periods (e.g., finals, major\
    \ protests) when system stability is critical.\n- Conducting a campus-wide communication\
    \ drill to test contingency plans for future outages.\n\nLet me know if there\u2019\
    s anything I\u2019ve missed or if you have additional data to include. I\u2019\
    ll start drafting the report once we\u2019ve gathered all the details.\n\nAlso,\
    \ quick note\u2014could someone double-check if the chancellor\u2019s office has\
    \ made any public comments about the blackout? It might be worth referencing if\
    \ they\u2019ve acknowledged the incident in any official capacity.\n\nLooking\
    \ forward to your input. Let\u2019s aim to have a draft ready by Friday so we\
    \ can present it to leadership early next week.\n\nThanks,  \nJavier\n\nSent from\
    \ my iPhone"

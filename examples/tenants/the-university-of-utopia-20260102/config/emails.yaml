    d like to convene an emergency meeting to go over the specifics. I\u2019d also\
    \ recommend we loop in Legal, as we might need to notify affected stakeholders\
    \ depending on what the investigation uncovers.\n\nOn a related note, I want to\
    \ reiterate the IT team\u2019s ongoing warnings about the risks posed by the current\
    \ state of our infrastructure. With the additional strain on our systems from\

    \ Can we coordinate some quick communication to department heads about this?\n\
    2. We\u2019re drafting a message to students to acknowledge the delays and assure\
    \ them that no grade submissions will be penalized due to the outage. Emily, can\
    \ you take a first crack at this draft? Let me know if you need specifics.\n3.\
    \ Alejandro, could you work with IT to monitor progress and provide twice-daily\
    \ updates? Transparency is key here, especially given the current environment\

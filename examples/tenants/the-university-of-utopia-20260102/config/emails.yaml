  subject: Analysis of Leaked Tuition Hike Calculations
  body: "Hi Maria, Lina, and Tanveer,\n\nI hope this email finds you all well, though\
    \ I know it\u2019s been a hectic few weeks for everyone. I wanted to flag an urgent\
    \ concern regarding the discrepancies we\u2019ve identified in the leaked tuition\
    \ hike calculations. This issue was brought to light by the student-run newspaper\
    \ yesterday, and it\u2019s already causing quite a stir across campus. \n\nFrom\
    \ my initial review, it appears the proposed figures don\u2019t align with earlier\
    \ budget projections we discussed during last month\u2019s departmental meeting.\
    \ There\u2019s a significant gap between the revenue increases expected from the\
    \ tuition hike and the actual adjustments outlined in these documents. I\u2019\
    m particularly worried about how this might further erode trust in the administration\u2019\
    s handling of the budget crisis\u2014especially given the broader context of protests,\
    \ fundraising efforts, and leadership departures.\n\nCould you please take a closer\
    \ look at the leaked figures and cross-check them against our internal models?\
    \ I\u2019m attaching the leaked report for reference (see pages 3-7 for the specific\
    \ calculations in question). If you spot anything unusual or outright incorrect,\
    \ let me know ASAP. It might also be worth revisiting the assumptions we used\
    \ in our last financial projections to ensure these discrepancies aren\u2019t\
    \ stemming from outdated inputs on our side.\n\nMaria, I know you\u2019ve been\
    \ following the alumni coalition\u2019s fundraising efforts closely. Do you think\
    \ it\u2019s worth looping them in at some point to discuss how their contributions\
    \ might offset the need for such steep tuition hikes? Lina, I recall you flagged\
    \ some potential gaps in the tuition increase rationale during our last meeting\u2014\
    would love your thoughts on whether these leaked figures align with what you were\

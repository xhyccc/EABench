  subject: Faculty and Student Engagement Plan
  body: "Dear Jin and Lila,\n\nI hope this email finds you well amidst what has been\
    \ a challenging period for all of us here at the university. As you\u2019re both\
    \ aware, the financial and administrative issues we\u2019re facing have created\
    \ significant unrest among both faculty and students, and we must take proactive\
    \ steps to address these concerns before the situation escalates further.\n\n\
    After reviewing recent developments and reflecting on our conversations during\
    \ the last department head meeting, I\u2019d like to propose a Faculty and Student\
    \ Engagement Plan that aims to rebuild trust, improve communication, and foster\
    \ collaboration during this difficult time. While this plan is still in draft\
    \ form, I wanted to share some initial ideas and get your input before moving\
    \ forward.\n\n1. **Faculty Listening Sessions**: Organize small-group listening\
    \ sessions with faculty members from each department to hear their concerns directly.\
    \ This will provide an avenue for them to voice frustrations and share input on\
    \ potential solutions. If you recall, during last week\u2019s meeting, several\
    \ faculty members expressed the need for more transparency and structured dialogue.\
    \ I think this could help.\n\n2. **Student Town Halls**: We should schedule regular\
    \ student town halls that are more structured and moderated compared to the recent\

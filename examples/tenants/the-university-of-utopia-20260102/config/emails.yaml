  subject: Alternative Budget Proposal from Economics Faculty
  body: "Subject: Alternative Budget Proposal from Economics Faculty\n\nHi Sarah,\
    \ Priya, and Emily,\n\nI hope this email finds you well. I wanted to follow up\
    \ on the public forum from earlier this week, where we presented the alternative\
    \ budget plan developed by members of the economics faculty. Given the ongoing\
    \ financial challenges the university is facing, I believe this proposal could\
    \ offer a more balanced and community-centered approach compared to some of the\
    \ measures currently on the table.\n\nTo summarize the key points of the plan:\n\
    - We recommend reallocating funds from administrative overhead to preserve faculty\
    \ positions and critical academic resources. This includes a reduction in non-essential\
    \ consultancy expenses that, based on the last financial report, have been significantly\
    \ higher than average.\n- The plan includes a phased approach to modernizing IT\
    \ infrastructure to address the recurring outages, which have become both a logistical\
    \ and reputational issue. We\u2019ve outlined potential partnerships with local\
    \ tech firms to offset initial costs.\n- We propose a temporary tuition surcharge\
    \ specifically tied to infrastructure improvements, with a guarantee of transparency\
    \ on how these funds are used. This should help alleviate student concerns about\
    \ arbitrary hikes.\n- There\u2019s also a strong case for launching a more cohesive\
    \ and transparent crowdfunding initiative, building on the enthusiasm we saw during\
    \ the student-led rally. We believe this could foster greater alumni and community\
    \ involvement.\n\nThe feedback from attendees at the forum was overwhelmingly\
    \ positive, and many students and faculty members expressed their support for\
    \ this approach. Several alumni who were present even offered to help advocate\
    \ for the plan publicly. I think this could be a real opportunity to unite various\
    \ stakeholders around a common goal.\n\nThat being said, I\u2019d like to get\
    \ your thoughts on a few things:\n1. Is there any additional data or documentation\
    \ you think we should include before formally submitting this proposal to the\
    \ administration? I want to make sure we\u2019re covering all our bases.\n2. Have\
    \ you heard anything new about the emergency financial restructuring plan discussed\
    \ in the chancellor\u2019s closed-door meeting? It\u2019s been difficult to get\
    \ clear answers, and I\u2019m concerned about how it might conflict with our recommendations.\n\
    3. Do you think it would be helpful to reach out to the alumni association for\
    \ a more formal endorsement? Their recent statement shows they\u2019re clearly\
    \ frustrated with the administration, and they might be willing to support this\
    \ plan if we approach them the right way.\n\nPlease let me know what you think\
    \ when you have a chance. I know we\u2019re all juggling a lot right now, but\
    \ I genuinely believe this could be a step in the right direction for the university.\n\
    \nThanks so much for your time and input. Looking forward to hearing from you.\n\
    \nBest regards,\nDevika\n\nSent from my iPhone"

  subject: Outsourcing Maintenance Services - Budget Consideration
  body: "Hi Katherine, Lina, and Mariam,\n\nHope you\u2019re all doing well despite\
    \ the whirlwind of challenges we\u2019ve been navigating lately. I wanted to touch\
    \ base regarding the leaked email about outsourcing maintenance services. This\

  subject: Student Activist Feedback on Teach-in Event
  body: "Hi Alejandro, Lila, and Jin,\n\nHappy New Year\u2014I hope you\u2019re all\
    \ doing well despite the chaos of the last few weeks. I wanted to share a quick\
    \ update and summary of the feedback we got from the student activists during\
    \ the teach-in event on January 1st. It was a really powerful gathering, and they\
    \ provided a ton of thoughtful (and honestly, pretty pointed) suggestions that\
    \ I think we need to bring to the next admin meeting.\n\nFirst, a lot of the students\
    \ emphasized the need for way more transparency in decision-making\u2014like,\
    \ they\u2019re still feeling burned by how the tuition hike plan came out of nowhere\
    \ last semester. One idea they floated was having a dedicated student rep in budget\
    \ committee meetings (maybe something we could pilot?). They also mentioned wanting\
    \ periodic Q&A sessions with leadership, where they could actually engage in real\
    \ dialogue instead of just hearing prepared statements. \n\nAnother big theme\
    \ was protecting academic programs and scholarships. They\u2019re really worried\
    \ about how the mergers will affect underrepresented fields, especially since\
    \ a few of the programs on the chopping block have been doing critical work in\
    \ diversity and equity. They suggested doing an impact study before finalizing\
    \ any cuts\u2014do you know if something like that\u2019s already in the works?\
    \ If not, I think it\u2019s worth flagging.\n\nOh, and one recurring point (that\
    \ honestly came up again and again) was the IT failures. Students are super frustrated\
    \ about the outages, and they feel like the administration isn\u2019t being upfront\
    \ about the scope of the problem. A few of them even said it\u2019s hard to trust\
    \ the university to manage tuition money responsibly if they can\u2019t even keep\
    \ the servers running. Fair point, honestly.\n\nOne last thing\u2014there\u2019\
    s been a lot of buzz about that anonymous $250k donation to the scholarship fund.\
    \ Some of the students were brainstorming ways to leverage that as proof of what\u2019\
    s possible when the university commits to transparency. Maybe we can highlight\
    \ that in our next conversations with the admin team?\n\nLet me know if this lines\
    \ up with what you heard from your own follow-ups or if I\u2019m missing anything\
    \ major! I\u2019m also happy to draft a more formal summary if we need to share\
    \ this with anyone else\u2014I just wanted to get this to you quickly while it\u2019\
    s fresh in my mind. \n\nLooking forward to hearing your thoughts!\n\nBest,\nAmira\n\
    \nSent from my phone, sorry for any typos!"

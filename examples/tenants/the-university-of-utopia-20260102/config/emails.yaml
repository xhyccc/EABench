    \ proposal, including long-term impacts on scholarships, department operations,\
    \ and tuition adjustments.\n2. Identifying potential risks or unintended consequences\
    \ (e.g., faculty resignations, further protests, or donor hesitations).\n3. Mapping\
    \ out how these changes would align with our commitment to addressing IT infrastructure\
    \ failures, which have become a pressing issue.\n\nI realize this is a heavy lift,\

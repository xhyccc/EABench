  subject: Update on Email System Repairs
  body: "Hi Omar, Dev, and Javier,\n\nI wanted to provide you with an update on the\
    \ ongoing repairs to the university's email system, which, as you know, has been\
    \ completely shut down since the critical vulnerability was discovered on December\
    \ 13th. First and foremost, I want to thank you all for your patience and understanding\
    \ during this downtime\u2014it\u2019s been a challenging few days for all of us.\n\
    \nAs of now, our team has isolated the root cause of the vulnerability, which\
    \ stems from outdated server infrastructure and years of deferred maintenance\
    \ (not surprising, given the broader IT challenges we've faced). We\u2019ve brought\
    \ in external support to expedite repairs, and they\u2019ve assured us that the\
    \ issue should be resolved by December 18th at the latest. However, given the\
    \ complexity of the situation, I\u2019d recommend we plan for the possibility\
    \ of delays. I\u2019ll keep you updated if the timeline shifts.\n\nIn the meantime,\
    \ we\u2019re implementing contingency measures to ensure communication can continue\
    \ as smoothly as possible while the email system remains offline. Some key points:\n\
    \n1. **Temporary Communication Channels**: Please continue using Microsoft Teams\
    \ and Zoom for coordination. While not ideal, these platforms are holding up reasonably\
    \ well despite the intermittent outages we\u2019ve seen on the university network.\n\
    \n2. **Emergency Updates**: I\u2019ve asked the university\u2019s social media\
    \ team to post critical announcements on our official channels (Twitter, Facebook,\
    \ etc.) to keep students, faculty, and staff informed. If you have anything urgent\
    \ to share, let me know, and I\u2019ll coordinate with them.\n\n3. **File Sharing**:\
    \ For any documents you need to share, I\u2019d recommend using Google Drive or\
    \ Dropbox for now, as the student portal\u2019s failure has further disrupted\
    \ access to university resources.\n\nIf you have other ideas for improving communication\
    \ during this downtime, please let me know\u2014I\u2019d appreciate the input.\n\
    \nAlso, I realize this outage comes at a particularly stressful time, given the\
    \ broader challenges the university is facing (budget concerns, protests, etc.).\
    \ During yesterday\u2019s IT department meeting, several team members expressed\
    \ concerns about how these infrastructure issues are impacting our credibility\
    \ with students and faculty. I\u2019m already discussing this with the chancellor\
    \ to ensure IT gets included in future budget conversations\u2014though, as you\
    \ can imagine, that\u2019s an uphill battle right now.\n\nFinally, if you encounter\
    \ any additional issues with Teams or Zoom, please flag them with me or the help\
    \ desk ASAP\u2014we\u2019ve seen sporadic complaints about connectivity but need\
    \ more detail to troubleshoot effectively.\n\nThanks again for your understanding,\
    \ and please don\u2019t hesitate to reach out if you have any questions or need\
    \ clarification on any of the above.\n\nBest regards,\nWei\n\nSent from my iPhone"

  subject: Emergency IT Security Update
  body: "Dear Alejandro, Samuel, and Wei,\n\nI hope this message finds you well, though\
    \ I know it's been a challenging few weeks for all of us. I'm writing to follow\
    \ up on the IT department's recent findings and escalate the urgency of the situation\
    \ we\u2019re facing.\n\nAs discussed in our previous meetings, our infrastructure\
    \ has been stretched beyond its limits for some time now, and the latest server\
    \ outages have only emphasized how critical the situation has become. Just yesterday,\
    \ we identified unauthorized access attempts on our systems\u2014a clear indication\
    \ that we are now vulnerable to potential data breaches. Combined with the software\
    \ vulnerabilities we reported earlier this week, the risk of a complete system\
    \ failure is growing by the day. Frankly, we're at the point where band-aid fixes\
    \ are no longer an option.\n\nTo ensure the security and functionality of our\

  subject: Agenda for Emergency Press Briefing Tonight
  body: "Hi Emily, Omar, and Alejandro,\n\nHope you\u2019re all holding up okay amidst\
    \ the chaos this week. As discussed earlier, here\u2019s the finalized agenda\
    \ for tonight\u2019s emergency press briefing with the interim chancellor. Please\
    \ review and let me know if I\u2019ve missed anything or if there are any last-minute\
    \ updates we should incorporate.\n\n**Agenda:**\n1. **Opening Remarks (5 mins)**:\
    \ Interim Chancellor will address the urgency of the situation and provide a brief\
    \ overview of the financial challenges and IT crisis.\n2. **IT Crisis Update (10\
    \ mins)**: Outline the current state of the infrastructure issues, recent server\
    \ outages, and the IT department\u2019s urgent funding requests. Highlight the\
    \ steps taken so far and the estimated timeline for full resolution.\n3. **Student\
    \ Protests and Transparency (15 mins)**: Directly address the student protests\
    \ and the petition calling for the chancellor\u2019s resignation. Emphasize commitment\
    \ to transparency, and acknowledge the concerns raised. Mention the planned review\
    \ of tuition hike proposals and department mergers.\n4. **Funding and Donations\
    \ (10 mins)**: Discuss the anonymous donation, alumni coalition efforts, and the\
    \ conditional pledges for scholarships and program preservation. Provide a clear\
    \ call to action for continued support.\n5. **Q&A Session (20 mins)**: Open the\
    \ floor for questions from press and stakeholders. Be prepared for tough questions\u2014\
    especially regarding the leaked memo, audio recording, and no-confidence vote\
    \ rumors. \n\n**Key Points to Emphasize:**\n- Acknowledge the frustration and\
    \ uncertainty felt by students, faculty, and staff without sounding defensive.\
    \ Tone needs to be empathetic but firm.\n- Reiterate the administration\u2019\
    s commitment to transparency and collaboration while outlining concrete next steps\
    \ (even if they\u2019re not fully finalized yet).\n- Provide realistic timelines\
    \ for IT fixes and financial recovery\u2014let\u2019s not promise what we can\u2019\
    t deliver.\n- Avoid getting sidetracked by speculative questions (e.g., the anonymous\
    \ donation or charter clause discovery). Redirect to the pressing issues at hand.\n\
    \nI\u2019d like to double-check a couple of things before we go live:\n- Emily,\

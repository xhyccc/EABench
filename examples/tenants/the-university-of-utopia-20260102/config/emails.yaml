  subject: Support for Students During Protest
  body: "Hi Amira, Chloe, and Jin,\n\nI\u2019m reaching out to coordinate efforts\
    \ to support our students during the ongoing protests on campus, as discussed\
    \ briefly in yesterday\u2019s town hall and during our follow-up meeting with\
    \ the student services team. With tensions escalating and emotions running high,\
    \ it\u2019s critical that we ensure student safety while also providing the resources\
    \ they need to express their concerns in a constructive and safe manner.\n\nHere\u2019\
    s what I\u2019d like us to focus on:\n\n1. **Safety Measures:**\n   - Amira, can\
    \ you check in with campus security to ensure they\u2019re taking a measured,\
    \ non-confrontational approach? We want to avoid escalating any situations. Please\
    \ confirm if additional officers will be on standby tomorrow morning during the\
    \ planned rally.\n   - Chloe, can you coordinate with the health services team\
    \ to have counselors available near protest areas? I\u2019m concerned about students\
    \ who might be feeling overwhelmed or distressed.\n\n2. **Resource Support:**\n\
    \   - Jin, can we set up a few hydration and snack stations near the main protest\
    \ areas? If possible, let\u2019s make sure they\u2019re stocked by mid-morning\
    \ tomorrow. Also, I recall from last semester\u2019s protest that students appreciated\
    \ access to blankets and hand warmers\u2014can we look into that again?\n   -\
    \ Amira, can you confirm if we still have the portable charging stations from\
    \ the events team? These might be useful, especially with students using their\
    \ phones to livestream and organize.\n\n3. **Open Communication:**\n   - Chloe,\
    \ I know you've been liaising with student leaders. Can you reach out to them\
    \ again to reiterate that our doors are open if they want to meet with administration?\
    \ It might help to proactively offer some meeting times next week.\n   - Jin,\
    \ can you draft a quick update for the university website and social channels\
    \ to let the broader community know we\u2019re taking steps to support students?\
    \ Please run it by me before posting.\n\nAlso, let\u2019s set up a quick check-in\
    \ call tomorrow morning at 8 a.m. to make sure everyone\u2019s aligned before\
    \ the day kicks off. If that time doesn\u2019t work for anyone, let me know ASAP\
    \ so we can adjust.\n\nFinally, I know we\u2019re all stretched thin with everything\
    \ going on (and now there\u2019s that IT mess with the outage\u2014ugh). Please\
    \ flag any gaps or issues you come across so we can troubleshoot quickly. I appreciate\
    \ all the hard work you\u2019re putting into this. Let\u2019s do everything we\
    \ can to support our students right now.\n\nThanks, and let me know if I missed\
    \ anything.\n\nBest,\nAlejandro\n\nSent from my iPhone"

  subject: Critical Software Vulnerability - Immediate Action Required
  body: "Hi Sarah, Priya, and Alejandro,\n\nI hope this email finds you well given\
    \ the circumstances. I\u2019m reaching out to urgently discuss the critical software\
    \ vulnerability flagged by the IT department earlier today. After reviewing their\

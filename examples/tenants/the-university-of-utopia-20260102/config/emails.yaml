  body: "Subject: IT Infrastructure Repairs: Budget and Timeline\n\nHi Dev, Javier,\
    \ Yash, and Wei,\n\nI hope you\u2019re all doing well, though I know it\u2019\
    s been a particularly challenging time for everyone. I wanted to follow up on\

  subject: Follow-Up on Faculty Union Meeting and Layoff Concerns
  body: "Hi Priya, Emily, and Alejandro,\n\nThanks for taking the time to meet with\
    \ me earlier today to discuss the ongoing concerns raised by the faculty union,\
    \ particularly around the potential layoffs and department mergers. I wanted to\
    \ provide a quick recap of where things stand and outline some next steps as we\
    \ move forward.\n\nFirst off, I acknowledge that the meeting was tense, and understandably\
    \ so. The union representative made it clear that the uncertainty surrounding\
    \ job security and departmental changes is causing significant stress among faculty\
    \ members. While I tried to provide as much context as possible regarding the\
    \ broader financial challenges we\u2019re facing, I know the lack of definitive\
    \ answers on layoffs or mergers wasn\u2019t the resolution they were hoping for.\
    \ We\u2019ll need to prioritize follow-up communications to address this void\u2014\
    it\u2019s critical that we don\u2019t let the current tensions escalate further.\n\
    \nTo that end, I think we need to revisit the timeline for our financial transparency\
    \ plan. The interim chancellor\u2019s public statement from earlier this week\
    \ promised an update within a week, but given the additional discrepancies uncovered\
    \ by the finance team, we may need to adjust expectations. Can we confirm with\
    \ the finance department whether they\u2019ll have enough clarity to publish anything\
    \ meaningful by then? Or should we explore releasing an interim update just to\
    \ show progress?\n\nI\u2019m also wondering about the leaked budget draft that\u2019\
    s been circulating. Have we confirmed its authenticity? If it\u2019s legitimate,\
    \ we need to address it head-on in our communications. If not, we might want to\
    \ consider a strong statement to dispel any misinformation. Alejandro, can you\
    \ coordinate with the communications team to draft something preliminary?\n\n\
    Another big takeaway from today\u2019s meeting is that we need to create more\
    \ formal opportunities for faculty and staff to voice their concerns. The town\
    \ halls are helpful, but they\u2019re not enough on their own. Does it make sense\
    \ to propose a joint task force with union reps and admin leadership to work through\
    \ these issues collaboratively? Priya, I know you\u2019ve worked on similar initiatives\
    \ in the past\u2014do you think this is feasible, or do we risk it becoming another\
    \ flashpoint?\n\nLastly, on a somewhat unrelated note, the IT department\u2019\
    s request for emergency funding came up briefly during today\u2019s meeting. While\
    \ it\u2019s not directly tied to the layoffs/mergers conversation, it\u2019s another\
    \ area where we need to tread carefully. The last thing we need right now is another\
    \ campus-wide outage adding to the chaos. Emily, can you follow up with the IT\
    \ team to get a clearer picture of the cost and urgency? If it\u2019s something\
    \ we can\u2019t delay, we might need to reshuffle priorities to make it happen.\n\
    \nLet\u2019s regroup tomorrow afternoon to finalize next steps. Things are moving\
    \ quickly, and I want to be sure we\u2019re on the same page before the situation\
    \ escalates any further. Please send me your thoughts (or any additional updates)\
    \ by noon if possible.\n\nThanks, everyone, for your continued efforts during\
    \ what I know is a challenging time for all of us.\n\nBest,\nSarah\n\nSent from\
    \ my iPhone"

  subject: Planning Support for Upcoming Rally Against Interim Chancellor
  body: "Hi Amina, Amira, and Chloe,\n\nHope you all had a chance to regroup after\
    \ the chaotic town hall meeting earlier this week. I wanted to circle back on\
    \ our discussion about supporting the students organizing the rally in response\
    \ to the petition demanding the interim chancellor's resignation. There's a lot\
    \ to unpack here, but we need to ensure we're providing resources while also keeping\
    \ everything safe and organized.\n\nFirst, regarding logistics: Do we have clarity\
    \ on the rally's exact time and location yet? I know there were mentions of it\
    \ being near the administration building, but I haven\u2019t seen anything concrete.\
    \ Can someone confirm? Also, let\u2019s make sure campus security is looped in\
    \ early on this\u2014given the tensions, I want to make sure we avoid any unnecessary\
    \ confrontations. Chloe, could you reach out to Officer Daniels to confirm security\
    \ arrangements?\n\nSecond, we\u2019ll need to coordinate with IT to make sure\
    \ their current issues don\u2019t disrupt anything. With the ongoing server outages,\
    \ I\u2019m concerned about how we\u2019ll handle communications on the day of\
    \ the rally\u2014especially if students are relying on social media or email updates.\
    \ Amira, can you check if IT has a contingency plan for this? Also, would it make\
    \ sense to set up a temporary hotline or text alert system for updates?\n\nThird,\
    \ there\u2019s the matter of supplies\u2014water stations, first aid kits, and\
    \ possibly printed materials for students. Amina, can you follow up with the Events\
    \ team to see if they have anything leftover from last semester\u2019s campus\
    \ fair? I know students are already stretched thin, so if we can cover these basics\
    \ for them, it\u2019d go a long way.\n\nLastly, I wanted to flag the petition\
    \ itself\u2014it\u2019s gaining serious traction (10,000+ signatures now, wow).\
    \ I think it\u2019d be helpful to have a clear understanding of how this might\
    \ play into the rally and any other upcoming actions. Should we connect with the\
    \ students leading the petition to get a better sense of their plans? If anyone\
    \ has contacts among that group, let me know.\n\nThanks in advance for your help\
    \ with all of this\u2014please keep me updated on any developments, especially\
    \ as the rally date approaches. Let\u2019s aim to reconvene early next week, either\
    \ in person or via Zoom, to finalize everything. Just let me know what works best\
    \ for your schedules.\n\nAppreciate all your hard work, especially with everything\
    \ going on lately. Let\u2019s make sure we\u2019re supporting the students effectively\
    \ while keeping everything as smooth and safe as possible.\n\nThanks,\nAlejandro\n\
    \nSent from my iPhone"

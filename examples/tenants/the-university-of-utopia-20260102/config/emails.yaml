  subject: Student Protest - Immediate Response Required
  body: "Subject: Student Protest - Immediate Response Required\n\nHi Sarah, Priya,\
    \ and Emily,\n\nI hope this email finds you well, though I know we\u2019re all\
    \ feeling the weight of everything going on right now. I wanted to provide a quick\
    \ update on the protest currently happening at the administration building entrance.\
    \ As of this morning, a group of students has chained themselves to the entrance,\
    \ demanding an immediate freeze on tuition hikes and parking fee increases. The\
    \ situation is drawing significant media attention, and we need to figure out\
    \ how to respond before things escalate further.\n\nA few notes to keep in mind:\n\
    1. The students involved are from several activist groups we\u2019ve seen organizing\
    \ over the past couple of weeks. They\u2019re citing the leaked parking fee memo\
    \ and the ongoing tuition hike discussions as their main points of contention.\n\
    2. The bookstore reported a spike in sales of protest-themed items yesterday,\
    \ so it\u2019s clear there\u2019s strong momentum building on campus. This could\
    \ mean an even larger rally later today or tomorrow.\n3. Media outlets are starting\
    \ to pick up on this, and I wouldn\u2019t be surprised if we get calls from local\
    \ reporters soon. We need to be prepared with a unified message\u2014something\
    \ better than the vague statements we\u2019ve been putting out lately (sorry,\

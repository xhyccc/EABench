    \ with wellness initiatives.\n\nFirst, I know the partial and complete IT outages\
    \ over the past few days have severely impacted students\u2019 ability to access\
    \ academic resources, which has only added to their stress. Can we confirm whether\
    \ the Counseling Center is prioritizing outreach to students who may be particularly\
    \ vulnerable right now? I know we mentioned creating a targeted email campaign,\
    \ but with yesterday\u2019s email system outage, I\u2019m not sure if that went\
    \ out as planned. Could someone double-check this with the IT team and loop me\
    \ in?\n\nSecond, I\u2019ve been hearing increasing concerns from both students\
    \ and faculty about the rumored scholarship cuts (per the leaked document from\
    \ Dec. 16). Many students are already struggling with the financial uncertainty\
    \ and potential tuition hikes, so it\u2019s critical we bolster support systems\u2014\
    both financial and emotional\u2014wherever possible. Did we ever finalize the\
    \ plan to set up emergency mini-grants for students in immediate need? If not,\
    \ let\u2019s prioritize this and talk about how we can expedite the process. Chloe,\
    \ I believe you were going to connect with the Financial Aid office about this\u2014\
    any updates?\n\nThird, the student-led protests and sit-ins have clearly escalated,\
    \ and while it\u2019s encouraging to see their passion, it\u2019s also taking\
    \ a toll on their well-being. I think we should consider increasing the visibility\
    \ of peer support groups and student-led de-escalation training (if that\u2019\
    s even still an option\u2014I know we\u2019ve talked about it before, but I can\u2019\
    t remember where we left it). Afolabi, I know you\u2019ve been in touch with some\
    \ of the student leaders\u2014do you think they\u2019d be open to collaborating\
    \ on something like this?\n\nLastly, there\u2019s the ongoing issue of communication.\
    \ The vagueness of the administration\u2019s recent statements is clearly not\
    \ helping matters, and students are coming to us for answers we don\u2019t always\
    \ have. I think we need to be more transparent about what we *do* know and what\u2019\
    s still in flux, even if that means acknowledging we\u2019re just as frustrated.\
    \ Let\u2019s brainstorm ways to get this messaging out ASAP\u2014maybe a drop-in\
    \ forum or a Q&A session on Zoom? I\u2019m open to ideas here.\n\nLet me know\
    \ your thoughts on all of this, and please flag anything I\u2019ve missed. I know\
    \ we\u2019re all juggling a lot right now, but I genuinely believe we can make\
    \ a difference for our students if we stay focused and collaborative. Also, just\
    \ a heads-up\u2014I\u2019ll be tied up in meetings most of tomorrow morning (including\
    \ the emergency town hall prep), but I\u2019ll try to check emails during breaks.\
    \ Text me if anything urgent comes up.\n\nThanks again for everything you\u2019\
    re doing.\n\nBest,\n\nAlejandro\n\nSent from my iPhone"

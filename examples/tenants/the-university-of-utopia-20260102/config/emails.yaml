    \ can handle it\u2014especially given the recent outages.\n\nLet\u2019s aim to\
    \ get a working draft of the transparency report pulled together by the end of\
    \ next week (or earlier if possible). Also, we may need to loop in the interim\
    \ chancellor\u2019s office at some point to ensure alignment, though I know their\

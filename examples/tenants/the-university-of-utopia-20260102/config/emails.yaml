    \nI know the timing isn\u2019t great with all the other challenges the university\
    \ is facing, but this is critical. If there are any roadblocks or if you need\
    \ additional resources (or just a second set of eyes), let me know ASAP.\n\nLet\u2019\
    s aim to regroup on this by EOD tomorrow. Does that work for everyone? Feel free\

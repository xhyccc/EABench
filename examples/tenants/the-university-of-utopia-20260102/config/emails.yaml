  subject: Faculty Concerns on Transparency and Dean Resignations
  body: "Hi Devika, Meera, and Lila,\n\nI wanted to loop back with you all after yesterday's\
    \ faculty town hall regarding the concerns raised about transparency and the recent\
    \ resignations of several deans. There was a lot of frustration expressed, and\
    \ I think we need to act quickly to address some of these issues before they escalate\
    \ further. Faculty morale seems to be dipping, and I\u2019m worried about how\
    \ this might affect retention and overall trust in leadership.\n\nOne major theme\
    \ was the lack of communication from the administration regarding decision-making\
    \ processes. I know we\u2019ve talked before about creating a more regular cadence\
    \ of updates for faculty, but do you think there\u2019s a way to involve them\
    \ more directly\u2014maybe through a standing committee or more frequent Q&A forums?\
    \ Would love your input on what might be feasible.\n\nThe resignations also came\
    \ up several times. I know we don\u2019t want to get into personnel details, but\
    \ there\u2019s definitely a sense that the departures signal deeper issues. Should\
    \ we be framing this more proactively in some kind of messaging? Or is it better\
    \ to just focus on moving forward and not dwell on the past? I\u2019m genuinely\
    \ torn here.\n\nAlso, just as a side note\u2014have either of you seen the draft\
    \ of the budget update from finance? I heard there was an accounting error that\
    \ worsened the shortfall slightly, and I want to make sure we\u2019re factoring\
    \ that into how we communicate budget challenges. With the student protest planned\
    \ for tomorrow, this is all going to be in the spotlight even more.\n\nLet\u2019\
    s plan to connect sometime this week to strategize. Let me know what your schedules\
    \ look like. Thanks in advance for your thoughts!\n\nBest,  \nEmily  \n\nSent\
    \ from my iPhone"
  timestamp: '2025-12-03T17:00:00Z'

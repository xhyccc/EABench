    \ town hall, I\u2019m not optimistic about getting immediate buy-in from leadership,\
    \ but we need to push forward regardless\u2014especially with the faculty-led\
    \ committee now publicly calling for infrastructure improvements as part of their\
    \ open letter. If we can align with them, we might build some broader support\
    \ across campus.\n\nNext steps:\n- Priya, could you double-check the timeline\
    \ for submitting the grant applications? We might need to expedite given the urgency.\n\
    - Sarah, can we set up a quick call next week to review the presentation draft?\
    \ I want to make sure everything is crystal clear before looping in the interim\
    \ chancellor.\n- Both\u2014please flag any additional funding sources or partnerships\
    \ we might\u2019ve missed. I\u2019m happy to dig into details if needed.\n\nLet\
    \ me know if anything\u2019s unclear or if you have other thoughts. Thanks for\

  subject: Review of Faculty Alternative Budget Proposal
  body: "Hi Sarah, Maria, and Lina,\n\nHope you're all doing well. I wanted to follow\
    \ up on the faculty's alternative budget proposal that was formally submitted\
    \ yesterday. As you\u2019ve likely seen, their plan focuses heavily on increasing\
    \ grant applications as a way to offset the budget deficit and avoid department\
    \ mergers. \n\nWhile I think it\u2019s a creative approach and definitely worth\
    \ exploring, I\u2019d like your insights on a few key areas:\n\n1. **Feasibility**:\
    \ How realistic is it for departments to meaningfully increase grant applications\
    \ (and success rates) within the necessary timeframe? From what I recall in our\
    \ last meeting, some departments are already stretched thin in terms of resources\
    \ and support for grant writing. Would we need to allocate additional staffing\
    \ or training to make this work?\n\n2. **Impact**: Assuming they can ramp up grant\
    \ applications, how much revenue could we reasonably expect this to generate,\
    \ and how quickly? I\u2019m worried this may not address the immediate shortfall\
    \ we\u2019re dealing with.\n\n3. **Risks**: What risks do you see with this approach?\
    \ For example, does this increase the workload for faculty to an unsustainable\
    \ level, especially given the current morale issues? Should we consider a hybrid\
    \ approach combining this with other measures?\n\nAlso, I noticed the leaked budget\
    \ draft has caused quite a stir (again), and there\u2019s growing concern about\
    \ the department mergers and potential layoffs. If we\u2019re seriously considering\
    \ this alternative proposal, we\u2019ll need to communicate our stance carefully\
    \ to the faculty and students. Otherwise, we risk further eroding trust.\n\nPlease\
    \ share your thoughts when you have a chance\u2014ideally by EOD tomorrow so I\
    \ can compile our feedback for the chancellor. If you need more info or want to\
    \ look at specific numbers, just let me know, and I\u2019ll dig into the files\
    \ (though, fair warning, the finance team has been a bit swamped with the internal\
    \ review).\n\nThanks, and sorry if this feels rushed\u2014things are moving quickly\
    \ right now.\n\nBest,\nPriya\n\nSent from my iPhone"

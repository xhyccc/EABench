  subject: Budget Implications of Faculty Cuts and Tuition Freeze Demands
  body: "Hi Sarah, Priya, and Lina,\n\nI hope this email finds you well. I wanted\
    \ to circle back on the financial analysis we\u2019ve been discussing over the\
    \ past week, particularly in light of the heightened tensions on campus and the\
    \ recent developments. The demands for a tuition and parking fee freeze, combined\
    \ with the potential faculty cuts, are creating an increasingly complex situation\
    \ that we need to address with urgency and care.\n\nFirst, regarding the tuition\
    \ freeze: as we\u2019ve noted in our preliminary models, meeting this demand alone\
    \ would result in an estimated $12 million shortfall for the next fiscal year.\
    \ If we factor in the parking fee freeze as well, that number jumps significantly\u2014\
    closer to $15 million. To offset these losses without external funding, the scale\
    \ of faculty reductions would need to be much larger than initially estimated.\
    \ Have we double-checked the assumptions we used for these projections? I want\
    \ to make sure we\u2019re working with the most accurate numbers before presenting\
    \ anything further to the board.\n\nOn the faculty cuts\u2014this is obviously\
    \ the most contentious piece. The backlash from both students and faculty is escalating\
    \ quickly, as we all saw with the protests, sit-ins, and now the solidarity strike\
    \ plans from the humanities department. The leaked memo has only made things worse.\
    \ I know we\u2019ve talked about a phased approach to layoffs, but is it worth\
    \ revisiting alternative options, like furloughs or voluntary early retirements?\
    \ I\u2019d also appreciate any insight you\u2019ve gathered from your teams about\
    \ how morale is holding up. The last thing we need right now is for this to spiral\
    \ even further.\n\nI also wanted to flag the IT issues we\u2019ve been experiencing\u2014\
    the network outages and the email system vulnerabilities are becoming a serious\
    \ liability. The outages have been affecting critical academic and administrative\
    \ functions, which is adding fuel to the fire. I know this isn\u2019t within our\
    \ direct purview, but it\u2019s hard to separate these operational breakdowns\
    \ from the broader financial challenges. Do we know if the IT team has submitted\
    \ a formal budget request to address the outdated infrastructure? If not, we may\
    \ need to help push that forward.\n\nLastly, I want to touch on the optics of\
    \ all of this. The alumni association\u2019s public statement and the recent media\
    \ coverage have not been kind to us, to say the least. The chancellor\u2019s vague\
    \ promises of \u2018transformative solutions\u2019 aren\u2019t landing well with\

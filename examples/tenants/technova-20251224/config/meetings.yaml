- id: meeting2
  title: Server Rollback Strategy Session
  organizer: okhan
  invitees:
  - okhan
  - wchen
  attendees:
  - okhan
  - wchen
  start_time: '2025-12-22T12:00:00Z'
  end_time: '2025-12-22T13:00:00Z'
  agenda: Evaluate rollback feasibility and implementation challenges.
  location: Engineering War Room
  transcript: "Omar Khan: Hi Wei, can you hear me? \nWei Chen: Yeah, loud and clear.\
    \ Can you hear me? \nOmar Khan: Yep, all good. Let\u2019s dive in. So, today\u2019\
    s agenda is to evaluate the rollback feasibility and any challenges that might\
    \ come up with implementation. \nWei Chen: Got it. So, should we start by outlining\
    \ the current issues with the new server version? \nOmar Khan: Yeah, so the main\
    \ issue is the performance lag reported by users after the last deployment. Plus,\
    \ there\u2019s that data sync error that\u2019s been popping up intermittently.\
    \ \nWei Chen: Right, I\u2019ve been looking into those. The performance lag seems\
    \ tied to the new caching mechanism we introduced. The rollback would obviously\
    \ remove that, but it\u2019ll also take away some of the benefits we were aiming\
    \ for. \nOmar Khan: True. Do we know how much downtime we\u2019re looking at if\
    \ we roll back? \nWei Chen: It depends. If we can script an automated rollback,\
    \ we\u2019re talking maybe 15-20 minutes tops. But manual intervention could stretch\
    \ it to an hour or more. \nOmar Khan: Hm, an hour of downtime might be too disruptive.\
    \ Did you get a chance to check with the ops team on their rollback readiness?\
    \ \nWei Chen: I reached out yesterday, but I haven\u2019t heard back yet. I\u2019\
    ll follow up after this call. \nOmar Khan: Okay, let\u2019s make sure to loop\
    \ them in soon. Also, what about the database changes? I\u2019m worried that reverting\
    \ the server code might create inconsistencies there. \nWei Chen: Good point.\
    \ If we rollback, we\u2019ll need to undo the database schema updates too. That\u2019\
    s where things could get messy. I think we need a dry run in the staging environment\
    \ before making any decisions. \nOmar Khan: Agreed. We should test every scenario\
    \ in staging. Let\u2019s avoid surprises in production. \nWei Chen: Absolutely.\
    \ Oh, one more thing\u2014do we have any metrics on how many users are actually\
    \ affected by these issues? \nOmar Khan: Not yet. I was hoping to get that from\
    \ the analytics team. But based on the support tickets, it\u2019s a significant\
    \ portion of our user base. \nWei Chen: Okay, got it. By the way, side note, did\
    \ you see the email about the quarterly team retro? \nOmar Khan: Oh yeah, I did.\
    \ Let\u2019s take that offline though, we\u2019re getting sidetracked. \nWei Chen:\
    \ Right, sorry. Back to the rollback\u2014should we also prep a communication\
    \ plan for users in case we proceed? \nOmar Khan: Definitely. Let\u2019s draft\
    \ something with the marketing team once we finalize the rollback decision. \n\
    Wei Chen: Sounds good. Anything else we need to cover? \nOmar Khan: I think that\u2019\
    s it for now. Action items: You\u2019ll follow up with ops and run the staging\
    \ tests, and I\u2019ll get the analytics team to dig into the user impact. Let\u2019\
    s sync up later this week to review. \nWei Chen: Got it. Thanks, Omar. \nOmar\
    \ Khan: Thanks, Wei. Talk soon."

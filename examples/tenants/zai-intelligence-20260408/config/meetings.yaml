  title: Data Science Team Stand-up
  transcript: "Tanvi Sharma: Good morning, everyone. Let's get started. We have two key items on the agenda today—first, the mislabeled annotations in the benchmark dataset, and second, the demo preparation delays. I know time is tight, so let's jump right in. Katya, can you provide some context on the mislabeled annotations?\n\nKatya Petrov: Sure, Tanvi. So, late yesterday, during the final review of the benchmark dataset, we discovered that roughly 8% of the annotations in the validation subset are incorrectly labeled. This seems to stem from a mapping error in the semi-automated annotation tool. We’re currently investigating the root cause, but it’s already clear that this will push back the demo timeline.\n\nNeha Sharma: Wait, 8%? That’s a huge chunk. Were these errors not flagged during the initial QA pass?\n\nKatya Petrov: Unfortunately, no. The issue slipped through because the errors weren't consistent—they were intermittent and context-specific. The annotation tool seemed to misclassify edge cases, which made it harder to catch during our spot checks.\n\nAlessandra Rossi: Sorry to interrupt—can I jump in here? Can you clarify if this affects just the validation subset or the training subset as well?\n\nKatya Petrov: Right now, it’s localized to the validation subset, but we’re running a cross-check on the training set just to be sure.\n\nTanvi Sharma: Okay, thanks, Katya. This definitely puts us in a difficult position. Alessandra, does this impact the visualizations we prepared for the investor demo?\n\nAlessandra Rossi: Yes, unfortunately. Some of the mislabeled data directly feeds into the visualizations. I already flagged this yesterday. Essentially, if we show the demo with the current dataset, the results will not align with the accuracy benchmarks we promised.\n\nNeha Sharma: Ugh. This is exactly what I was worried about. We’re already stretched thin, and now we’re backtracking on deliverables. Should we pause the demo prep until this is resolved?\n\nTanvi Sharma: Let’s hold off on that decision for now. We’ll circle back to it after we discuss options. Katya, how long do you estimate it’ll take to fix the mislabeled annotations?\n\nKatya Petrov: That depends. If we do it manually, we’re looking at 3-4 days minimum. If we try to fix the annotation tool and re-run the process, it could take longer, maybe a full week.\n\nNeha Sharma: And what if we use a hybrid approach? Like, fix the tool for the straightforward cases and manually correct the rest?\n\nKatya Petrov: That could work, but we’d need at least two people dedicated to manual corrections simultaneously.\n\nAlessandra Rossi: Sorry, can you hear me? I think my mic cut out earlier.\n\nTanvi Sharma: Yes, we can hear you now. Go ahead.\n\nAlessandra Rossi: Okay, just wanted to say that if we’re splitting resources between fixing the annotations and prepping the demo, we need to be realistic about what we can deliver by the investor deadline. To be honest, we should consider pushing the demo out.\n\nTanvi Sharma: I hear you, Alessandra, but I’m not sure that’s an option. The CFO has made it pretty clear that the investors expect to see something by the end of the week. *sighs* Let’s table the demo discussion for a moment and move on to resource allocation.\n\nNeha Sharma: I can volunteer to help with the manual corrections if needed, but that’s going to pull me away from the model optimization work.\n\nTanvi Sharma: Right, and we can’t afford to fall behind there either. Katya, is there anyone on your team who can assist?\n\nKatya Petrov: Not without delaying other ongoing tasks. We’re already stretched thin with the cross-checks on the training set.\n\nAlessandra Rossi: Can we loop in the interns for some of the manual corrections? I know they’re not fully trained, but this seems like a manageable task for them with proper guidance.\n\nNeha Sharma: That’s a good idea. It’ll take some time to onboard them to the process, but it’s better than nothing.\n\nTanvi Sharma: Alright, let’s make that an action item. Katya, can you coordinate with HR to assign a couple of interns to this task? Neha, can you draft a quick onboarding guide for them?\n\nKatya Petrov: Will do.\n\nNeha Sharma: Sure, I’ll have that ready by the end of the day.\n\nTanvi Sharma: Great. Now, back to the demo. Alessandra, if we address the mislabeled annotations, how soon can we update the visualizations?\n\nAlessandra Rossi: If I get the corrected dataset by Thursday morning, I can push out updated visuals by Thursday evening.\n\nTanvi Sharma: That’s cutting it close, but it might work. Alright, I think we have enough to move forward. Let’s summarize the action items:\n\n- Katya will coordinate with HR to assign interns for manual annotation corrections.\n- Neha will prepare an onboarding guide for the interns.\n- Katya’s team will investigate the root cause of the annotation tool error and run cross-checks on the training set.\n- Alessandra will prepare updated visualizations as soon as the corrected dataset is ready.\n\nTanvi Sharma: Anything else before we wrap up?\n\nAlessandra Rossi: Just one thing—can we have a quick sync tomorrow to check progress?\n\nTanvi Sharma: Good idea. Let’s schedule a 15-minute sync for tomorrow morning. Everyone, check your calendars and send me your availability.\n\nNeha Sharma: Sounds good to me.\n\nKatya Petrov: Works for me too.\n\nTanvi Sharma: Alright, meeting adjourned. Thanks, everyone. Let’s get to it."

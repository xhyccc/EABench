  title: 'Investor Feedback: Operational Costs Breakdown'
  transcript: "Mariam Hamed: Hi everyone, thanks for joining today. Let's get started. As you know, the agenda is to review and refine the breakdown of operational costs for the next quarter based on the feedback we received from investors. Can everyone hear me okay?\n\nHanh Nguyen: Yes, I can hear you. Thanks, Mariam.\n\nKwame Williams: Loud and clear.\n\nMahmoud Baddour: Same here, Mariam. Let’s dive in.\n\nMariam Hamed: Great. So, I’ve shared the preliminary cost breakdown in the meeting invite. I’d like to start by addressing the main concern brought up by investors—our projected operational costs seem overly generalized, and they’re asking for more granularity. Kwame, could you walk us through the current breakdown?\n\nKwame Williams: Sure. Give me a second to pull it up... Okay. So, right now, we’ve divided operational costs into three main categories: infrastructure, personnel, and miscellaneous. Infrastructure accounts for 50% of the budget—this includes cloud costs, model training, and storage. Personnel, which is 40%, covers salaries, benefits, and contractor expenses. Lastly, the miscellaneous category is at 10%, covering things like software licenses and office supplies.\n\nMariam Hamed: Thanks, Kwame. So, the feedback from investors was that the miscellaneous category is too broad, and they’d like to see a further breakdown. Mahmoud, do you think we can pull more detail from the finance system?\n\nMahmoud Baddour: Absolutely, Mariam. However, the challenge is that some of the costs in the miscellaneous category are interdependent. For example, software licenses often tie into infrastructure usage. We’ll need to carefully assign those to avoid double-counting.\n\nHanh Nguyen: Sorry to jump in, but I think that’s exactly the kind of detail the investors are looking for. They want to see not just percentages, but also how these costs connect to revenue-generating activities. For instance, if software licenses are enabling development, we should frame it that way.\n\nKwame Williams: Good point, Hanh. But I worry we might get bogged down in this level of detail. Investors want clarity, but we also need to avoid analysis paralysis. Maybe we can focus on breaking down the top three contributors within each category instead?\n\nMariam Hamed: That’s a valid concern, Kwame. Mahmoud, do you think that approach is feasible?\n\nMahmoud Baddour: It is, but it’ll require some manual work to reclassify expenses. I’d say we could have a revised breakdown ready by early next week.\n\nHanh Nguyen: Is there a way to automate some of this? I know the finance system has tagging capabilities—can we use those to create a more dynamic report?\n\nMahmoud Baddour: We can, but the tagging system hasn’t been consistently used across departments. It’ll take time to clean that up. I’d recommend we tackle this manually for now, and then implement better tagging as a long-term solution.\n\nMariam Hamed: Okay, let’s do that. Mahmoud, can you take the lead on creating the revised breakdown? Hanh, can you work with Mahmoud to ensure the narrative ties back to revenue-generating activities?\n\nHanh Nguyen: Absolutely. Mahmoud, let’s sync up after this.\n\nMahmoud Baddour: Sounds good.\n\nKwame Williams: Before we move on, can we talk about infrastructure costs? Investors also flagged our cloud expenses as unusually high. Do we have a plan to optimize that?\n\nMariam Hamed: Good question. Mahmoud, you mentioned last week that you were exploring reserved cloud instances to reduce costs. Any updates?\n\nMahmoud Baddour: Yes, I spoke with the cloud provider, and they confirmed that switching to reserved instances could save us around 20%. However, we’d need to commit to a one- or three-year term. It’s a trade-off between flexibility and savings.\n\nHanh Nguyen: Do we have enough predictability in our workloads to make that commitment?\n\nKwame Williams: I’d say yes for training infrastructure, but less so for storage. Our dataset growth has been unpredictable, especially with the ongoing annotation issues.\n\nMariam Hamed: Let’s take this offline and do a deeper dive into the trade-offs. Mahmoud, can you set up a separate session to discuss this with the engineering and data science teams?\n\nMahmoud Baddour: Will do. I’ll send out invites by the end of the day.\n\nHanh Nguyen: Sorry to derail, but while we’re on the topic of savings, have we looked into renegotiating any of our vendor contracts? That might free up some room in the budget.\n\nMariam Hamed: Good point, Hanh. I’ll ask the procurement team to review our top contracts and see if there’s any wiggle room. Let’s circle back on this in next week’s meeting.\n\nKwame Williams: Before we wrap up, what’s the timeline for presenting this updated breakdown to the investors?\n\nMariam Hamed: They’re expecting it by the middle of next week. Mahmoud, Hanh, can we aim to have the revised report ready by Tuesday, so we have time to review it as a team?\n\nMahmoud Baddour: Tuesday works for me.\n\nHanh Nguyen: Same here.\n\nMariam Hamed: Great. To summarize, Mahmoud will lead the effort to create a more detailed cost breakdown. Hanh will support by aligning expenses with revenue activities. Kwame, you’ll work on identifying top contributors within each category. And I’ll follow up with procurement on vendor contracts. Anything else before we close?\n\nKwame Williams: Nothing from me.\n\nHanh Nguyen: I’m good.\n\nMahmoud Baddour: All set here.\n\nMariam Hamed: Perfect. Thanks, everyone. Talk soon!\n\nHanh Nguyen: Thanks, Mariam.\n\nKwame Williams: See you all.\n\nMahmoud Baddour: Bye!"

  title: 'Feasibility Review: Semi-Automated Data Annotation'
  transcript: "Katya Petrov: Hi everyone, thanks for joining today. Let’s go ahead and get started. The agenda, as you know, is to evaluate the feasibility and resource requirements of the semi-automated data annotation method proposed by… who was it again? Ah, yes, one of our junior data scientists. Let’s aim to keep this to 45 minutes. Sound good?\n\nFelipe Ribeiro: Sounds good to me. Can you hear me okay? My Wi-Fi’s been acting up today.\n\nKatya Petrov: Yep, coming through loud and clear. Can everyone else hear Felipe?\n\nAlessandra Rossi: Yep, I can hear him.\n\nAlejandro Rendón: Same here.\n\nNisha Reddy: All good on my end too.\n\nKatya Petrov: Great. So, just to recap for anyone who hasn’t had a chance to review the proposal, the idea is to use a semi-automated pipeline for data labeling. The system would use an existing machine learning model to pre-label some of the data, and then human annotators would step in to correct or confirm the labels. It’s supposed to cut down on manual effort while maintaining accuracy. Felipe, I know you had some initial thoughts about this. Want to kick us off?\n\nFelipe Ribeiro: Sure. So, first off, I think the concept is interesting. There’s definitely potential to save time, especially for those repetitive labeling tasks. But my concern is that we’ve seen issues in the past with models generating inconsistent outputs. If the pre-labeling isn’t reliable, it could end up creating more work for the annotators who have to fix it. That’s my main worry.\n\nAlessandra Rossi: I agree with Felipe. Plus, I think we need to consider the upfront costs—both in terms of time and resources. Training a model to perform the initial labeling, even semi-effectively, isn’t trivial. Do we have any estimates for how long it would take to set this up?\n\nKatya Petrov: Good point. I believe the proposal mentioned re-purposing one of our existing models for the pre-labeling step. Alejandro, you’ve worked closely with the current models—do you think that’s realistic?\n\nAlejandro Rendón: Hmm, it depends. If we’re talking about re-training one of the models we already have in production, it’s doable, but there are risks. These models weren’t designed for data annotation, so we’d need to fine-tune them carefully. And even then, as Felipe said, the outputs might not be reliable enough. Honestly, I think we’d need at least two or three weeks just to test the feasibility.\n\nNisha Reddy: Two to three weeks? That’s longer than I expected. And what about the annotators—have we thought about how they’d interact with this system? Are we assuming they’ll use a custom interface? If so, who’s building that?\n\nKatya Petrov: Good question, Nisha. The proposal didn’t get into interface details, but I imagine we’d need some sort of tool for annotators to review and adjust the labels. That’s another cost to consider. Felipe, any thoughts?\n\nFelipe Ribeiro: Yeah, I was just about to say that building a custom interface could add another layer of complexity. And if the interface isn’t user-friendly, it could slow down the annotators instead of speeding them up.\n\nAlessandra Rossi: Exactly. And let’s not forget the learning curve—annotators would need training on how to use the new system. Even if the interface is intuitive, there’s always a ramp-up period.\n\nAlejandro Rendón: One thing I’d like to add—sorry to interrupt, Alessandra—is that we should also think about scalability. If this method works, great. But what happens when we need to scale it up for larger datasets? Are we going to run into bottlenecks?\n\nKatya Petrov: All valid points. Let’s take a step back for a moment. Does anyone see any major advantages to this approach that might outweigh these challenges? Nisha?\n\nNisha Reddy: Hmm. I mean, in theory, if the model does a decent job with pre-labeling, it could free up our annotators to focus on more complex cases. That could improve overall quality. But that’s a big “if.” I’m not sure we’re there yet with our current models.\n\nFelipe Ribeiro: Agreed. And let’s not forget that we’re already behind on the benchmark dataset release. Do we really have the bandwidth to experiment with this right now?\n\nKatya Petrov: Good point, Felipe. Okay, let’s summarize what we’ve discussed so far. It sounds like there’s some interest in the concept, but we have significant concerns about feasibility, resource requirements, and timing. Does anyone disagree?\n\n[Silence.]\n\nKatya Petrov: Okay, here’s what I propose: Let’s take this offline and have a smaller group—Felipe, Alejandro, and Nisha—do a quick feasibility study. Give yourselves one week to assess whether we can repurpose an existing model for pre-labeling and what the cost would be to build a basic interface. Does that work?\n\nFelipe Ribeiro: Works for me.\n\nAlejandro Rendón: Same here.\n\nNisha Reddy: Yeah, I can commit to that.\n\nKatya Petrov: Great. We’ll reconvene next week to review your findings. Alessandra, in the meantime, can you start outlining the potential risks and dependencies for this approach?\n\nAlessandra Rossi: Sure thing. I’ll have something ready by next week.\n\nKatya Petrov: Perfect. Thanks, everyone. I know there’s a lot on our plates right now, but I appreciate your focus and input. Let’s wrap it up here. Talk soon!\n\n[Meeting ends.]"

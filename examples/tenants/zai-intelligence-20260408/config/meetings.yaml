  title: Post-Training Techniques Feasibility Discussion
  transcript: "Hyejin Wang: Hi everyone, let’s get started. Thanks for joining on such short notice. The agenda is to discuss the feasibility of adopting the new post-training techniques that the CTO proposed yesterday. We’ll try to keep this concise, but I know there’s a lot to unpack.\n\nAlejandro Rendón: Morning, Hyejin. Before we dive in, just to clarify—are we focusing on the entire proposal or specific aspects of the techniques? Because there’s a lot there, and I think we need to prioritize.\n\nHyejin Wang: Good point, Alejandro. Let’s zoom in on the core components: the layer-wise fine-tuning and the modular regularization steps. The rest we can table for later discussions if needed.\n\nTanvi Sharma: Hyejin, before we dive in, I just want to flag—I’m still seeing inconsistencies in the annotated dataset. If we don’t address those, we risk introducing bias into any post-training techniques we adopt. Should this be a blocker?\n\nFelipe Ribeiro: Sorry to interrupt, but the dataset issue is being handled. The senior data scientist proposed a methodology yesterday that we’re testing as we speak. Can we stay focused on the techniques for now?\n\nTanvi Sharma: Sure, but just to be clear, any conclusions we draw today might need revisiting once the dataset is fixed.\n\nHyejin Wang: Noted, Tanvi. Let’s keep that in mind as a caveat. Now, Alejandro, I know you had strong opinions about the layer-wise fine-tuning approach. Can you kick us off?\n\nAlejandro Rendón: Right. So, my main concern is scalability. Layer-wise fine-tuning is computationally expensive, especially with the size of our current models. We’re already running into GPU bottlenecks. Unless we can justify the ROI, I don’t see how we can adopt this technique without pushing back other deliverables.\n\nFelipe Ribeiro: I hear you, but the CTO’s argument was that this technique will drastically improve convergence rates, which could save us time downstream. Have we actually benchmarked this yet?\n\nHyejin Wang: Not yet. That’s one of the action items we need to assign today. But Alejandro, do you think the scalability issues could be mitigated with some optimization?\n\nAlejandro Rendón: Maybe, but it’s going to take a lot of testing. And with everything else on our plate—wait, sorry, can you hear me? I think my internet just cut out…\n\nTanvi Sharma: Yeah, we can hear you now. You were saying it’ll take a lot of testing?\n\nAlejandro Rendón: Right, yeah. It’s not just testing, though. It’s also about resources. If we dedicate GPUs to this, we’ll have to deprioritize other experiments.\n\nFelipe Ribeiro: Okay, but let’s not throw the baby out with the bathwater. What if we test it on a smaller model first? That way, we can get a sense of the trade-offs without committing all our resources upfront.\n\nTanvi Sharma: I like that idea. If we go that route, though, who’s going to own the benchmarking? Because everyone seems stretched thin already.\n\nHyejin Wang: Good question. Alejandro, since you’re already familiar with the computational challenges, would you be able to oversee the initial tests?\n\nAlejandro Rendón: I can, but I’ll need support. Maybe one of the junior engineers can help set up the pipelines.\n\nFelipe Ribeiro: Speaking of junior engineers, is everyone aware of the untested script incident from earlier today? Not to derail the conversation, but we might want to set some stricter guidelines on repo pushes before we scale anything new.\n\nTanvi Sharma: Agreed. That was a close call. Maybe we can take that offline, though? We’re veering off-topic.\n\nHyejin Wang: Yes, let’s table that for the next engineering sync. Back to the techniques—what about modular regularization? Any thoughts there?\n\nTanvi Sharma: I think it’s promising, but it feels underdeveloped. The draft plan from the CTO didn’t include enough detail on how it integrates with our current architecture. Without that, it’s hard to assess feasibility.\n\nFelipe Ribeiro: Yeah, and the CTO mentioned in the morning meeting that it’s still a work in progress. Maybe we hold off on this one until we have more clarity?\n\nHyejin Wang: That makes sense. Let’s focus on the layer-wise fine-tuning for now and revisit modular regularization once we have more information. Anything else we need to cover?\n\nAlejandro Rendón: Just one thing—can we get a timeline for when the dataset inconsistencies will be resolved? That’s going to impact everything we’re discussing here.\n\nFelipe Ribeiro: I’ll check with the senior data scientist and share an update by EOD.\n\nHyejin Wang: Great. Okay, action items: Alejandro will lead the benchmarking for layer-wise fine-tuning with support from a junior engineer. Felipe will follow up on the dataset issue and share an update. I’ll schedule a follow-up meeting next week to review the results. Anything else?\n\nTanvi Sharma: Just a reminder to keep the investor’s request for performance metrics in mind. That could influence our priorities as well.\n\nHyejin Wang: Good point. We’ll loop in the CFO on that. Thanks, everyone. Let’s adjourn here.\n\nFelipe Ribeiro: Thanks, Hyejin.\n\nTanvi Sharma: Thanks, everyone.\n\nAlejandro Rendón: Talk later. Bye!"

  title: Dataset Annotation Review
  transcript: "Tanvi Sharma: Hi everyone, let's get started. Thanks for joining on short notice. As you all know, a junior data scientist flagged inconsistencies in our annotated dataset yesterday, and it's caused us to temporarily halt model evaluation tasks. We need to figure out what's going on and come up with a plan to address these issues. Neha, can you give us a quick overview of what’s been discovered?\n\nNeha Sharma: Sure, Tanvi. So, the junior team member found that for about 15% of the dataset, the annotations don’t match the established guidelines we outlined during the initial training phase. For example, instances labeled as 'positive sentiment' clearly exhibit 'neutral sentiment' based on our criteria. It seems like this issue is concentrated in the batch annotated during the last sprint.\n\nKiril Vasilev: Sorry to interrupt, Neha. Can you clarify—are these errors systemic, or are they random? Like, is it something that could be traced back to a specific annotator or software tool?\n\nNeha Sharma: Good question, Kiril. From a preliminary check, it looks like the inconsistencies are tied to one specific annotator who misunderstood the guidelines. However, I also think the quality control process didn’t catch these issues. So, it’s both human error and a process gap.\n\nAlessandra Rossi: Can you hear me? Sorry, my audio just cut out for a second.\n\nTanvi Sharma: We can hear you now, Alessandra. Go ahead.\n\nAlessandra Rossi: Thanks. I was saying, if this is limited to one annotator, can we isolate their work and prioritize re-annotation for just that subset? Also, should we retrain that annotator or temporarily remove them from the annotation process?\n\nKiril Vasilev: I agree with Alessandra’s suggestion to isolate the affected subset. But retraining the annotator might take time. Should we consider hiring a contractor or leveraging active learning models to handle the re-annotation faster?\n\nTanvi Sharma: Great points. I think we need to weigh the trade-offs between speed and quality here. Do we have bandwidth to retrain the annotator, Neha?\n\nNeha Sharma: Not immediately, no. The training schedule is already packed, and we can’t afford further delays. Kiril’s suggestion about leveraging active learning might be worth exploring, though.\n\nAlessandra Rossi: Actually, I was just reading about a new open-source model last week—it’s supposed to handle annotation inconsistencies really well. Maybe we could integrate that into our workflow?\n\nTanvi Sharma: Hmm, I’m a bit wary of adding another tool to the mix right now. We’re already juggling too many initiatives. Let’s table that idea for now, unless it’s absolutely critical.\n\nKiril Vasilev: Agreed. We don’t want to spread ourselves too thin. But could we at least run a small test with this open-source model to evaluate its potential?\n\nTanvi Sharma: Okay, let’s take this offline. Kiril, Alessandra, maybe you two can sync up after this to explore that option in more detail.\n\nNeha Sharma: Another thing—I think we also need to review the quality control workflow itself. If this slipped through once, it could happen again.\n\nAlessandra Rossi: Totally agree. Maybe we need to add a second layer of validation for annotations, at least temporarily?\n\nTanvi Sharma: Good idea. Let’s add that to the action items.\n\nKiril Vasilev: Sorry, just a quick tangent. Did anyone review the CTO’s draft plan for integrating those post-training techniques? I think some of those might overlap with what we’re discussing here.\n\nTanvi Sharma: That’s outside the scope of this meeting, Kiril. Let’s stay focused on the annotation issues for now.\n\nKiril Vasilev: Got it. Sorry about that.\n\nTanvi Sharma: No worries. Okay, let’s summarize the action items. First, Neha will isolate the affected subset of the dataset and flag it for re-annotation. Second, Alessandra and Kiril will explore the open-source model offline and report back. Third, we’ll implement a temporary second layer of validation for annotations. Anything else?\n\nNeha Sharma: I think that covers it for now.\n\nAlessandra Rossi: Agreed.\n\nKiril Vasilev: Same here.\n\nTanvi Sharma: Great. Thanks, everyone. Let’s regroup early next week to check on progress. Meeting adjourned."

  title: Dataset Inconsistencies Brainstorming
  transcript: "Hyejin Wang: Hi everyone, thanks for joining on such short notice. Let's dive right in. We're here to brainstorm solutions for the inconsistencies flagged in the annotated dataset. Felipe, I know you've been looking into this. Can you start us off?\nFelipe Ribeiro: Sure, Hyejin. So, after the senior data scientist flagged the issue, I took a closer look. It seems like the problem stems from overlapping annotations—different annotators interpreted the guidelines inconsistently. This is causing major discrepancies in the model evaluation metrics.\nAlessandra Rossi: Wait, Felipe, are we talking about semantic overlap or outright mislabeling here? Because those would need completely different solutions.\nFelipe Ribeiro: Good question, Alessandra. Mostly semantic overlap, but there are a few instances of outright mislabeling. I’d estimate about 10% falls into the latter category.\nKatya Petrov: Sorry to interrupt, but can you clarify—are these inconsistencies concentrated in a specific subset of the dataset, or are they scattered across multiple categories?\nFelipe Ribeiro: Scattered, but there’s a heavier concentration in categories with more subjective definitions. For example, the 'neutral sentiment' label seems to be a recurring pain point.\nHyejin Wang: Interesting. So, one potential solution could be revisiting the annotation guidelines. Tightening them up might reduce subjective interpretation. But that might also slow down the annotation process.\nAlessandra Rossi: Could we consider automated consistency checks? Maybe a secondary model that flags annotations that seem out of line with the majority?\nKatya Petrov: I like that idea, Alessandra. But wouldn’t implementing those checks require retraining a model based on the same flawed dataset? We might be stuck in a loop here.\nFelipe Ribeiro: True, but if we can isolate a high-confidence subset of the dataset, we could use that to bootstrap the secondary model. It wouldn’t be perfect, but it might still help.\nHyejin Wang: Hmm, okay. Let’s park that idea for a second. Another option is running a pilot with a different group of annotators to cross-check the ambiguous labels. Could be costly, though.\nAlessandra Rossi: Costly and time-consuming. We’re already stretched thin with the investors breathing down our necks. I mean, didn’t the CFO say yesterday they want additional performance metrics by next week?\nKatya Petrov: Yeah, and don’t forget the CTO’s revised integration plan. We’re juggling too many priorities right now.\nFelipe Ribeiro: Speaking of which, I wanted to bring up something related. The alternative methodology proposed yesterday—I started running some tests on it late last night. There might be scalability issues if we try applying it across the entire dataset.\nHyejin Wang: Scalability issues? That’s concerning. Can you elaborate?\nFelipe Ribeiro: Sure. The methodology relies on a heuristic that doesn’t generalize well to larger datasets. It works fine for small subsets, but as soon as I scaled up, the processing time ballooned.\nAlessandra Rossi: Ugh, that’s frustrating. So, we’re back to square one?\nKatya Petrov: Not necessarily. Could we adapt the heuristic to prioritize high-impact categories first? That might make it more feasible to scale incrementally.\nFelipe Ribeiro: That’s a possibility. I’ll need to test that idea more thoroughly, though.\nHyejin Wang: Okay, we’re veering a bit off-topic. Let’s refocus on immediate next steps. Felipe, can you draft a summary of the heuristic limitations and share it with the team by tomorrow?\nFelipe Ribeiro: Sure, I’ll get that done.\nAlessandra Rossi: And what about the annotation guidelines? Should we take this offline and set up a separate meeting to revise them?\nHyejin Wang: Yeah, good idea. I’ll schedule a follow-up for early next week. For now, let’s stick with identifying quick wins. Katya, can you explore the feasibility of running automated consistency checks and report back?\nKatya Petrov: Absolutely. I’ll have something ready by Friday.\nHyejin Wang: Perfect. Anything else we need to address before wrapping up?\nAlessandra Rossi: Just one thing—can we get clarity on whether the investors are expecting these updated metrics to reflect fixes to the dataset? That might affect how we prioritize.\nHyejin Wang: Good point. I’ll check with the CFO later today and circulate an update. Alright, I think that’s enough for now. Thanks, everyone.\nFelipe Ribeiro: Thanks, Hyejin. Bye, everyone.\nAlessandra Rossi: Bye.\nKatya Petrov: Bye."

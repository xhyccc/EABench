  transcript: "Tanvi Sharma: Hi everyone, thanks for joining on such short notice. Let's dive right into it since we only have an hour. The main agenda today is to review and finalize the alternative methodology proposed by Neha to address the dataset annotation inconsistencies.\n\nFelipe Ribeiro: Sounds good. Before we start, can everyone hear me okay? I’ve been having some network issues.\n\nKatya Petrov: Yep, you’re good, Felipe.\n\nAlessandra Rossi: Loud and clear.\n\nNeha Sharma: Same here.\n\nTanvi Sharma: Great, let’s get started. Neha, could you give us a quick recap of your proposal for those who weren’t on the earlier call?\n\nNeha Sharma: Absolutely. So, the core problem is that the annotations in our dataset are inconsistent, especially around edge cases for certain categories. My proposal is to introduce a two-step reconciliation process. First, we identify the inconsistencies using a pre-trained QA model to flag disagreements between annotators. Then, instead of re-annotating the entire dataset, we only focus on the flagged samples and run them through a consensus-building process involving a diverse set of annotators.\n\nFelipe Ribeiro: Hmm, when you say 'diverse set of annotators,' are we talking about bringing in new annotators or re-training the current team?\n\nNeha Sharma: Good question. I was thinking we could train a subset of our existing team on how to handle these edge cases, but I’m open to the idea of supplementing with external annotators if needed.\n\nAlessandra Rossi: That makes sense, but how would we handle scalability? I mean, what happens if this process takes too long? We’ve got model evaluation tasks piling up.\n\nNeha Sharma: Right, scalability is a concern. But the idea is to address this as a one-off cleanup effort. Once we fix these inconsistencies, future annotation tasks will follow stricter guidelines to prevent this from happening again.\n\nKatya Petrov: I like the proposal—it’s methodical. But I still have concerns about the QA model flagging process. What’s the accuracy threshold we’re aiming for here? If the QA model isn’t robust enough, we might miss some inconsistencies.\n\nNeha Sharma: That’s valid, Katya. I ran some preliminary tests, and the QA model flagged about 85% of the inconsistencies that I manually identified. It’s not perfect, but it’s a good starting point. We can fine-tune it further if needed.\n\nFelipe Ribeiro: Can I jump in? Sorry to interrupt, but wouldn’t it make sense to crowdsource some of the flagged samples to get faster feedback? I know it’s not always ideal, but it could save us time.\n\nTanvi Sharma: That’s an interesting idea, Felipe. But then we’d have to vet the quality of the crowdsourced annotations, and that’s a whole different challenge.\n\nAlessandra Rossi: Yeah, I agree with Tanvi. We’ve tried crowdsourcing before, and the results were mixed at best. It could end up creating more inconsistency.\n\nKatya Petrov: Can we maybe pilot this methodology on a smaller subset of the data first? If it works well, then we scale it up. That way, we’re not committing to a full overhaul right away.\n\nTanvi Sharma: That’s a good compromise. Neha, do you think a pilot would be feasible?\n\nNeha Sharma: Definitely. I can put together a smaller dataset with a mix of easy and challenging edge cases. We can test the QA model and the reconciliation process on that.\n\nFelipe Ribeiro: Awesome. And could we also document the edge cases we encounter during the pilot? That could help us refine the annotation guidelines.\n\nNeha Sharma: Yes, that’s actually part of the plan. I’ll include that in the documentation process.\n\nAlessandra Rossi: I know this is slightly off-topic, but does anyone know the timeline for when we can resume model evaluation? The annotation issues have put a lot of our experiments on hold.\n\nTanvi Sharma: Good point, Alessandra. Let’s take that offline. I’ll sync with the engineering team and provide an update tomorrow. For now, let’s stay focused on the methodology.\n\nKatya Petrov: Sorry, quick question before we move on. Neha, do we have the budget for bringing in external annotators if we decide to go that route?\n\nTanvi Sharma: I actually spoke with the CFO earlier today. Budget is tight right now because of the delays in the A+-round funding, so we’d need a compelling case to justify additional spending. Let’s explore internal resources first.\n\nFelipe Ribeiro: Understood. By the way, I think we’re running short on time. Do we have clear action items to wrap this up?\n\nTanvi Sharma: Yes, let’s summarize. Neha will prepare a pilot dataset and test the proposed methodology. Felipe and Alessandra, can you assist Neha with QA model fine-tuning and documentation? Katya, can you draft a set of revised annotation guidelines based on the pilot results?\n\nKatya Petrov: Sure thing.\n\nFelipe Ribeiro: No problem.\n\nAlessandra Rossi: I’m on it.\n\nTanvi Sharma: Great. Let’s aim to reconvene next week to review the pilot results. Thanks, everyone. Meeting adjourned.\n\nNeha Sharma: Thanks, everyone!\n\nKatya Petrov: Bye!\n\nFelipe Ribeiro: See you all next week.\n\nAlessandra Rossi: Bye!"

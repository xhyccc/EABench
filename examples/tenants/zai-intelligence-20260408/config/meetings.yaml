  title: HR Town Hall
  transcript: "Mateo Carvalho: Hi everyone, thanks for joining today's HR Town Hall. I know there’s been some confusion and frustration around the 'no-meeting' policy, so we want to address that directly today. Let’s get started. Can everyone hear me okay?\n\nLiang Zhao: Yeah, I can hear you. Thanks, Mateo.\n\nLina Matsuda: Same here, all good.\n\nAdele LeBlanc: Uh, sorry, just a second. I think my audio isn’t working… okay, got it. I’m here now.\n\nMateo Carvalho: Great, thanks, Adele. So, as you all know, the 'no-meeting' policy was implemented to give everyone more focus time and reduce burnout, but the feedback we’ve received suggests it’s causing more confusion than clarity. Mariam, can you give us a quick overview of the feedback from the survey?\n\nMariam Abdelaziz: Sure, Mateo. So, from the survey responses, about 65% of employees said they’re unclear on when meetings are allowed and when they’re not. A lot of people pointed out that the memo we sent contradicted earlier guidance, which added to the confusion. And, uh, there were several complaints about overlapping rescheduled meetings—like this one, actually. Employees feel like the policy isn’t being enforced consistently across teams.\n\nTakumi Sato: Right, and I’ve heard similar concerns from my team. They’re asking, if we can’t have meetings, how do we collaborate effectively on cross-functional projects? Slack and emails only go so far, you know?\n\nLina Matsuda: Exactly. I’ve also had people say they’re spending *more* time chasing down information asynchronously, which is ironically eating into their focus time. It’s kind of defeating the purpose.\n\nMateo Carvalho: Yeah, I hear you. I think part of the issue is that we didn’t define clear exceptions to the policy. For example, project kickoffs or urgent debugging sessions—those probably still need to happen as meetings. But we didn’t explicitly say that, so now there’s this blanket confusion.\n\nLiang Zhao: And let’s not forget that some teams, like engineering and data science, are under a lot of pressure right now with the open-source model integration and the benchmark dataset demo. They’ve been scrambling to meet deadlines, and removing meetings has made it harder for them to align.\n\nAdele LeBlanc: If I can jump in here—oh, sorry, Mateo, were you about to say something?\n\nMateo Carvalho: No, go ahead, Adele.\n\nAdele LeBlanc: Thanks. I was going to say, a lot of the frustration also seems to come from a lack of consistency. Some managers are enforcing the policy strictly, while others are basically ignoring it. If we’re not aligned at the leadership level, how can we expect employees to follow the policy?\n\nMariam Abdelaziz: That’s a great point, Adele. We need to get everyone on the same page. Maybe we should create a short FAQ or a decision tree to help managers and teams understand when a meeting is appropriate and when it’s not.\n\nLina Matsuda: I like that idea. Something visual and easy to follow could help clear up the gray areas.\n\nTakumi Sato: Agreed. But we also need to acknowledge that this policy might not work for every team. Maybe we need to allow some flexibility based on the nature of their work.\n\nLiang Zhao: Flexibility is important, but we also need guardrails. Otherwise, it just becomes chaos. Can we set some baseline rules, like no recurring status meetings but allow ad hoc problem-solving sessions?\n\nMateo Carvalho: That’s a good suggestion. How about this: we put together a clear framework that outlines the types of meetings that are allowed, the ones that aren’t, and some best practices for asynchronous communication. We can circulate that to all managers for feedback before rolling it out officially.\n\nAdele LeBlanc: Sounds like a plan. Oh, and one more thing—can we address the scheduling conflicts? People are really frustrated about meetings being moved around multiple times.\n\nMateo Carvalho: Absolutely. We’ll include some guidelines for scheduling and rescheduling meetings to minimize disruptions. Okay, I think we’re making progress here. Any final thoughts before we wrap up?\n\nLina Matsuda: Just one quick thing—I know we’re focusing on the policy itself, but can we also look into providing training or resources on better async communication? It’s a new skill for a lot of people.\n\nMariam Abdelaziz: Great point, Lina. I’ll take that as an action item to explore what kind of training we can offer.\n\nMateo Carvalho: Perfect. So, to summarize, we’ll: 1) Develop a clear framework for the 'no-meeting' policy, including exceptions and best practices, 2) Address scheduling conflicts with specific guidelines, and 3) Explore training resources for asynchronous communication. Thanks, everyone, for your input. We’ll follow up with a draft framework by next week. Let’s take it offline if there are any other issues. Have a great rest of your day.\n\nTakumi Sato: Thanks, Mateo. Bye, everyone.\n\nLiang Zhao: Bye!\n\nAdele LeBlanc: Bye, see you all.\n\nLina Matsuda: Take care!"

  start_time: 2026-03-29T11:30:00Z
  title: Employee Survey Feedback Analysis
  transcript: "Mateo Carvalho: Hi everyone, thanks for joining today. Let's get started. As you know, the agenda is to analyze the initial responses to the employee survey about the no-meeting policy. It seems there’s been some confusion and dissatisfaction reported. Before we dive in, can everyone hear me okay?\n\nHyejin Wang: Yes, I can hear you, Mateo.\n\nJulia Rodriguez: Same here.\n\nMahmoud Baddour: Yep, loud and clear.\n\nHanh Nguyen: Yes, I’m good.\n\nAisha Suleiman: I had to reconnect earlier, but I’m good now.\n\nMateo Carvalho: Alright, great. So, I had a chance to skim through the preliminary survey responses HR shared. Frankly, the feedback seems more critical than I expected. It looks like a lot of people are struggling to adapt to the policy. Hyejin, you’ve been involved in the rollout—can you give us a quick summary of the key issues that have surfaced?\n\nHyejin Wang: Sure. From what I can see, the major concerns are around lack of clarity in communication and inconsistent implementation across teams. Some employees feel lost without the usual checkpoints that meetings provided, and others are unsure about how to escalate blockers effectively without a formal structure. We also saw comments suggesting that some teams are still holding meetings informally, which creates a sense of unfairness.\n\nJulia Rodriguez: I’d like to add to that. I’ve heard similar things from my team. The no-meeting policy was supposed to free up time, but now people are spending more of their day on Slack or email trying to coordinate. It’s… chaotic.\n\nMahmoud Baddour: Totally agree with Julia. I’ve even seen cases where the lack of meetings has led to duplicated efforts because people aren’t aligned. Honestly, it feels like we swung too far in the other direction.\n\nHanh Nguyen: Can I jump in here?\n\nMateo Carvalho: Go ahead, Hanh.\n\nHanh Nguyen: Thanks. I’m hearing a lot of frustration around decision-making. Without meetings, there’s no clear way to get quick approvals or hash out complex issues. It’s like everyone is stuck waiting for asynchronous responses, which slows everything down.\n\nAisha Suleiman: I’d like to piggyback off that. One of the survey comments that stood out to me was someone saying they “miss the human element.” I think the no-meeting policy unintentionally removed some of the collaboration and camaraderie that came with face-to-face discussions, even if they were virtual.\n\nJulia Rodriguez: That’s a good point, Aisha. We’ve been so focused on productivity and efficiency that we might’ve overlooked the social benefits of meetings.\n\nMateo Carvalho: All valid points. I think we need to revisit the policy and find a middle ground. Maybe we don’t need to eliminate meetings entirely, but we should focus on making them more purposeful and time-efficient. Hyejin, any thoughts on that?\n\nHyejin Wang: I agree, Mateo. In fact, HR has been exploring the idea of “meeting-free blocks” instead of a blanket no-meeting policy. For example, reserving certain hours or days where meetings are discouraged but not outright banned. This could give teams the flexibility to schedule when it’s truly necessary while still protecting focus time.\n\nMahmoud Baddour: I like that idea. It’s less rigid and allows for adaptability. But we’ll need to be really clear about expectations—otherwise, people might abuse the flexibility.\n\nMateo Carvalho: Absolutely. Clear guidelines will be key. Maybe we can draft a set of best practices for scheduling and conducting meetings, like limiting them to 30 minutes or having a clear agenda. Julia, would you be willing to help with that?\n\nJulia Rodriguez: Sure, I can start putting something together. I’ll need input from everyone though, so I’ll set up a shared doc.\n\nAisha Suleiman: Can I just say, we should also address the fairness issue Hyejin mentioned? If some teams are bypassing the policy, it’s going to undermine whatever changes we make. Maybe we need to loop in managers to ensure consistency.\n\nHanh Nguyen: Agreed. And can we also think about tools? A lot of the frustration seems to come from relying too much on Slack and email. Maybe we can look into better collaboration tools or training to use them effectively.\n\nMateo Carvalho: Good point, Hanh. Let’s put a pin in that for now and revisit it once we have a clearer picture of the policy changes. Speaking of which, do we have a timeline for when HR will share the full survey results?\n\nHyejin Wang: We’re expecting the final report by early next week, but I can share a more detailed summary of the preliminary findings by tomorrow if that helps.\n\nMateo Carvalho: That would be great. Okay, let’s wrap this up with some action items. Julia will draft best practices for meetings, Hyejin will share the preliminary findings tomorrow, and I’ll coordinate with HR to finalize adjustments to the policy. Does that cover everything?\n\nMahmoud Baddour: I think so.\n\nHanh Nguyen: Works for me.\n\nAisha Suleiman: Same here.\n\nJulia Rodriguez: Got it.\n\nMateo Carvalho: Alright then, thanks everyone for your input. Let’s aim to regroup once we have the full survey results. Meeting adjourned.\n\n[End of Transcript]"

  transcript: "Mariam Hamed: Hi everyone, thanks for joining today’s HR Policy Feedback Session. I know the 'no-meeting' policy rollout has been a bit rocky, so we’re here to address your feedback and clarify next steps. Let’s get started. Can everyone hear me?\n\nHanh Nguyen: Yes, I can hear you.\n\nKwame Williams: Yep, all good.\n\nAisha Suleiman: Same here.\n\nNia Kabongo: Loud and clear.\n\nMariam Hamed: Great. So, first off, I want to acknowledge the feedback we’ve received through the survey. A lot of you mentioned confusion about how the policy applies to cross-functional teams and recurring syncs. Before I dive into those details, does anyone want to share their initial thoughts?\n\nKwame Williams: Yeah, I’ll start. Honestly, the policy sounded great in theory—less time in meetings, more time to focus. But in practice, it’s been tricky. For example, our engineering stand-ups technically fall under the ‘no-meeting’ hours, so we’ve had to reschedule them multiple times. It’s kind of counterproductive.\n\nHanh Nguyen: Same here. My team tried to move everything to Slack, but it’s honestly just created more confusion. Now we spend more time clarifying things asynchronously than we ever did in meetings.\n\nMariam Hamed: That’s really helpful feedback, Hanh and Kwame. The policy was meant to empower teams to find what works best for them, but it sounds like we need clearer guidelines. Aisha, I saw your survey response mentioned something about client calls. Can you elaborate?\n\nAisha Suleiman: Sure. So, a lot of my work involves external stakeholders, and they don’t really care about our ‘no-meeting’ hours. I’ve had to schedule client calls during those periods, and then I feel like I’m breaking the rules. It’s been frustrating.\n\nNia Kabongo: I agree with Aisha. I’ve also felt like we’re being set up to fail. The policy feels like it’s designed for internal teams, but it doesn’t account for roles like mine where external-facing work is the norm.\n\nMariam Hamed: Got it. That’s a really important point, and it’s something we’ll definitely need to address. *[pauses]* Sorry, I think someone’s unmuted—can everyone hear me okay?\n\nHanh Nguyen: Yeah, you’re cutting in and out a bit.\n\nMariam Hamed: Oh, sorry about that. Let me adjust my mic. *[brief pause]* Is that better?\n\nHanh Nguyen: Much better, thanks.\n\nMariam Hamed: Perfect. So, just to recap, we’ve heard concerns about scheduling conflicts, unclear guidelines for client-facing roles, and the challenges of moving to asynchronous communication. Does anyone else want to add to this?\n\nKwame Williams: I actually have a quick question. Are there any plans to provide training or best practices for working asynchronously? Because right now, it feels like we’re all just figuring it out as we go.\n\nMariam Hamed: That’s a great point, Kwame. We’re planning to roll out some resources and workshops later this quarter, but I’ll take an action item to prioritize that sooner. Nia, you had your hand raised?\n\nNia Kabongo: Yeah, thanks. I just wanted to say that while the policy has its flaws, I do appreciate the intent behind it. I’ve noticed that people are more mindful about scheduling meetings, which helps. But I think the rollout was rushed, and that’s where most of the frustration is coming from.\n\nMariam Hamed: That’s a fair observation, Nia. We probably could’ve done a better job preparing teams before implementing the policy. *[pause]* Okay, let’s talk about next steps. Based on this feedback, I propose we:\n\n1. Revise the policy to explicitly address roles that require external meetings.\n2. Provide clearer guidelines for cross-functional teams.\n3. Accelerate training on asynchronous communication.\n4. Continue gathering feedback and revisit the policy in two months.\n\nDoes that sound reasonable?\n\nAisha Suleiman: Yeah, I think that’s a good start.\n\nKwame Williams: Agreed, but can we also get a clearer definition of what qualifies as an ‘essential’ meeting? That’s been a gray area.\n\nMariam Hamed: Absolutely. I’ll make sure that’s included in the updated guidelines. Any other thoughts or objections?\n\nHanh Nguyen: None from me. I think that covers it.\n\nNia Kabongo: Same here.\n\nMariam Hamed: Great. So here are the action items:\n- I’ll draft revisions to the policy and share them by next Wednesday.\n- We’ll schedule an asynchronous training workshop in two weeks.\n- And we’ll send out another survey after the revised policy is implemented to gather more feedback.\n\nAnything else before we wrap up?\n\nKwame Williams: Nope, I think we’re good.\n\nAisha Suleiman: All set.\n\nMariam Hamed: Perfect. Thanks, everyone, for your time and feedback. Let’s adjourn here. Have a great day!\n\nHanh Nguyen: Thanks, Mariam. Bye, everyone.\n\nNia Kabongo: Bye!\n\nKwame Williams: Bye.\n\nAisha Suleiman: Take care."

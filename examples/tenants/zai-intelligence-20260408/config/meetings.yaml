  - gmensah
  - hnguyen
  location: HR Office
  organizer: mhamed
  start_time: 2026-03-24T15:00:00Z
  title: Midweek 'No-Meeting' Policy Implementation
  transcript: "Mariam Hamed: Hi everyone, thanks for joining on such short notice. I know the midweek 'no-meeting' policy has created some confusion, so let's use this time to clarify how it's supposed to work and address the double-booking issues. Can everyone hear me okay?\n\nLilian Kamau: Yep, you're coming through fine. And thank you for calling this meeting, Mariam. I think we all need clarity here.\n\nGrace Mensah: Agree. I’ll be honest, my team has been struggling to figure out when this policy actually applies. Yesterday, we had three back-to-back meetings that overlapped. It was... chaotic.\n\nHanh Nguyen: Same here. We tried to honor the 'no-meeting' rule, but some teams still scheduled urgent discussions. I think everyone assumed their meeting was the exception. It's been frustrating.\n\nMariam Hamed: Totally understandable. First off, I want to clarify that the 'no-meeting' policy applies every Wednesday from 10 a.m. to 4 p.m., company-wide. The idea is to give everyone uninterrupted blocks of work time. It's not optional unless there’s an absolute emergency, which should be cleared with leadership beforehand. Does that help?\n\nLilian Kamau: It helps, but I think the ambiguity lies in what qualifies as an 'emergency.' For example, yesterday we had a meeting about a critical bug in the open-source model integration. We couldn’t delay it, but I’m not sure if that technically counted as an emergency.\n\nGrace Mensah: Same here. We had an investor call prep session. It felt urgent since the CFO needed updated projections, but it wasn’t life-or-death. Do we need to pre-clear everything like that?\n\nMariam Hamed: Good point. Let’s say anything that directly impacts external deadlines, like investor meetings or product launches, could qualify. But routine check-ins or discussions that can wait—those should absolutely be rescheduled. Does that distinction make sense?\n\nHanh Nguyen: Mostly, but what if two teams disagree on what’s urgent? That’s actually what happened yesterday. The engineering team scheduled a debugging session during our data science team’s presentation on the new annotation efficiency proposal. Both teams thought their meeting was critical.\n\nGrace Mensah: Oh, that was us. Sorry about that, Hanh. We genuinely thought we’d resolved the scheduling issue. Clearly, we didn’t.\n\nHanh Nguyen: No hard feelings, Grace. But it does highlight the need for better coordination.\n\nMariam Hamed: Absolutely. Moving forward, I recommend a shared calendar where teams can flag critical meetings in advance. That way, we can avoid overlaps and ensure everyone is on the same page. Lilian, do you think the ops team can help set that up?\n\nLilian Kamau: Definitely. I’ll coordinate with IT and get something up by the end of the week. We can call it the 'Critical Meetings Calendar' or something similar.\n\nMariam Hamed: Perfect. Another thing—please make sure team leads communicate the 'no-meeting' hours clearly to their teams. We can’t assume everyone reads every email from HR.\n\nGrace Mensah: Speaking of communication, Mariam, have we considered adding a Slack channel for real-time updates on meeting conflicts? It could make it easier to resolve issues quickly.\n\nHanh Nguyen: I like that idea. We could call it #meeting-coordination or something straightforward.\n\nMariam Hamed: Good suggestion. Let’s implement both the shared calendar and the Slack channel. Lilian, can you own the calendar setup? Grace, could your team set up the Slack channel?\n\nLilian Kamau: Yep, I’ll handle the calendar.\n\nGrace Mensah: Sure, I’ll get the Slack channel up and running by the end of the day.\n\nMariam Hamed: Great. Before we wrap up, any other concerns about the policy?\n\nHanh Nguyen: Just one. Can we address how to handle situations where meetings absolutely have to happen during 'no-meeting' hours? Should there be a formal process?\n\nMariam Hamed: Good point. How about this—if an emergency meeting needs to happen, the organizer must email HR and the affected teams explaining why it’s urgent. HR can keep a record and step in if needed. Does that work?\n\nGrace Mensah: Works for me.\n\nHanh Nguyen: Agreed.\n\nLilian Kamau: Same here.\n\nMariam Hamed: Perfect. So, to summarize: 1) 'No-meeting' hours are Wednesdays from 10 a.m. to 4 p.m., non-negotiable unless there’s an emergency. 2) We’ll set up a shared calendar and a Slack channel for better coordination. 3) For emergency meetings, organizers must notify HR and affected teams in advance. Lilian and Grace, you’ll handle the action items for the calendar and Slack channel. Anything else?\n\nGrace Mensah: I think that covers it.\n\nHanh Nguyen: Yep, we’re good.\n\nLilian Kamau: All clear. Thanks, Mariam.\n\nMariam Hamed: Thanks, everyone. Let’s reconnect next week to see how these changes are working. Meeting adjourned."

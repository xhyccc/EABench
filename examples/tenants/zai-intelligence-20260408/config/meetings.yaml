  title: HR Town Hall
  transcript: "Mateo Carvalho: Good afternoon, everyone. I think we’re all here now. Before we dive into today’s HR Town Hall, can I confirm that everyone can hear me?\n\nHyejin Wang: Yes, I can hear you.\n\nJulia Rodriguez: Loud and clear, Mateo.\n\nTanvi Sharma: Same here.\n\nMateo Carvalho: Great. So, as you all know, this meeting has been scheduled to address some of the confusion and dissatisfaction surrounding the recently introduced 'no-meeting' policy. The goal is to clarify its purpose and implementation, as well as address any concerns you might have. Before we begin, I want to acknowledge that we’re aware of the scheduling conflicts caused by this meeting—it’s ironic, I know. That’s something we’ll address as well. Let’s start with a quick overview.\n\nAlejandro Rendón: Sorry to interrupt, Mateo, but I just want to say I’m still not entirely sure why we even needed this policy in the first place. It feels like it’s created more problems than it’s solved.\n\nMateo Carvalho: Thanks for bringing that up, Alejandro. The policy was introduced in response to widespread feedback about meeting fatigue and the need for more focused work time. The idea was to block certain hours during the week for uninterrupted deep work. That said, implementation hasn’t been as smooth as we hoped. Let me pass the mic to Lilian, who can provide more context.\n\nLilian Kamau: Thanks, Mateo. So, the intention was to address burnout and improve productivity by reducing unnecessary meetings. We’ve seen this approach work in other organizations. However, we didn’t anticipate the level of confusion it would cause—especially with project teams needing to coordinate more frequently. We’re here to figure out how to make this policy work better for everyone.\n\nChidinma Okonkwo: I get the intention, but the execution has been chaotic. For example, I had a critical meeting canceled last week because it fell into the 'no-meeting' block, and we ended up losing two days of progress. How are we supposed to handle situations like that?\n\nHyejin Wang: Same here. My team has been struggling to find time to align, and it feels like we’re spending more time navigating the policy than actually working.\n\nMateo Carvalho: That’s valid feedback. Julia, I know you’ve been collecting input from various teams. Can you share what you’ve heard?\n\nJulia Rodriguez: Of course. The main issues seem to boil down to three things: first, the lack of clarity on which meetings are considered 'essential'; second, the inconsistency in how different teams are applying the policy; and third, the overlap with deadlines, which makes it hard to stick to the no-meeting blocks. One suggestion I’ve heard is to make exceptions for project-critical discussions, but that creates its own set of challenges.\n\nFelipe Ribeiro: If I can jump in, I think part of the problem is that we didn’t set clear guidelines upfront. Are client calls exempt? What about cross-departmental syncs? There’s too much ambiguity.\n\nNeha Sharma: And to add to that, what about emergencies? We had a technical issue last week that required immediate attention, but half the team was unavailable because it was during a no-meeting period. It’s not practical.\n\nMateo Carvalho: These are all excellent points. To address some of the ambiguity, we’re working on drafting a clearer set of guidelines. Lilian, can you share an update on that?\n\nLilian Kamau: Sure. We’re creating a document that outlines which types of meetings are exempt from the policy and provides examples of how teams can plan around the no-meeting blocks. We’ll also include a process for requesting exceptions when necessary. It’s still a work in progress, but we aim to have it ready by the end of next week.\n\nZainab Okonkwo: That’s good to hear, but I think we also need to communicate this policy better. I found out about it through a Slack thread, and by then, it had already caused issues for my team. Can we ensure announcements like this are more centralized in the future?\n\nMateo Carvalho: Absolutely, Zainab. Communication has clearly been a weak point here. We’ll make sure future updates are communicated through official channels like email and the company intranet.\n\nCarla Gomez: Sorry, quick question—will there be any flexibility for teams working across time zones? My team is spread out, and the no-meeting blocks don’t align well with everyone’s schedules.\n\nMateo Carvalho: That’s a great question, Carla. Flexibility is something we’ll need to incorporate. Let’s take that as an action item to address in the updated guidelines.\n\nKwame Williams: If I may, I think we’re focusing too much on the negatives. Has anyone seen any benefits from the policy so far? I’ve actually found the no-meeting blocks helpful for getting through my backlog of tasks.\n\nAmara Chukwuma: I agree with Kwame. It’s been a bit chaotic, but when it works, it really does help with deep work. Maybe we just need more time to adapt.\n\nRohan Patel: I see your point, but the transition has been rough. Maybe we should pilot the policy with a smaller group first before rolling it out company-wide. That would give us a chance to work out the kinks.\n\nMateo Carvalho: That’s an interesting idea, Rohan. Let’s discuss that further offline. For now, I’d like to wrap up with some clear next steps. Here’s what we’ll do:\n\n1. Finalize and distribute the updated guidelines for the no-meeting policy by next week.\n2. Improve communication channels for policy announcements.\n3. Explore flexibility options for teams in different time zones.\n4. Consider piloting the policy with a smaller group before full implementation.\n5. Gather additional feedback through a follow-up survey in two weeks.\n\nMateo Carvalho: Does anyone have anything else to add before we close?\n\nHyejin Wang: Just one thing—can we schedule a follow-up meeting to review how the updated policy is working?\n\nMateo Carvalho: Good idea, Hyejin. We’ll schedule a follow-up in three weeks to review progress. Thank you, everyone, for your input today. I know this hasn’t been an easy transition, but we appreciate your patience and feedback. Meeting adjourned."

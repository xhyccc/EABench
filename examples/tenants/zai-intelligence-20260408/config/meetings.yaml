  title: Follow-Up Town Hall on 'No-Meeting' Policy
  transcript: "Mateo Carvalho: Alright, thanks everyone for joining. I know the timing isn’t ideal, but HR felt it was important to address the confusion surrounding the 'no-meeting' policy. Let’s try to keep this short and focused.\n\nJulia Rodriguez: Hi, Mateo. Can you hear me okay? I’ve been having connection issues all morning.\n\nMateo Carvalho: Yes, Julia, loud and clear. Thanks for flagging that. Hyejin, are you on?\n\nHyejin Wang: Yes, I’m here. Sorry, I just wrapped up the dataset review meeting, ran a bit late.\n\nMateo Carvalho: No problem. So, let’s dive into it. First off, the 'no-meeting' policy was introduced to give everyone more uninterrupted blocks of time to work on critical tasks. But clearly, the rollout wasn’t smooth, and we’ve heard your concerns. Julia, do you want to start?\n\nJulia Rodriguez: Sure. Look, I understand the intention behind the policy, but the execution has been chaotic. We had overlapping deadlines, and then HR throws a town hall right in the middle of all that? It’s like we’re creating more problems instead of solving them.\n\nMateo Carvalho: I hear you. The timing of this town hall was definitely not ideal. That’s on us. Hyejin, what’s your perspective?\n\nHyejin Wang: Honestly, the confusion stems from mixed messaging. The policy memo said one thing, then the clarification contradicted it. Are we supposed to avoid meetings entirely, or just keep them under a certain threshold? No one seems to know.\n\nJulia Rodriguez: Exactly. And when meetings do happen, they’re either rushed or get rescheduled multiple times, which only adds to the frustration.\n\nMateo Carvalho: Got it. So, the core issue is clarity and scheduling conflicts. Let me address the first part—HR’s intent was to eliminate non-essential meetings, not all meetings altogether. For example, brainstorming sessions and project sync-ups should still happen, but they should be concise and well-structured. Does that help?\n\nJulia Rodriguez: It helps, but it’s hard to implement when everyone’s interpretation is different. Some teams are canceling all meetings, while others are cramming everything into one day. It’s inconsistent.\n\nHyejin Wang: And to add to that, the policy doesn’t account for cross-team collaboration. My team had to delay debugging tasks because we couldn’t get time with the engineering team for a critical discussion.\n\nMateo Carvalho: That’s a valid point. Cross-team collaboration was supposed to be exempt from the 'no-meeting' rule, but it sounds like that wasn’t communicated clearly. We’ll need to revisit how exceptions are handled.\n\nJulia Rodriguez: Another thing—employee burnout is already high. This policy feels like it’s adding pressure instead of relieving it. People are scrambling to adjust workflows and still meet deadlines.\n\nHyejin Wang: Agreed. And the survey results HR shared yesterday showed pretty widespread dissatisfaction. I think we need to address that more directly.\n\nMateo Carvalho: Understood. Let’s take a step back. If we were to revise the policy, what changes would make it more effective?\n\nJulia Rodriguez: For starters, clearer guidelines. Define what counts as a ‘necessary’ meeting versus a ‘non-essential’ one. Maybe even provide examples.\n\nHyejin Wang: I’d also suggest setting fixed windows for meetings. Like, designate certain days or hours where meetings are allowed, so people can plan around them.\n\nMateo Carvalho: Those are good suggestions. What about feedback loops? Should we have a regular cadence for reviewing how the policy is working?\n\nJulia Rodriguez: Yes, definitely. Maybe quarterly reviews with anonymous feedback, so we can adjust as needed.\n\nHyejin Wang: And one more thing—training for managers. Some of them aren’t great at running efficient meetings, which is part of why people feel they’re a waste of time.\n\nMateo Carvalho: Great points. Okay, here’s what we’ll do. First, HR will draft a revised policy with clearer guidelines and examples. Second, we’ll implement fixed meeting windows and communicate them company-wide. Third, we’ll set up quarterly reviews to gather feedback and make adjustments. And finally, we’ll roll out training sessions for managers on running effective meetings. Anything else?\n\nJulia Rodriguez: That sounds good to me. Just make sure the rollout is handled better this time.\n\nHyejin Wang: Agreed. Also, let’s follow up offline about cross-team collaboration. I think that needs more attention.\n\nMateo Carvalho: Absolutely. I’ll schedule time with you and the engineering team to hash that out. Thanks, everyone, for your input. I know this hasn’t been easy, but we’ll make improvements. Let’s wrap up here and get back to our projects.\n\nJulia Rodriguez: Thanks, Mateo. Talk soon.\n\nHyejin Wang: Thanks, everyone. Bye!\n\nMateo Carvalho: Bye!"

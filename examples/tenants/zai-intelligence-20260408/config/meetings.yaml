  title: Investor Demo Planning Session
  transcript: "Julia Rodriguez (CFO): Alright, everyone, let’s get started. Thanks for joining on short notice. The primary agenda today is to go over the financial and operational adjustments we need to make ahead of the investor demo next week. As you all know, the pressure is mounting. I’d like us to stay focused on deliverables. Can everyone hear me okay?\n\nMariam Hamed (Product Manager): Yep, loud and clear.\n\nHanh Nguyen (Data Science Lead): Yes, I can hear you.\n\nKwame Williams (Engineering Lead): Same here. Let’s dive in.\n\nJulia Rodriguez: Great. So, before we dig into specifics, I want to acknowledge that we’re all dealing with a lot right now—tight deadlines, overlapping priorities, and some unresolved tensions. But this demo is critical. Investors need to see that we’re making progress, and we need to reassure them about our financial and operational stability. Mariam, can you kick us off with an update on the dataset demo?\n\nMariam Hamed: Sure. So, as of this morning, we’ve addressed most of the missing visualization components. However, there’s still a mislabeled subset of annotations that Hanh’s team flagged yesterday. Hanh, do you want to jump in here?\n\nHanh Nguyen: Yes, thanks, Mariam. So, the issue is that about 15% of the annotations in the demo set are either mislabeled or incomplete. This impacts the accuracy of the visualizations we’re preparing for investors. My team is working on re-labeling them manually, which is slow, but we’re also testing an optimization technique proposed by one of our junior scientists. It could speed things up, but we’re tight on time and resources.\n\nJulia Rodriguez: I see. How long are we looking at to finalize the corrections?\n\nHanh Nguyen: If we stick with manual corrections, it’s going to take us until at least Friday. The optimization technique could cut that time in half, but it’s untested at scale. Kwame, any chance your team can support us here?\n\nKwame Williams: Honestly, we’re stretched thin. We’ve just implemented a partial fix for the memory leak in the open-source model, but it introduced a latency spike in the agent training pipeline. That’s my team’s top priority right now. I can maybe spare one or two junior engineers to help, but it’s a big maybe.\n\nJulia Rodriguez: Kwame, I understand your team is under a lot of pressure, but this dataset demo is non-negotiable. We need to show progress next week.\n\nKwame Williams: I get that, Julia, but if the infrastructure isn’t stable, the demo won’t even run properly. We need to fix the latency issue first. Otherwise, we’re setting ourselves up for failure in front of investors.\n\nMariam Hamed: I see both sides here, but we can’t let perfect be the enemy of good. What if we focus on a subset of the demo that’s clean and functional? Hanh, could we isolate the corrected annotations and just use those for the demo?\n\nHanh Nguyen: That’s possible, but it would limit what we can showcase. Investors might notice the gaps.\n\nJulia Rodriguez: Mariam’s suggestion might be our best bet given the time constraints. Let’s circle back to that in a minute. I also want to address the financial side of things. The investors are asking for updated projections that account for these delays. I need input from all of you on cost estimates for the remaining work. Kwame, let’s start with you.\n\nKwame Williams: Sure. The additional debugging and testing for the memory leak fix will take at least another week. We’re looking at about $10,000 in additional engineering resources, assuming no further setbacks.\n\nHanh Nguyen: For data science, the re-labeling effort and optimization testing will cost around $7,000, mostly in overtime hours and cloud compute costs.\n\nMariam Hamed: From the product side, we’ve already spent most of our budget for this quarter. Any extra cost will need to come from reallocations or approvals from you, Julia.\n\nJulia Rodriguez: Got it. I’ll work on revising the budget and running these numbers by the investors. Let me be clear, though—we need to minimize additional costs wherever possible. Everyone needs to think about where we can cut back.\n\nKwame Williams: Julia, I hate to interrupt, but I have to ask—are we even sure this demo is worth the risk? We’re rushing to meet investor demands, but if something goes wrong, it could backfire. Should we consider delaying?\n\nJulia Rodriguez: We’ve already delayed too much. Investors are losing patience. A delay isn’t an option. We show them progress, even if it’s incremental, or we risk losing funding. Let’s stay focused.\n\nHanh Nguyen: Agreed. But if we’re rushing this, we need to manage expectations. Mariam, can we frame this demo as a 'work-in-progress' rather than a near-final product?\n\nMariam Hamed: That’s a good idea. I’ll draft some talking points for the presentation to set the right tone.\n\nJulia Rodriguez: Excellent. Let’s also take this offline—Mariam, Hanh, and I will sync on messaging after this meeting. Kwame, I’ll follow up with you separately on the infrastructure costs.\n\nKwame Williams: Sounds good. By the way, can we talk about the HR situation? The ‘no-meeting’ policy rollout has been a disaster. My team is confused about when we’re supposed to meet or not meet.\n\nJulia Rodriguez: I’ll bring that up with HR. It’s not on today’s agenda, but I hear you. Let’s table it for now.\n\nMariam Hamed: Can we also get a quick update on the investor call you had yesterday, Julia?\n\nJulia Rodriguez: Sure. The call was tense, but they approved the preliminary updates I shared. That said, they want more clarity on our roadmap. That’s why this demo is so important. It’s our chance to show them we’re making progress.\n\nHanh Nguyen: Understood. We’ll do our best to deliver.\n\nJulia Rodriguez: Alright, let’s wrap up. Action items: Hanh, focus on isolating the clean subset of annotations for the demo while testing the optimization technique. Kwame, prioritize the latency issue but see if you can spare resources to assist Hanh’s team. Mariam, draft the messaging for the demo presentation. I’ll revise the budget and follow up with investors. Any last thoughts?\n\nKwame Williams: None from me.\n\nHanh Nguyen: No, I’m good.\n\nMariam Hamed: All set here.\n\nJulia Rodriguez: Great. Thanks, everyone. Let’s regroup at the end of the week to check progress. Meeting adjourned."

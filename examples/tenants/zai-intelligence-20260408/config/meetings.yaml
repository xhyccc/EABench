  location: Data Science Lab
  organizer: fribeiro
  start_time: 2026-04-01T14:00:00Z
  title: Training Dataset Quality Control
  transcript: "Felipe Ribeiro: Hi everyone, can you all hear me?\nKatya Petrov: Yes, I can hear you. Can you hear me?\nAlessandra Rossi: Yep, loud and clear.\nFelipe Ribeiro: Great. Let’s get started. Thanks for joining on short notice. As you saw in the email, we’ve identified minor inconsistencies in the recovered training dataset. The goal today is to figure out where these are coming from and how to address them. Katya, can you give us a quick overview of what you found?\nKatya Petrov: Sure. So, during routine checks on the dataset recovery process, I noticed that a subset of the annotated data had duplicate entries. These duplicates don’t align with the original dataset structure, so it looks like an error occurred during the recovery or merging process. In addition, some annotations appear to have been mismatched—labels that don’t correspond to the data they’re attached to.\nAlessandra Rossi: Hmm, do we know how widespread this issue is?\nKatya Petrov: Not entirely. I sampled about 10% of the dataset, and there were inconsistencies in roughly 2% of that sample. So, it’s not catastrophic, but it’s enough to raise concerns about overall data integrity.\nFelipe Ribeiro: That’s not great, but it’s manageable. Do we know if this was caused by the recent data loss incident, or is it something else?\nKatya Petrov: It’s possible. The recovery process was rushed, and we didn’t have time to run a detailed verification afterward. Also, the intern who accidentally deleted part of the data might have overwritten files during the recovery. I don’t want to place blame, but that’s a potential cause.\nAlessandra Rossi: I’ll add that we’ve also been relying on semi-automated annotation tools, and those have had their own share of issues lately. Some errors might have been introduced there as well.\nFelipe Ribeiro: Right. So, we potentially have multiple sources of error here. Let’s figure out how to address this. Alessandra, do you think we should start by rerunning the recovery process or focus on verifying the current dataset?\nAlessandra Rossi: Honestly, I think rerunning the recovery process would be ideal, but it’s going to take time we don’t have, especially with the CFO breathing down our necks for the benchmark dataset demo. I’d recommend doing a targeted verification of the most critical parts of the dataset first.\nFelipe Ribeiro: Makes sense. Katya, can you prioritize the sections of the dataset that we use most frequently in our models?\nKatya Petrov: Sure, I can do that. I’ll start with the high-priority sections and flag any inconsistencies I find. But I’ll need some help—this is too much for one person to go through manually.\nAlessandra Rossi: Agreed. We could potentially use some of the junior data scientists to assist. They’ve been working on annotation cleanup lately, so they’re familiar with the data structure.\nFelipe Ribeiro: Good idea. I’ll send an email to assign a couple of them to assist you, Katya. We’ll also need to run some automated checks. Alessandra, do we have any scripts we can use for that?\nAlessandra Rossi: We do, but they’re a bit outdated. I’d suggest updating them to account for the new annotations we’ve added recently. I can take that on.\nFelipe Ribeiro: Perfect. Let’s also document everything we’re doing to address this issue. If investors ask questions, we need to show that we’re actively managing the situation. Speaking of which, has anyone heard anything from the product team about the benchmark dataset demo?\nAlessandra Rossi: Ugh, don’t get me started. Last I heard, they’re still scrambling to finalize it. Apparently, some visualization components are missing, and they’ve been trying to build them from scratch.\nKatya Petrov: Wait, are they using the same dataset we’re discussing right now?\nFelipe Ribeiro: They are. That’s why we have to move quickly on this. If we don’t clean up the inconsistencies, it could undermine the entire demo.\nKatya Petrov: Okay, so no pressure then...\nFelipe Ribeiro: (laughs) None at all. On a more serious note, let’s make sure to communicate these issues to the product team. They need to be aware of the risks.\nKatya Petrov: Got it. I’ll loop them in after this meeting.\nAlessandra Rossi: One more thing—should we take a closer look at the semi-automated annotation tool? If it’s introducing errors, we might need to rethink using it for future datasets.\nFelipe Ribeiro: Agreed. Let’s take that as a longer-term action item. For now, let’s focus on cleaning up the current dataset and ensuring the demo is solid. We can revisit the tool’s reliability once this immediate crisis is over.\nKatya Petrov: Sounds good.\nAlessandra Rossi: Agreed.\nFelipe Ribeiro: Okay, let’s summarize the action items. Katya, you’ll prioritize verifying the critical sections of the dataset and coordinate with the junior data scientists. Alessandra, you’ll update the automated scripts and keep an eye on the annotation tool. I’ll handle communication with the product team and assign additional resources where needed. Does that cover everything?\nKatya Petrov: Yep, that works for me.\nAlessandra Rossi: Same here.\nFelipe Ribeiro: Great. Let’s regroup in two days to see where we stand. Thanks, everyone. Let’s get to work.\nKatya Petrov: Thanks, Felipe. Talk soon.\nAlessandra Rossi: Bye, everyone.\nFelipe Ribeiro: Bye."
- agenda: Explore alternative solutions for scalability issues.

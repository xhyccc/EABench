  title: Data Science Progress Update
  transcript: "Tanvi Sharma: Hi everyone, thanks for joining. Let's get started. I know we're all juggling a lot right now, so I appreciate you making the time.\n\nAlessandra Rossi: Of course, Tanvi. Happy to be here, though I have to say, it's been a bit of a week already.\n\nFelipe Ribeiro: Definitely. Can everyone hear me? I’ve been having some issues with my mic.\n\nKatya Petrov: Yep, we can hear you, Felipe. Loud and clear.\n\nTanvi Sharma: Great. So our main agenda today is to discuss the recent improvements to the semi-automated annotation tool, plan next steps, and also address some of the team concerns we've been hearing. Before diving in, does anyone have anything urgent to add?\n\nNeha Sharma: Just a quick note—HR sent out that burnout survey, but I’ve already heard from a few folks on my team that they’re too swamped to even fill it out. I think we need to touch on that.\n\nTanvi Sharma: Agreed, Neha. Let’s make sure we leave time at the end to discuss employee concerns. Thanks for flagging it. First, though, let’s talk about the annotation tool. We’ve improved accuracy by 3%, which is a step forward. Alessandra, can you walk us through the changes?\n\nAlessandra Rossi: Sure thing. So, the main improvement came from tweaking the active learning algorithm we’re using. We adjusted the uncertainty sampling thresholds, and that’s where the 3% boost came from. But—and this is a big but—it came at the cost of more manual oversight, which is why the team has been putting in extra hours.\n\nFelipe Ribeiro: Right, and while the accuracy is better, I’m still seeing edge cases where it’s not catching the context correctly, especially in multi-label scenarios. Did anyone else notice that?\n\nAkiko Yamada: Yes, I did. In our legal documents dataset, it’s still misclassifying some of the clauses. It’s better, but not perfect. I wonder if we should revisit the training data for those specific edge cases.\n\nKatya Petrov: I think that’s a good idea, but we also need to be careful about how much time we’re spending on these optimizations. Investors are already breathing down our necks about timelines. Can we afford to delay further?\n\nTanvi Sharma: That’s a fair point, Katya. Let’s come back to timelines in a bit. Felipe, Akiko—what’s a realistic estimate if we focus on refining the training data?\n\nFelipe Ribeiro: Hard to say without digging in, but I’d estimate at least a week or two. We’d need to identify the problematic cases, retrain, and then validate.\n\nAkiko Yamada: Agreed, and that’s assuming we don’t hit any new issues during retraining.\n\nAlessandra Rossi: Also, just to add—if we go down this path, we’ll need to allocate more resources to annotation. The team’s already stretched thin.\n\nNeha Sharma: Which brings us back to the burnout problem. Honestly, if we don’t address this soon, we’re going to start losing people.\n\nTanvi Sharma: I hear you, Neha. Before we dive deeper into that, let’s quickly decide on the annotation tool next steps. Do we all agree that refining the training data is the priority?\n\nKatya Petrov: I’m okay with it, but only if we set strict limits on the time we spend. We can’t afford to drag this out.\n\nAlessandra Rossi: Same here. Let’s put a two-week cap on it.\n\nTanvi Sharma: Sounds reasonable. Felipe and Akiko, can you take the lead on this and provide an update by next Friday?\n\nFelipe Ribeiro: Sure, we can do that.\n\nAkiko Yamada: Yep, works for me.\n\nTanvi Sharma: Great, thank you. Now, let’s talk about the overtime issue. Neha, you mentioned earlier that people are too busy to even fill out HR's burnout survey. What are you hearing from your team?\n\nNeha Sharma: Mostly frustration. People feel like they’re constantly in firefighting mode, and there’s no time to breathe. The annotation tool improvements helped, but the manual oversight it still requires is eating up everyone’s time.\n\nKatya Petrov: This isn’t just a data science issue, by the way. Engineering is feeling it too with the open-source model debugging. We need to figure out how to balance priorities better.\n\nAlessandra Rossi: Maybe we can stagger deadlines or reassign some tasks? It feels like everything’s happening all at once.\n\nTanvi Sharma: That’s a good idea. Let’s take this offline and work with HR to come up with some actionable solutions. In the meantime, I’ll talk to leadership about potentially extending some deadlines.\n\nNeha Sharma: Thanks, Tanvi. I think that’ll help, at least in the short term.\n\nTanvi Sharma: Alright, anything else before we wrap up?\n\nFelipe Ribeiro: Just a quick note—let’s make sure we document the changes we’re making to the annotation tool. We don’t want to run into the same undocumented dependency issues engineering faced.\n\nAkiko Yamada: Good call, Felipe. I’ll make sure our updates are logged properly.\n\nTanvi Sharma: Perfect. Okay, to summarize: Felipe and Akiko will focus on refining the training data with a two-week cap. I’ll work with HR on addressing burnout and talk to leadership about deadline extensions. Alessandra, make sure the annotation tool updates are well-documented. Anything else?\n\nKatya Petrov: Nope, think that covers it.\n\nAlessandra Rossi: Same here.\n\nNeha Sharma: All good on my end.\n\nFelipe Ribeiro: Thanks, everyone.\n\nTanvi Sharma: Thanks, team. Talk soon!"

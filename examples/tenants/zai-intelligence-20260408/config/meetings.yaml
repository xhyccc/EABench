  organizer: tsharma
  start_time: 2026-03-26T13:30:00Z
  title: 'Data Science Emergency: Annotation Results Review'
  transcript: "Tanvi Sharma: Hi everyone, thanks for jumping on this last-minute call. I know this is unexpected, but as you’ve probably seen, the key investor wants to see preliminary results from the novel annotation approach by the end of the day. Let’s focus on what we can realistically pull together. Can everyone hear me okay?\n\nFelipe Ribeiro: Yep, loud and clear.\n\nKatya Petrov: Yes, I can hear you. Though, just to put it out there, this is definitely cutting it close. We’ve barely had time to test this approach.\n\nAlessandra Rossi: Agreed. I was up until 2 AM last night trying to clean up the dataset after that version control issue. We’re stretched thin here, Tanvi.\n\nTanvi Sharma: I hear you, Alessandra, and I appreciate all the extra effort you’re putting in. Let’s just focus on making the best of this. Felipe, can you walk us through what we currently have?\n\nFelipe Ribeiro: Sure. So, as of this morning, we’ve annotated about 60% of the sample dataset using the senior data scientist’s novel approach. The accuracy is sitting at roughly 92%, which is an improvement over the semi-automated tool we were using before. However, we’ve noticed some patterns where the model struggles—particularly with edge cases involving overlapping entities. Katya flagged that during her review yesterday.\n\nKatya Petrov: Right. The edge cases are definitely a problem. I ran some QA on a subset of those annotations, and the error rate jumps to about 15% for overlapping entities. If the investor asks for specifics, we’ll need to be upfront about that limitation.\n\nTanvi Sharma: Hmm. Alessandra, can we train a quick patch model to address those edge cases? Even if it’s not perfect, it might help reduce the error rate slightly.\n\nAlessandra Rossi: Maybe, but it would take at least a few hours. Plus, I’m worried about overfitting to the patch. It could skew the results we show them.\n\nFelipe Ribeiro: Can I jump in? I think we’re overcomplicating this. The investor just wants preliminary results, right? We could focus on presenting the high-level improvements and save the edge case analysis for later.\n\nKatya Petrov: I get that, Felipe, but what if they dig into the details? This is a high-stakes investor we’re talking about. I’d rather be prepared for tough questions than risk looking unprepared.\n\nTanvi Sharma: Okay, let’s take a step back. Alessandra, how much time do you need to generate a few visuals summarizing the improvements we’ve seen so far? Something that highlights the 92% accuracy and the efficiency gains from this approach?\n\nAlessandra Rossi: I can pull something together in about an hour, but someone else will need to review it for accuracy. I’m running on fumes here.\n\nTanvi Sharma: Understood. Katya, can you handle the review?\n\nKatya Petrov: Sure, but I’ll need the raw data as soon as Alessandra finishes.\n\nFelipe Ribeiro: While they’re working on that, I can start drafting some talking points for the presentation. We’ll need to frame this as a work-in-progress to manage expectations.\n\nTanvi Sharma: Good idea, Felipe. Also, let’s make sure we’re aligned on the messaging. We’ll emphasize the improvements, but we won’t shy away from mentioning the limitations. I’ll handle any curveball questions from the investor.\n\nKatya Petrov: Quick question—are we including any comparisons to the semi-automated tool? It might help contextualize the improvements.\n\nTanvi Sharma: Yes, but let’s keep it brief. Alessandra, can you add a visual comparing the accuracy of the old tool to this new approach?\n\nAlessandra Rossi: Got it. I’ll make it a side-by-side chart.\n\n[Background noise, someone typing loudly]\n\nFelipe Ribeiro: Sorry, quick interruption—can we confirm who’s compiling everything for the final deck? I don’t want things to fall through the cracks.\n\nTanvi Sharma: I’ll take care of the final deck. Just send me everything by… let’s say 3 PM? That’ll give me enough time to polish it before the meeting.\n\nKatya Petrov: Sounds good.\n\nAlessandra Rossi: Fine by me.\n\nFelipe Ribeiro: Same here.\n\nTanvi Sharma: Great. Before we wrap up—are there any blockers we haven’t addressed yet?\n\n[Silence for a moment]\n\nKatya Petrov: Not a blocker, but just a heads-up—if we’re asked to demo this live, we’ll need to clarify that this is a preliminary setup and not production-ready.\n\nTanvi Sharma: Good point, Katya. I’ll make a note to address that upfront. Anything else?\n\nFelipe Ribeiro: Nothing from me.\n\nAlessandra Rossi: I’m good.\n\nTanvi Sharma: Alright. Let’s stick to the timeline—Alessandra, visuals in an hour, Katya, review right after, Felipe, draft talking points by 3 PM. I’ll compile everything into the deck. Thanks, everyone, for pulling together on such short notice. Let’s make this happen.\n\nKatya Petrov: Sounds like a plan.\n\nFelipe Ribeiro: Let’s do it.\n\nAlessandra Rossi: Talk to you all soon.\n\nTanvi Sharma: Thanks, everyone. Meeting adjourned."

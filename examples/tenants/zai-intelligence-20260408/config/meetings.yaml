  - hsingh
  - nreddy
  location: Innovation Room
  organizer: arendón
  start_time: 2026-04-01T15:30:00Z
  title: Scalability Brainstorming Session
  transcript: "Alejandro Rendón: Alright, uh, good afternoon, everyone. Thanks for joining on such short notice. I know schedules are tight, but we really need to align on potential solutions for our scalability issues. I see... just three of us here so far. Harpreet, Lilian, are you both on?\n\nHarpreet Singh: Yeah, I’m here. Can you hear me?\n\nAlejandro Rendón: Yep, loud and clear. Thanks for making it. Lilian?\n\nLilian Kamau: [static] Uh, can you guys hear me now?\n\nAlejandro Rendón: Yep, got you. Looks like Nisha hasn’t joined yet. Let me ping her real quick. Meanwhile, let’s just dive in. We’ve been hitting roadblocks with the memory leak workaround and the latency issues it’s causing during high-load scenarios. It’s clear the current solution isn’t sustainable long-term. Thoughts?\n\nHarpreet Singh: Yeah, I was just about to say that. The workaround was never meant to be a permanent fix. We need to look at the architecture itself. Alejandro, did we ever circle back to the idea of implementing load balancing at the API level?\n\nAlejandro Rendón: Uh, we touched on it briefly last week, but it got buried under the demo prep chaos. I think it’s worth revisiting, though. Lilian, what’s your take?\n\nLilian Kamau: Honestly, I’d support that direction. Load balancing could at least mitigate some of the strain during peak usage. That said, it’s not going to solve the root cause. I’m more concerned about whether we’re overengineering when we still don’t fully understand the interaction between the open-source model and our infrastructure.\n\nHarpreet Singh: Agreed. Plus, even if we go the load-balancing route, we’re adding complexity. Have we benchmarked how the model would perform if we migrated to a containerized microservices architecture? I know it’s a big lift, but it might give us the control we need.\n\nAlejandro Rendón: We haven’t formally benchmarked that yet. I don’t even think we’ve scoped it fully. [pauses] Actually, hold on—Nisha just messaged me. She’s stuck in another meeting and won’t make it. Alright, so it’s just us. Let’s keep going.\n\nLilian Kamau: Yeah, okay. Back to the microservices idea—if we start going down that path, we’re talking about weeks of refactoring. Do we even have the resources right now? The engineering team is already stretched thin.\n\nHarpreet Singh: True, but if we’re already hitting a wall with scalability at this stage, imagine what’s going to happen once we onboard more users or scale the model. It’s a now-or-later problem. And later is going to be worse.\n\nAlejandro Rendón: Fair point. I’m just worried about the investor pressure right now. They’re breathing down our necks for quick wins, and refactoring doesn’t exactly scream “quick.”\n\nLilian Kamau: Right, and don’t forget we’re still dealing with data inconsistencies. If we start refactoring while the data pipeline is unstable, it’s going to be chaos.\n\nHarpreet Singh: Good point. Maybe instead of a full microservices migration, we could experiment with containerizing just the model-serving component. See how it handles the load under isolated conditions.\n\nAlejandro Rendón: That’s... actually a reasonable compromise. It’d give us data to justify a larger migration if it works. Lilian, would you be able to scope that out?\n\nLilian Kamau: I can try, but I’ll need to rope in someone from DevOps. They’ve been swamped, though. Let me check with Ravi and see if he can spare some cycles.\n\nHarpreet Singh: Cool. While you’re doing that, I’d also suggest we revisit that undocumented feature we found in the open-source model. If it can actually improve inference speed, it might buy us some breathing room.\n\nAlejandro Rendón: Agreed. I’ll take the lead on that. I’ll coordinate with the engineering team and see if we can test that feature during tomorrow’s sprint. Anything else?\n\nLilian Kamau: Uh, yeah. Quick question—are we still planning to fast-track the beta dataset release? That’s going to affect our priorities.\n\nAlejandro Rendón: Ugh, don’t remind me. The CFO’s on my case about it. Let’s take that offline and sync tomorrow. Anything else on scalability before we wrap?\n\nHarpreet Singh: Nope, I think we’ve got a decent starting point. Let’s regroup after the initial tests.\n\nAlejandro Rendón: Sounds good. Alright, action items: Lilian, you’ll scope out containerizing the model-serving component and loop in DevOps. Harpreet, you’ll help review the tests for that undocumented feature. I’ll handle coordination with engineering and investor updates. Let’s aim to touch base early next week. Thanks, everyone. Appreciate your time.\n\nLilian Kamau: Thanks, Alejandro.\n\nHarpreet Singh: Yep, talk soon. Bye.\n\nAlejandro Rendón: Bye, all."

  title: Data Backup Review
  transcript: "Tanvi Sharma: Hi everyone, can we get started? Let's go ahead and dive into today's agenda, which is reviewing our backup processes after the intern accidentally deleted the annotated training data.\n\nKatya Petrov: Yes, absolutely. Just to clarify, are we focusing specifically on the annotated dataset or backups in general?\n\nTanvi Sharma: Good point. Initially, I think we should focus on the annotated dataset since that's where the issue occurred, but we can expand the scope if needed. Does anyone have immediate thoughts?\n\nFelipe Ribeiro: Uh, sorry—can everyone hear me? I think my mic was off.\n\nAlessandra Rossi: Yeah, we can hear you now.\n\nFelipe Ribeiro: Great. So, I was saying, I reviewed the current backup protocols last night, and honestly, they’re not robust enough. We’re relying too much on manual triggers instead of automating backups. That’s a big risk.\n\nKatya Petrov: Agreed, Felipe. And it’s not just the intern’s mistake—this could’ve happened to anyone. The bigger issue is that the annotated data wasn’t backed up in real-time. We had a gap of almost 12 hours where changes weren’t saved.\n\nTanvi Sharma: Exactly. Alessandra, you’ve worked with the data annotation pipeline more closely than anyone else. Can you walk us through how backups are configured right now?\n\nAlessandra Rossi: Sure. So, right now, we’re using a scheduled nightly backup for the annotated datasets. It’s fine for general workflows but not for high-frequency updates like what we’ve been doing recently. The intern’s deletion happened late afternoon, and the backup from the previous night didn’t cover the changes made during the day.\n\nFelipe Ribeiro: That’s a problem. Could we implement hourly backups instead of nightly ones? Or maybe something event-driven?\n\nKatya Petrov: Event-driven makes sense, but wouldn’t that spike costs? I mean, cloud storage isn’t free, especially with the volume of annotations we’re working with.\n\nTanvi Sharma: Good point, Katya. Felipe, do you have any cost estimates for more frequent backups?\n\nFelipe Ribeiro: Not yet, but I can run some numbers after this meeting. I do think hourly might be overkill, though. Maybe backups every four hours would strike a good balance?\n\nAlessandra Rossi: Four hours sounds more reasonable. But we’ll also need to make sure the backup process doesn’t interfere with the annotation pipeline itself. We’ve already had performance bottlenecks with that.\n\nKatya Petrov: That’s true. Speaking of bottlenecks, can we also talk about how this ties into our storage architecture? I feel like we’ve been ignoring some inefficiencies there.\n\nTanvi Sharma: Hmm, I don’t want to veer off-topic too much, but it’s a valid point. Let’s take that offline for now and focus on the immediate issue.\n\nFelipe Ribeiro: Right, back to the annotated data. If we move to four-hour backups, we’ll need to update the access permissions too. Right now, it’s too loose; anyone with write access could trigger issues like this.\n\nKatya Petrov: Absolutely. Access controls need to be stricter. Also, has the intern been trained on proper data management protocols? This might be a broader training issue.\n\nTanvi Sharma: Good catch, Katya. Alessandra, can you coordinate with HR to make sure all interns go through a more thorough onboarding process for data handling?\n\nAlessandra Rossi: Sure, I’ll reach out to them after this.\n\nFelipe Ribeiro: One more thing: are we confident that the deleted data is fully recoverable? Or are we looking at gaps in the annotations?\n\nTanvi Sharma: I spoke with engineering earlier—they managed to recover most of it from the cloud’s version history, but we did lose the annotations from the past four hours before the deletion. We’ll need to redo those.\n\nKatya Petrov: That’s frustrating, but it could’ve been worse. Let’s make sure we document this incident properly for future reference.\n\nAlessandra Rossi: Agreed. I’ll draft a report and share it with everyone.\n\nFelipe Ribeiro: Sorry, quick interruption—can we get confirmation on who’s going to implement the new backup schedule? Is that on engineering or data science?\n\nTanvi Sharma: Engineering will handle the implementation, but data science should provide input on how to minimize disruptions to workflows. Alessandra, can you coordinate with them?\n\nAlessandra Rossi: Yes, I’ll set up a meeting with the engineering lead.\n\nKatya Petrov: One last thought—should we also consider a third-party backup solution? Something separate from our current infrastructure, just as a fail-safe?\n\nFelipe Ribeiro: That’s an interesting idea, but let’s evaluate costs before committing to anything. I can add that to my cost analysis.\n\nTanvi Sharma: Perfect. Okay, I think we’ve covered the main points. Action items before we wrap up:\n1. Felipe will run a cost analysis for more frequent backups and potential third-party solutions.\n2. Alessandra will coordinate with HR for intern training and with engineering for backup schedule updates.\n3. Katya will ensure proper documentation of this incident.\n\nTanvi Sharma: Anything else?\n\nAlessandra Rossi: I think we’re good. Thanks, everyone.\n\nKatya Petrov: Thanks. Talk soon.\n\nFelipe Ribeiro: Bye, everyone.\n\nTanvi Sharma: Bye!"

  title: Burnout Survey Follow-Up
  transcript: "Mateo Carvalho: Hi everyone, let's get started. Thanks for joining today's meeting on the burnout survey follow-up. I know it's been a hectic week, so I appreciate you all making time for this. Let's dive in. First on the agenda: employee feedback from the burnout survey. Chidinma, can you kick us off?\n\nChidinma Okonkwo: Sure, Mateo. We had about 60% participation in the survey, which isn't great, to be honest. Most of the feedback highlights long working hours, unclear priorities, and confusion around the new 'no-meeting' policy. Some employees said they feel the policy isn't being enforced consistently, which is adding to their stress.\n\nHanh Nguyen: Sorry to jump in, but can you clarify what you mean by 'not enforced consistently'? Are teams ignoring the policy, or is it more of a misunderstanding?\n\nChidinma Okonkwo: Good question, Hanh. It's a bit of both. Some teams are outright scheduling meetings during the 'no-meeting' window, while others are confused about whether it applies to cross-functional meetings or just internal ones. I saw a comment where someone said, 'We canceled one meeting only to end up in three others.'\n\nMateo Carvalho: Right, this tracks with the emails I received after the COO sent out that clarification yesterday. Mahmoud, what's your take on this? You lead a cross-functional team—how's the policy playing out there?\n\nMahmoud Baddour: Honestly, it's been a mixed bag. We tried to respect the policy, but with the investor demo prep and the benchmark dataset release, we couldn't avoid some meetings. I think the policy is good in theory, but the timing couldn't be worse given everything on our plates right now.\n\nAisha Suleiman: Can I just say—this feels like a classic case of us trying to solve a problem with another policy rather than addressing the root cause. People are burned out because we're overcommitted, not because they're sitting in meetings.\n\nHanh Nguyen: Exactly. And I hate to say it, but the 'no-meeting' policy feels more like a Band-Aid than a real solution. If anything, it's creating more confusion and stress. People are scrambling to reschedule or cram discussions into Slack, which isn't always efficient.\n\nMateo Carvalho: Good points, both of you. Let's come back to the policy in a bit. For now, I want to ensure we acknowledge the broader burnout issue. Aisha, you mentioned overcommitment—what do you think needs to change?\n\nAisha Suleiman: Honestly? We need to get better at saying no to things. We're trying to juggle too many priorities—open-source model integration, dataset release, investor demands—it's unsustainable. Leadership needs to step in and set clearer boundaries.\n\nMahmoud Baddour: I agree, but how do we do that without jeopardizing our investor relationships? They’re already on edge about the delays.\n\nChidinma Okonkwo: Maybe we need to prioritize internally first. If employees are burning out, we’re going to see more mistakes and delays, which will just make things worse in the long run. We need to find a balance.\n\nMateo Carvalho: Good point, Chidinma. Let's shift gears to the 'no-meeting' policy specifically. Should we refine it, or is it a lost cause?\n\nHanh Nguyen: I think we need clearer guidelines. For example, does 'no-meeting' mean no formal Zoom calls, or does it include impromptu Slack huddles too? And who enforces it? Right now, it feels like everyone's interpreting it their own way.\n\nAisha Suleiman: Agreed. And maybe we need to carve out exceptions for critical deadlines, like the investor demo. Otherwise, we’re penalizing teams that are already stretched thin.\n\nMahmoud Baddour: Sorry to interrupt, but I just got a Slack ping about the demo setup. Hang on—can you all hear me? My connection’s acting up.\n\nMateo Carvalho: Yep, we can hear you, Mahmoud. Do you need to step out?\n\nMahmoud Baddour: No, it’s fine. Just wanted to make sure. But yeah, I think exceptions make sense. Maybe HR could work with team leads to define what qualifies as 'critical.'\n\nChidinma Okonkwo: That’s a good idea. I can take that as an action item—work with HR to draft clearer guidelines and communicate them. But we also need leadership buy-in, or it won’t stick.\n\nMateo Carvalho: Agreed. I’ll escalate this to the COO and get their input. Anything else on the policy before we wrap up?\n\nAisha Suleiman: Just one thing. Can we also check in on how people are feeling a month from now? A follow-up survey, but shorter this time, might help us track progress.\n\nMateo Carvalho: Great idea, Aisha. Let’s put that on the calendar. Okay, quick recap: Chidinma will work with HR to refine the 'no-meeting' policy guidelines. I’ll loop in the COO for leadership alignment. We’ll also plan a follow-up survey in a month. Anything else?\n\nHanh Nguyen: Nope, that covers it for me.\n\nMahmoud Baddour: Same here.\n\nAisha Suleiman: All good.\n\nMateo Carvalho: Alright, thanks, everyone. Let’s take this offline for now. Meeting adjourned."

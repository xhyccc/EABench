  title: 'Emergency Prep: Investor Demo'
  transcript: "Felipe Ribeiro: Alright, everyone, thanks for jumping on this emergency call. I know we're all stretched thin, but we have a critical UI bug in the demo setup, and the investor meeting is just hours away. Let's get started. Can everyone hear me?\n\nAlessandra Rossi: Yes, loud and clear.\n\nAkiko Yamada: I can hear you, but I think Harpreet is still connecting.\n\nHarpreet Singh: Sorry, I’m here now. Had some trouble with Zoom. Can you guys hear me?\n\nKiril Vasilev: Yes, we’ve got you, Harpreet.\n\nFelipe Ribeiro: Great. Okay, let’s dive in. Akiko, can you quickly summarize the visual bug we’re dealing with?\n\nAkiko Yamada: Sure. The issue is with the dropdown menu on the main dashboard. The options are rendering incorrectly—some are overlapping, and in certain resolutions, the dropdown just disappears entirely. We think it’s tied to the recent frontend library update, but we haven’t nailed it down yet.\n\nHarpreet Singh: Wait, is this specific to the investor demo environment or the production environment as well?\n\nAkiko Yamada: Good question. We’ve confirmed it’s isolated to the demo environment. The production build is fine, but the demo uses a slightly customized config, which seems to be where the problem lies.\n\nFelipe Ribeiro: Okay, so it’s not a global issue. That’s at least some good news. Kiril, can your team tackle this directly? We need a patch ASAP.\n\nKiril Vasilev: We’re already on it. We’ve narrowed it down to a CSS conflict, and we’re testing a potential fix right now. The challenge is that the demo environment doesn’t have full parity with our staging or production environments, so it’s a bit of trial and error.\n\nAlessandra Rossi: Wait, why doesn’t the demo environment match staging? Shouldn’t that have been standardized by now?\n\nFelipe Ribeiro: Alessandra, I agree, but let’s not get sidetracked on that right now. We can address the environment standardization in a retrospective later. For now, let’s stay focused on fixing the bug.\n\nAlessandra Rossi: Got it. Just flagging it for future discussion.\n\nHarpreet Singh: Kiril, do you need extra hands on this? I can pull someone from my team to assist if that helps speed things up.\n\nKiril Vasilev: Appreciate the offer, Harpreet. Let me check with my team after this call and see if we need additional support. I’ll follow up with you directly.\n\nAkiko Yamada: While Kiril’s team is working on that, should we have a backup plan in case the fix takes longer than expected? Maybe we can pre-record a demo walkthrough and use that during the investor meeting?\n\nFelipe Ribeiro: That’s a solid idea, Akiko. Alessandra, can you coordinate with the product team to record a walkthrough? Let’s have it as a fallback.\n\nAlessandra Rossi: Sure, I’ll get that started right after this.\n\nHarpreet Singh: One quick thing—what about the investor Q&A? If they ask to see something live, a pre-recorded video might not cut it.\n\nFelipe Ribeiro: Good point. That’s why the live demo is still the priority. Kiril, do you think you can have the fix ready in the next two hours?\n\nKiril Vasilev: Two hours is tight, but doable. I’ll push the team to expedite testing.\n\nAlessandra Rossi: Also, are we confident the rest of the demo setup is stable? Have we stress-tested it?\n\nAkiko Yamada: We ran some quick checks this morning, and everything else seems fine. But I’d recommend a final smoke test once Kiril’s team pushes the fix.\n\nFelipe Ribeiro: Agreed. Harpreet, can you oversee the smoke test after the fix is live?\n\nHarpreet Singh: Sure thing. I’ll pull in one of my QA leads to assist as well.\n\nFelipe Ribeiro: Perfect. Anything else we need to address?\n\nAlessandra Rossi: Just a heads-up—investors might ask about the novel annotation approach we’ve been testing. Do we have anything concrete to share if that comes up?\n\nHarpreet Singh: Not yet. The data science team is still running preliminary tests. If it comes up, we should frame it as a promising area of exploration but emphasize it’s not ready for deployment.\n\nFelipe Ribeiro: Agreed. Let’s not overpromise on that. Alright, here’s the plan: Kiril’s team will prioritize the UI fix, Alessandra will coordinate the pre-recorded demo as a backup, and Harpreet will oversee the final smoke test. Anything I missed?\n\nAkiko Yamada: What about a contingency if the bug fix breaks something else in the demo?\n\nFelipe Ribeiro: Good call. Let’s have a rollback plan ready. Kiril, can you ensure that’s in place?\n\nKiril Vasilev: Will do. I’ll keep the rollback script handy just in case.\n\nFelipe Ribeiro: Alright, everyone, let’s get to it. Time is tight. If there are any blockers, flag them in Slack immediately. Thanks, team.\n\nAlessandra Rossi: Got it.\n\nAkiko Yamada: On it.\n\nHarpreet Singh: Let’s make it happen.\n\nKiril Vasilev: Back to the grind. Thanks, all.\n\nFelipe Ribeiro: Meeting adjourned."

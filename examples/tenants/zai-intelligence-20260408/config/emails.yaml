d either of you double-check whether the A+-round pitch deck has been finalized and sent off? I know there was a last-minute investor request for additional projections on Thursday, but I haven’t seen confirmation yet that it was resolved.\n\nLet me know your thoughts, and if there’s anything else I should be factoring into our messaging to investors. We need to move on this soon to mitigate risks and stabilize confidence.\n\nThanks,\nChidinma\n\nSent from my iPhone"

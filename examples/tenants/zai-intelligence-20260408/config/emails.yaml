te your thoughts on this since you’re closest to the comms piece.\n\nAlso, quick note: HR flagged some concerns about burnout levels across the teams. Let’s be mindful of that as we push through these decisions. If we’re asking for extra hours or fast turnarounds, we may need to think about short-term incentives or temporary flexibility to keep morale up.\n\nLooking forward to your feedback. Let’s aim to wrap this up tomorrow so we can have a unified path forward by the end of the week.\n\nThanks, as always, for your hard work and dedication. Please feel free to reply here or let me know if you’d rather hop on a quick call to discuss further.\n\nBest,\nMateo\n\nSent from my iPhone"

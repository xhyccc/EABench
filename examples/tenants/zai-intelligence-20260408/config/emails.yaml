  body: "Subject: Urgent Cross-Team Meeting on Demo Status\n\nHi Mateo, Hyejin, Liang,\n\nI hope this email finds you well. I’m reaching out to let you know that I’ve scheduled an urgent cross-team meeting for today at 3 PM (invite to follow shortly) to get everyone aligned on the current status of the demo for the benchmark dataset. As you all know, we’ve been facing increasing pressure from investors to deliver tangible progress, and I’m concerned about recurring delays and the allocation of resources across teams.\n\nTo be transparent, I understand this is a last-minute ask, and I realize how stretched everyone already is. However, given the critical nature of this deliverable, I believe it’s necessary to pull everyone together, even if it means temporarily redirecting focus from debugging and other ongoing tasks. I ask for your understanding here.\n\nHere’s the proposed agenda for the meeting:\n1. Current status updates from each team (engineering, data science, product).\n2. Review of outstanding blockers (e.g., visualization components, dataset inconsistencies, memory leak latency issues).\n3. Discussion on resource prioritization to meet the demo deadline.\n4. Next immediate steps and responsibilities.\n\nA few notes:\n- Mateo, can you confirm if the workaround for the memory leak issue is stable enough to proceed, or do we need to allocate more time to scalability concerns?\n- Hyejin, can you share a quick update on the dataset quality review and whether the flagged inconsistencies have been resolved?\n- Liang, I know you’ve been juggling a lot with the visualization components—can you confirm if the missing pieces can realistically be addressed by EOD Monday?\n\nI also want to acknowledge that morale has been low lately, and I regret the added stress this meeting might create. HR has flagged employee dissatisfaction as a growing issue, and I want to assure you I’m working with them to address this. If there’s anything specific you or your teams need to make
nvestors?\n\nPlease share your thoughts, and let me know if you’d like to hop on a quick call later today to hash this out further. I’m juggling a few things on my end but can make time after 3 PM if that works for you both.\n\nThanks, and sorry for the long email—there’s just a lot happening right now!\n\nBest,\nMariam\n\nSent from my iPhone"

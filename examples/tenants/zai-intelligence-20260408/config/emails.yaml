using on?\n\nFinally, just a quick heads-up: the CFO is expecting a finalized demo by end-of-day Monday, so we’re on a tight clock here. If we decide to pursue this, we’ll need to move fast and stay aligned. Let me know your thoughts ASAP.\n\nLooking forward to hearing from you all.\n\nBest,\nTanvi\n\nSent from my iPhone"

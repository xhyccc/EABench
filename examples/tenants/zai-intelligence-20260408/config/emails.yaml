  body: "Hi Hyejin, Tanvi, Alejandro, and Lilian,\n\nHope you’re all doing well. I wanted to follow up on the discussion we started earlier today regarding the undocumented critical feature in the new open-source model. As you know, this came up after the discovery by one of the junior engineers, and it’s sparked quite a bit of debate about whether we should allocate engineering bandwidth for exploratory testing.\n\nGiven everything else on our plate—dataset inconsistencies, post-training techniques integration, hyperparameter tuning experiments, and now the funding situation—I understand this could be a tough call. That said, the potential of this feature (if it works as expected) could be significant for our roadmap. While the lack of documentation is frustrating, I’m inclined to think it’s worth dedicating some resources to at least assess the feasibility before we dismiss it outright.\n\nI’d love to hear your thoughts on this. Specifically:\n1. Do you think we should assign a small team to investigate this further?\n2. If yes, do we have bandwidth to spare, or will this require shifting priorities (e.g., delaying other tasks)?\n3. Are there any risks I might not be considering here?\n\nAlso, since this has come up in parallel with the revised integration plan for the post-training techniques (which is already stirring up mixed opinions), I think it’s important to maintain alignment across the team. I don’t want us to spread too thin or lose focus, but we also shouldn’t miss out on potentially game-changing opportunities.\n\nQuick note: I’m aware we’re still waiting on feedback from the investor regarding the funding delays. If this becomes more urgent, we might have to pause everything to focus on those deliverables. Lilian, could you confirm whether that’s likely?\n\nLastly, I’ve been hearing some murmurs about reverting to the previous hyperparameter tuning strategy due to the performance drops in the latest experiment. Hyejin, you were in the thick of that debate yesterday—has there been any consensus yet? Just trying to make sure we’re not doubling up on efforts unnecessarily.\n\nAppreciate everyone’s input here. Feel free to reply when you have a moment—ideally by EOD so we can get a clearer sense of direction.\n\nThanks!\nFelipe\n\nSent from my phone, apologies for any typos."

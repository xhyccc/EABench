ng for in terms of showcasing innovation to investors?\n\nNo rush on a response—please take your time to think it over. Also, let me know if I should put together a more detailed write-up or a quick mockup for the team to review. Happy to adjust based on your feedback.\n\nThanks so much!\n\nBest,\nKatya\n\nSent from my iPhone"

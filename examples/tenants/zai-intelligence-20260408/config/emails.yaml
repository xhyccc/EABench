  body: "Hi Mateo, Julia, and Tanvi,\n\nHope this email finds you all doing well, or at least holding up amidst everything going on. I wanted to follow up on something flagged by the HR team earlier this week and open the floor for a conversation about it.\n\nWe’ve received multiple complaints from team members about burnout, which, honestly, doesn’t come as a huge surprise given the pace and pressures we’ve been navigating lately. Between the ongoing debates over post-training integration, the open-source model headaches, and investor demands piling on, it’s clear that some folks are hitting their limits. And to be candid, I’m worried this could start impacting not just productivity but team morale in the long run if we don’t address it soon.\n\nI’d like us to start brainstorming ideas for a mental health support initiative that could provide some relief or at least show the team that leadership is taking this seriously. I know our bandwidth is stretched thin right now, but I also think this is something we can’t afford to put off. Even small steps—like scheduling regular check-ins, bringing in an external counselor for a few sessions, or encouraging more flexible work hours—could make a difference.\n\nJulia, could you check with HR to see if they’ve already got any resources or programs we could tap into quickly? I think it’d be helpful to know what’s already in place (or not) before we start reinventing the wheel. Mateo, I know you’ve been in the thick of things with the engineering team lately—do you think they’d be open to something like this, or are we at risk of it being seen as performative? Tanvi, I’d also love your input on how we could pitch this to the leadership team. Given the pushback on other ‘non-core’ initiatives lately (looking at you, beta dataset discussions), I want to make sure we frame this in a way that resonates.\n\nLet’s aim to sync up early next week to discuss this. Do Monday afternoon or Tuesday morning work for everyone? If there’s a better time, just let me know—I’ll do my best to shuffle things around.\n\nAppreciate you all taking the time to think about this, especially with everything else happening right now. Let’s figure out how we can make this work without adding more stress to an already full plate.\n\nThanks,\nHyejin\n\nSent from my iPhone"

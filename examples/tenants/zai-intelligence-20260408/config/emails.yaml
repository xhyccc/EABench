s there’s still a lot of confusion about how it’s supposed to work. Let me know if this is impacting your teams—I can flag it with leadership if needed.\n\nLooking forward to hearing your thoughts. Let’s sync up later this week if needed to decide on next steps.\n\nBest,\nLilian\n\nSent from my iPhone"

g into the delays, but it’s something we might need to address sooner rather than later if we’re going to keep moving forward.\n\nLet me know your thoughts and what next steps make sense. We need to finalize this one-pager by EOD today to avoid further pushback from investors. Appreciate your help on this—sorry for the short notice!\n\nThanks,\nJulia\n\nSent from my iPhone"

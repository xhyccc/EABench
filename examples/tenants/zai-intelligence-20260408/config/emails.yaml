ave run high lately, but I’m confident we’ll come out of this stronger as a team. Let’s aim to wrap this up tonight so we can provide the investors with the clarity they’re asking for, and more importantly, so we can move forward with confidence.\n\nLooking forward to your input. See you all this evening.\n\nBest,\nHyejin\n\nSent from my iPhone (excuse any typos!)"

the no-meeting policy is already surfacing some frustration from the team. Let’s be mindful of burnout as we push through this sprint—maybe check in with your teams to make sure they’re doing okay?\n\nThanks, both of you. Let’s get this done and put our best foot forward for the investors.\n\nBest,\nJulia\n\nSent from my iPhone"

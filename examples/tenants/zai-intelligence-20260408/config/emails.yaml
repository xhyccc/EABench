  body: "Hi Lilian, Alejandro, Felipe,\n\nHope you're all doing well. Following up on the GPU utilization spike we've been seeing since implementing the memory leak fix, I wanted to share a potential workaround I've been testing and get your thoughts.\n\nThe issue seems to stem from how the fix interacts with the pipeline's memory allocation during training jobs. Specifically, the new allocation strategy triggers unexpected spikes in GPU usage, which is causing delays and resource bottlenecks. After some digging, I found that tweaking the batch size dynamically during training (based on real-time GPU metrics) might mitigate the spike without compromising model performance. This would require adding a monitoring hook to the pipeline to adjust the batch size on-the-fly, but initial tests have shown promising results.\n\nI’ve put together a quick proof-of-concept, but before pushing it further, I’d love to get your feedback. Are there any concerns from your side about potential impacts on inference accuracy or training stability? Also, I know we’ve discussed scalability issues in earlier syncs—do you think this approach might add unnecessary complexity, especially with the open-source model integration still in progress?\n\nSeparately, I’m wondering if this could tie into the annotation optimization technique the data science team was exploring earlier this week. If we can reduce GPU strain during training, it might free up resources for faster annotation validation. Just a thought, but curious to hear what you all think.\n\nLet me know if you’d like me to demo the workaround in tomorrow’s team meeting—or if you think it’s worth pausing to prioritize other fixes first. I know Alejandro mentioned the visualization bug in the benchmark dataset demo, and I don’t want to pull resources away from that if it’s the higher priority right now.\n\nThanks, and feel free to reply here or ping me on Slack if you have questions. Apologies for the long email—just wanted to make sure I covered everything. :)\n\nBest,\nAmara\n\nSent from my phone, so apologies for any typos!"

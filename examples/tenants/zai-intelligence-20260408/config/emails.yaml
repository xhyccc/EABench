so, just to circle back to something from earlier this week—did we ever finalize the resource allocation for testing the new annotation strategy? I think it might tie into the memory leak discussions, but I could be wrong.\n\nThanks so much, and I appreciate everyone’s patience as we navigate this.\n\nBest,\nAmara\n\nSent from my phone (apologies for any typos!)"

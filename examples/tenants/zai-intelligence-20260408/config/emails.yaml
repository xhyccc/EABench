  body: "Subject: Leadership Update: Employee Feedback on Policies\n\nHi Hanh, Aisha, and Kwame,\n\nI wanted to take a moment to follow up on some of the concerns we’ve been hearing regarding employee dissatisfaction following the recent policy changes, especially around rescheduling and the 'no-meeting' initiative. It’s clear that while we had good intentions with these efforts, the execution has left some gaps, and I think we need to address these head-on.\n\nFirst, the feedback from the anonymous survey HR sent out has been pretty candid—there’s a fair amount of confusion about how and when the 'no-meeting' policy is supposed to be applied. Some teams seem to be interpreting it differently, and in some cases, it’s creating more scheduling chaos rather than less. I know we talked briefly about this during last week’s leadership sync, but it seems like the communication around this policy wasn’t as clear as it could’ve been. Would it make sense to draft a quick FAQ or do a follow-up announcement to clarify expectations? Hanh, maybe we could tag-team this with HR?\n\nOn top of that, the back-to-back rescheduling of the town hall didn’t help matters. I’ve seen a few emails from frustrated team members who felt blindsided by the changes, and it’s clear that this has added to their overall sense of disorganization. Aisha, could we chat offline about how to tighten up our internal comms processes to avoid these kinds of hiccups in the future? I really think we need to nail the basics here before things escalate further.\n\nSeparately, I know we’re all feeling the pressure from the investor side, and that has understandably trickled down to the teams, but I’m increasingly concerned about the burnout signals we’re seeing. The engineering team, in particular, has been pulling long hours to deal with the memory leak and latency issues, and the data science team is still recovering from the accidental data deletion. Kwame, can we explore whether there’s room to temporarily redistribute some resources or at least give these teams a bit of breathing room? I know it’s a tough ask given the current roadmap crunch, but I worry this level of strain isn’t sustainable.\n\nLastly, I think we need to revisit how we’re aligning as a leadership team. The ongoing debates about fast-tracking the 'beta' benchmark dataset release have been heating up, and I’m not sure we’re presenting a unified front to the rest of the org. Let’s make sure we’re aligned before the next all-hands. Would it make sense to schedule a dedicated hour early next week to hash this out? I’m happy to coordinate calendars if that helps.\n\nLet me know your thoughts on all of the above, and feel free to flag anything I might’ve missed. I know this is a lot, but I’m confident we can work through it together.\n\nThanks,\nMateo\n\nSent from my iPhone"

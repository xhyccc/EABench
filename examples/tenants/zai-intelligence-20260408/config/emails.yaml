  body: "Subject: Investor Concerns on Demo Timeline & Financial Projections\n\nHi Mateo, Hyejin, and Tanvi,\n\nI wanted to loop back on the investor concerns we’ve been discussing and provide an update after the latest call with the A+-round group yesterday. As you might guess, the demo timeline and our financial projections are still very much in the spotlight, and we’re being pressed for clarity and concrete next steps.\n\nFirst, on the demo timeline: Investors are asking for a clear and realistic date for when they can see a functional version of the benchmark dataset demo. Given the delays we’ve had with the visualizations (which I know the data science team is working hard to address) and the recent issues with mislabeled annotations, I’m concerned about overpromising. Do we have enough confidence to commit to a date in the next two weeks? Or would it be better to position this as a phased rollout? I’d like your thoughts on this so we can finalize messaging during tomorrow’s leadership sync.\n\nSecond, on financials: I’ve been revising the projections to reflect the delays and updated cost estimates, but we’re getting a lot of questions about the long-term revenue impact if the demo doesn’t ship soon. Mateo, I know you’ve been working on a partial fix for the memory leak issue, but the latency spike it introduced might come up in the next investor Q&A. Can you confirm what your team’s timeline looks like for addressing that? Even a rough estimate would help me frame the discussion.\n\nHyejin, I know the mislabeled annotations have been a major headache for your team. Is there anything you need from engineering or product to help move this forward more quickly? Also, I heard about the annotation optimization idea that came up during your stand-up—do you think it’s feasible in the short term, or is it more of a long-term play?\n\nLastly, I’m aware tensions have been running high across teams lately, and I want to acknowledge that this has been a challenging period for everyone. The investor pressure isn’t helping, but we need to be aligned as a leadership team to keep things moving in the right direction. I know there was some disagreement during yesterday’s sync call (and I’ll admit, I may have pushed too hard on certain points). Let’s use tomorrow’s meeting to reset and get aligned—it’s critical that we present a united front both internally and externally.\n\nPlease review and share your thoughts before EOD so I can incorporate them into tomorrow’s strategy discussion. And if I’ve missed anything or you need clarification on any of the investor feedback, let me know.\n\nThanks all,\n\nJulia\n\nSent from my iPhone"

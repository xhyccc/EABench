om with investors, but it’s going to put additional pressure on everyone involved. If this overlaps with your workstreams, let me know ASAP so we can coordinate accordingly.\n\nLet’s aim to have a brief sync-up call early next week to review progress and finalize a plan for moving forward. I’ll send out a calendar invite shortly—please let me know if you have any conflicts.\n\nThanks again for your effort during what I know has been a hectic time. Let’s keep the lines of communication open as we tackle this. Feel free to reply here or ping me directly if you have questions or ideas.\n\nBest,\nTanvi\n\nSent from my iPhone"

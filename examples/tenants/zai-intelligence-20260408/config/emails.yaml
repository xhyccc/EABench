  body: "Hi Tanvi and Katya,\n\nHope you're both doing well! I wanted to follow up on some of the challenges we've been facing with annotation quality and discuss a potential alternative strategy that might help us address some of the inconsistencies we've observed in the dataset.\n\nAs you're aware, the recent data recovery process highlighted gaps in our current annotation pipeline. The semi-automated tool has been helpful in certain areas, but it’s also introduced errors that have required significant manual intervention to resolve. Yesterday’s incident with the deleted training data (still can't believe that happened!) reinforced the need for a more robust, scalable process.\n\nHere’s what I’m proposing:\n1. **Shift to a hybrid annotation strategy**: We could combine rule-based automation for straightforward cases with a crowdsourcing platform for edge cases. This would allow us to reduce dependence on a single tool and improve the accuracy of annotations for difficult samples.\n2. **Implement a rolling QA process**: Instead of doing QA in large batches, we could review smaller subsets of annotations more frequently. This might help us catch issues earlier and reduce rework later on.\n3. **Introduce version control for annotations**: Similar to how we track code changes, we could explore tools that let us version datasets and annotations. This would make it easier to recover from incidents like yesterday’s deletion without scrambling to piece things back together.\n\nI realize there are upfront costs (in time and resources) to pivoting the strategy, so I’d love to hear your thoughts on whether this aligns with our current priorities. If this sounds worth exploring, I’d be happy to draft a more detailed plan and run a small-scale pilot to test feasibility. I believe this could also serve as a strong talking point for the next investor update, given the concerns around delays.\n\nA couple of questions for you:\n- Katya, do you think the engineering team has the bandwidth to help with integration for the version control system, assuming we go that route? I know things are tight with the demo and the memory leak situation.\n- Tanvi, do you think crowdsourcing would fit into our timeline, or should we stick to a more internal-focused approach for now?\n\nLet me know what you think when you get a chance. I know it’s been a hectic week, and I appreciate the effort you’re both putting in despite everything going on. Happy to jump on a quick call if it’s easier to discuss live.\n\nThanks!\nFelipe\n\nSent from my iPhone"

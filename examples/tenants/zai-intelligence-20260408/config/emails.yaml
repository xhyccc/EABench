g in lately. HR’s midweek ‘no-meeting’ policy seems like a good step forward, but if there’s anything else you feel the leadership team should be doing to support you and your teams, please don’t hesitate to speak up.\n\nLet me know if you have any questions or need additional context on the attached data—I’m happy to jump on a call later today if needed.\n\nBest,\nChidinma\n\nSent from my iPhone"

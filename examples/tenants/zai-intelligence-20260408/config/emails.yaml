  body: "Subject: Action Plan: Addressing Burnout Survey Confusion\n\nHi Julia, Hyejin, and Tanvi,\n\nI wanted to follow up regarding the confusion caused by the outdated burnout survey that was sent earlier this week. First off, I want to acknowledge the frustration this has caused among our teams—this was an unintentional oversight, but one we need to address thoughtfully and quickly to rebuild trust and improve our internal communications.\n\nAs we discussed in yesterday’s leadership sync, it’s clear that there are gaps in how HR initiatives are being rolled out and communicated. This incident, combined with the mixed reactions to the midweek ‘no-meeting’ policy, shows we need to recalibrate how we’re approaching employee engagement. I’ve drafted a company-wide apology email (attached below) to acknowledge the mistake, clarify what happened, and outline the steps we’ll take to ensure this doesn’t happen again. I’d appreciate your thoughts before I send it out—please let me know if I’ve missed anything or if the tone feels off.\n\nHere’s what I propose as immediate next steps:\n\n1. **Audit Internal Communication Processes**: Julia, could you coordinate with the HR and comms team to review how we’re vetting and scheduling company-wide emails? Let’s ensure there’s a stronger review process in place to avoid outdated or redundant messages.\n\n2. **Clarify Survey Objectives**: Hyejin, can you work with the HR analytics team to refine the survey structure? We need to make sure the questions are relevant, concise, and actionable. Also, could you double-check if we’re using the most up-to-date survey platform? There were complaints about it being clunky, and we can’t afford additional friction.\n\n3. **Rebuild Trust Through Transparency**: Tanvi, I’d like your input on how we can better communicate the findings from these surveys to teams. Even if the data highlights tough truths, sharing it openly—and showing what we’re doing to act on it—will help regain credibility. Would you be able to draft a framework for this by end of next week?\n\n4. **Reinforce the Midweek 'No-Meeting' Policy**: While not directly related to the survey, the feedback loop here overlaps. Let’s make sure this policy is clearly defined and uniformly applied across teams. Julia, could you collaborate with the COO to refine the messaging here? Maybe a short FAQ or even a Slack thread could help avoid further confusion.\n\nLastly, I know everyone’s bandwidth is stretched thin right now (believe me, I feel it too), but prioritizing employee well-being is not negotiable. If you see areas where we need to adjust workloads or timelines to give teams breathing room, let’s discuss them. I’d rather we delay a deliverable than risk burnout spiraling further out of control.\n\nLet me know your thoughts on the apology email draft and the proposed steps. I’d like to wrap this up and send out the company-wide message by EOD tomorrow. Apologies in advance if this email feels a bit scattered—juggling a lot today. Thanks for your patience and support on this.\n\nBest,\nMateo\n\nP.S. If I’ve missed anything from our last discussion or there are details I’m overlooking, please flag them. Also, I’m sending this from my phone while heading into the investor debrief—so excuse any typos!\n\nSent from my iPhone"

name: "Default Judge Prompts"
description: "Standard prompts for citation relevance and assertion checking"
model:
  provider: azure
  name: gpt-4o
  parameters:
    temperature: 0.0
prompts:
  citation_relevance: |
    You are an expert evaluator for an AI agent. Your task is to judge the quality of the agent's tool usage and whether its response is grounded in the retrieved data.

    User Query: {query}

    Agent Tool Calls and Results:
    {tool_calls}

    Agent Final Response:
    {response}

    Evaluate the following:
    1. Did the agent use appropriate tools to find the information? (e.g., search_email for email questions)
    2. Did the retrieved tool results contain information relevant to the query?
    3. Does the agent's response accurately reflect the tool results — or did the agent ignore/contradict the results and present hallucinated information instead?

    Scoring guide:
    - 1.0: Correct tools used, relevant results found, response faithfully reflects those results.
    - 0.7-0.9: Mostly correct but minor gaps (e.g., right tool, slightly off result, or small hallucination).
    - 0.4-0.6: Partial — some correct retrieval but response includes hallucinated or irrelevant details.
    - 0.0-0.3: Wrong tools, no relevant results, or response contradicts/ignores the tool outputs entirely.

    Provide a score from 0 to 1 and a brief explanation.

    Output strictly in the following YAML format:
    ```yaml
    score: <float 0.0-1.0>
    explanation: "<string>"
    ```

  assertion_check: |
    You are an expert evaluator. Your task is to verify if the AI agent's response satisfies a list of specific assertions based on the user query.

    User Query: {query}

    Agent Response:
    {response}

    Assertions to Check:
    {assertions}

    For each assertion, determine if it is met (True) or not met (False).
    Then provide a final score from 0 to 1 based on the weighted percentage of passed assertions.

    Output strictly in the following YAML format:
    ```yaml
    assertions:
      - id: 1
        passed: <true/false>
        reasoning: "<string>"
      - id: 2
        passed: <true/false>
        reasoning: "<string>"
    final_score: <float 0.0-1.0>
    summary: "<string>"
    ```

  side_by_side: |
    You are an expert evaluator comparing two AI agents.

    User Query: {query}

    Agent A Response:
    {response_a}

    Agent B Response:
    {response_b}

    Assertions/Criteria:
    {assertions}

    Compare the two responses based on:
    1. Accuracy (Did they meet the assertions?)
    2. Completeness (Did they answer the full query?)
    3. Conciseness (Did they avoid fluff?)

    Decide which agent is better or if they are tied.

    Output strictly in the following YAML format:
    ```yaml
    winner: <"A", "B", or "Tie">
    reasoning: "<string>"
    better_response_score: <float 0.0-1.0>
    ```

  response_citation: |
    You are an expert evaluator. Your task is to assess whether the agent's final response includes a proper References section with accurate, grounded citations.

    User Query: {query}

    Agent Tool Calls and Results:
    {tool_calls}

    Agent Final Response:
    {response}

    Evaluate the following:
    1. Does the response include a "## References" section at the end?
    2. Does each reference entry follow the required format (* *Type*: <type> (ID: <id>))?
    3. Are the cited IDs real — i.e., do they appear in the tool results above? IDs not present in any tool result are hallucinated.
    4. Are the cited items actually relevant to the user's query?
    5. Does the body text contain inline citations ([^N^]) that correspond to the references?

    Scoring guide:
    - 1.0: References section present, all IDs are real and appear in tool results, all citations are relevant, inline citations present.
    - 0.7-0.9: References section present with minor issues (1 fake ID, missing inline for 1-2 items, or one irrelevant citation).
    - 0.4-0.6: References section exists but has significant issues (multiple fake IDs, mostly missing inline citations, or marginally relevant items).
    - 0.1-0.3: References section barely present or mostly hallucinated IDs.
    - 0.0: No References section found at all.

    Output strictly in the following YAML format:
    ```yaml
    score: <float 0.0-1.0>
    has_references_section: <true/false>
    grounded_count: <int, number of IDs verified in tool results>
    total_cited: <int, total number of reference entries>
    explanation: "<string>"
    ```

[package]
name = "eabench"
version = "0.1.0"
edition = "2021"
description = "EABench – Agent Execution and Evaluation Platform (Rust port)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
walkdir = "2.5"
tempfile = "3.19"
rayon = "1.11"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2.10", features = ["json", "native-tls"], default-features = false }
native-tls = "0.2"

[[bin]]
name = "eabench"
path = "src/main.rs"

[lib]
name = "eabench_lib"
path = "src/lib.rs"

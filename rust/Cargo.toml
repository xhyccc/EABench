[package]
name = "eabench"
version = "0.1.0"
edition = "2021"
description = "EABench – Agent Execution and Evaluation Platform (Rust port)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
walkdir = "2.5"
tempfile = "3.19"

[[bin]]
name = "eabench"
path = "src/main.rs"

[lib]
name = "eabench_lib"
path = "src/lib.rs"
